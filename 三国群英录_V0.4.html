<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>三国群英录 V0.4</title>
<meta name="theme-color" content="#f4efe4">
<link rel="manifest" href="site.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-180.png">
<meta name="apple-mobile-web-app-title" content="三国群英录">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="三国群英录：三百五十八位三国人物，九宫对阵，闯关与霸业。作者 Lynch。">
<style>
/* 三国群英录 · 工笔重彩，浅底亮色 */
:root{
  --paper:#f6f1e6; --paper-2:#efe8d9; --paper-3:#e5dcc8; --card:#fbf8f1;
  --ink:#2b2520; --ink-2:#5a5046; --ink-3:#8d8275; --ink-4:#bdb3a3;
  --zhu:#c0402a;      /* 朱砂 */
  --qing:#2c5f8d;     /* 石青 */
  --lv:#2e7a63;       /* 石绿 */
  --jin:#b5872c;      /* 泥金 */
  --zi:#7b4f8e;       /* 紫 */
  --t-wushuang:#c0402a; --t-hu:#b5872c; --t-ming:#7b4f8e; --t-xiao:#2c5f8d; --t-jiao:#2e7a63; --t-zu:#8d8275;
  --e0:#8d8275; --e1:#2e7a63; --e2:#2c5f8d; --e3:#7b4f8e; --e4:#c9762a; --e5:#c0402a;
  --f-title:"Kaiti SC","STKaiti","KaiTi","楷体","Noto Serif CJK SC",serif;
  --f-body:"Songti SC","STSong","SimSun","宋体","Noto Serif CJK SC",serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;touch-action:pan-x pan-y}
body{font-family:var(--f-body);color:var(--ink);background:var(--paper);line-height:1.65;
  min-height:100vh;min-height:100dvh;overscroll-behavior-y:contain;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse at 50% -10%,#fffaf0 0,rgba(255,250,240,0) 60%)}
button{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;position:relative;
  padding:env(safe-area-inset-top) calc(14px + env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
.app.wide{max-width:980px}
h1,h2,h3,.kai{font-family:var(--f-title);font-weight:400}

/* 顶栏 */
.res{display:flex;align-items:center;gap:6px;padding:10px 0 8px;font-size:.86em;border-bottom:1px solid var(--ink-4);margin-bottom:10px;flex-wrap:wrap}
.res .it{display:flex;align-items:baseline;gap:4px;margin-right:8px}
.res .it i{font-style:normal;color:var(--ink-3);font-size:.9em}
.res .it b{font-family:var(--f-title);font-weight:400;font-size:1.12em}
.res .sp{flex:1}
.res .ic{border:1px solid var(--ink-4);background:var(--card);padding:2px 9px;border-radius:3px;cursor:pointer;font-size:.9em;color:var(--ink-2)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(251,248,241,.96);border-top:1px solid var(--ink-4);
  display:flex;justify-content:center;padding:0 0 env(safe-area-inset-bottom);backdrop-filter:blur(6px)}
.nav .inner{display:grid;grid-template-columns:repeat(6,1fr);width:100%;max-width:480px}
.nav .tab{text-align:center;padding:9px 0 10px;font-family:var(--f-title);font-size:.95em;color:var(--ink-2);cursor:pointer;border-top:2px solid transparent}
.nav .tab.on{color:var(--zhu);border-top-color:var(--zhu)}

/* 通用 */
.sec{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
.sec h2{font-size:1.08em;letter-spacing:.1em;white-space:nowrap}
.sec .line{flex:1;height:1px;background:linear-gradient(90deg,var(--ink-4),transparent)}
.sec .tp{font-size:.82em;color:var(--ink-3);white-space:nowrap}
.card{background:var(--card);border:1px solid var(--paper-3);border-radius:6px;padding:12px;margin-bottom:10px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.muted{color:var(--ink-3)} .small{font-size:.84em} .tiny{font-size:.74em}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;flex-direction:column;line-height:1.25;align-items:center;justify-content:center;gap:1px;min-height:40px;padding:6px 14px;border:1px solid var(--ink-3);border-radius:4px;
  background:var(--card);cursor:pointer;font-family:var(--f-title);font-size:1em;letter-spacing:.06em;color:var(--ink);user-select:none}
.btn.main{background:var(--zhu);border-color:var(--zhu);color:#fff8ef}
.btn.qing{background:var(--qing);border-color:var(--qing);color:#f5f8fb}
.btn.off{color:var(--ink-4);border-color:var(--ink-4);background:var(--paper-2);cursor:default}
.btn.main.off{background:#d9b3aa;border-color:#d9b3aa;color:#fff}
.btn.sm{min-height:32px;padding:3px 10px;font-size:.88em}
.btns{display:flex;gap:8px;margin-top:12px}
.btns>*{flex:1 1 0;min-width:0}
.empty{text-align:center;color:var(--ink-3);padding:24px 0;font-size:.9em}
.seal{display:inline-block;font-family:var(--f-title);font-size:.76em;line-height:1;padding:3px 4px 2px;border-radius:2px;color:#fff;vertical-align:1px;white-space:nowrap}
.t-无双{background:var(--t-wushuang)} .t-虎{background:var(--t-hu)} .t-名{background:var(--t-ming)} .t-骁{background:var(--t-xiao)} .t-校{background:var(--t-jiao)} .t-卒{background:var(--t-zu)}
.c-无双{color:var(--t-wushuang)} .c-虎{color:var(--t-hu)} .c-名{color:var(--t-ming)} .c-骁{color:var(--t-xiao)} .c-校{color:var(--t-jiao)} .c-卒{color:var(--t-zu)}
.e0{color:var(--e0)} .e1{color:var(--e1)} .e2{color:var(--e2)} .e3{color:var(--e3)} .e4{color:var(--e4)} .e5{color:var(--e5)}
.eb0{background:var(--e0)} .eb1{background:var(--e1)} .eb2{background:var(--e2)} .eb3{background:var(--e3)} .eb4{background:var(--e4)} .eb5{background:var(--e5)}
.fac{display:inline-block;font-size:.76em;border:1px solid currentColor;border-radius:2px;padding:0 3px;line-height:1.35}
.f-魏{color:#2c5f8d} .f-蜀{color:#2e7a63} .f-吴{color:#c0402a} .f-汉{color:#b5872c} .f-无{color:#8d8275}
.stars{color:var(--jin);letter-spacing:-1px;font-size:.86em}
.bar{height:5px;background:var(--paper-3);border-radius:3px;overflow:hidden;position:relative}
.bar em{position:absolute;left:0;top:0;bottom:0;background:var(--lv);border-radius:3px;transition:width .25s}
.bar em.low{background:var(--zhu)}
.bar b{position:absolute;left:0;top:0;bottom:0;background:rgba(44,95,141,.55)}

/* 立绘 */
.por{position:relative;aspect-ratio:3/4;background:linear-gradient(160deg,#efe6d4,#e3d8c2);border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.por img{width:100%;height:100%;object-fit:contain;display:block}
.por .ph{font-family:var(--f-title);color:var(--ink-3);writing-mode:vertical-rl;letter-spacing:.2em;font-size:1.05em}
.por.mob{background:linear-gradient(160deg,#ece8df,#ddd6c8)}

/* 章节 */
.chap{margin-bottom:8px}
.chap .hd{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border:1px solid var(--paper-3);border-radius:6px;cursor:pointer}
.chap .hd .no{font-family:var(--f-title);color:var(--zhu);min-width:2.6em}
.chap .hd .nm{font-family:var(--f-title);font-size:1.06em;flex:1}
.chap .hd .pg{font-size:.8em;color:var(--ink-3)}
.chap.lock .hd{opacity:.5}
.chap .body{padding:6px 0 4px 10px}
.chap .intro{font-size:.86em;color:var(--ink-2);margin:4px 2px 8px;line-height:1.7}
.stg{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px dashed var(--paper-3);cursor:pointer}
.stg:last-child{border-bottom:none}
.stg .ty{font-size:.72em;padding:1px 5px;border-radius:2px;color:#fff;font-family:var(--f-title);white-space:nowrap}
.ty-主线{background:var(--ink-2)} .ty-章末{background:var(--zhu)} .ty-支线{background:var(--qing)} .ty-隐藏{background:var(--zi)}
.stg .nm{flex:1;font-family:var(--f-title);font-size:1.02em}
.stg .lv{font-size:.8em;color:var(--ink-3);white-space:nowrap}
.stg .ok{color:var(--lv);font-size:.85em}
.stg.lock{opacity:.42;cursor:default}
.lim{display:inline-block;font-size:.72em;color:var(--zhu);border:1px solid var(--zhu);border-radius:2px;padding:0 3px;margin-left:4px;vertical-align:2px}

/* 弹层 */
#modal{position:fixed;inset:0;z-index:50;display:none;background:rgba(43,37,32,.42);align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{background:var(--paper);width:100%;max-width:480px;max-height:88vh;max-height:88dvh;overflow:auto;border-radius:12px 12px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(0,0,0,.15)}
@media(min-width:700px){#modal{align-items:center}.sheet{border-radius:10px;max-width:520px}}
.shead{font-family:var(--f-title);font-size:1.2em;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.shead .x{margin-left:auto;cursor:pointer;color:var(--ink-3);font-size:.9em;padding:4px 8px}
.story{font-size:.95em;line-height:1.85;color:var(--ink-2);border-left:3px solid var(--jin);padding:2px 0 2px 10px;margin:6px 0 10px}
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:80;pointer-events:none}
#toast div{background:rgba(43,37,32,.88);color:#fbf6ec;padding:8px 16px;border-radius:5px;font-size:.92em;margin-bottom:6px;animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

/* 敌方名单 */
.foes{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin:6px 0}
.foe{text-align:center;font-size:.76em}
.foe .por{margin-bottom:2px}
.foe .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 将领列表 */
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.chip{font-size:.82em;border:1px solid var(--ink-4);border-radius:12px;padding:2px 10px;cursor:pointer;background:var(--card);color:var(--ink-2)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.hc{background:var(--card);border:1px solid var(--paper-3);border-radius:6px;padding:4px 4px 6px;cursor:pointer;position:relative}
.hc .por{margin-bottom:4px}
.hc .nm{font-family:var(--f-title);font-size:.98em;display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden}
.hc .meta{font-size:.72em;color:var(--ink-3);display:flex;justify-content:space-between}
.hc .tag{position:absolute;top:6px;left:6px;z-index:2}
.hc.inteam{border-color:var(--zhu);box-shadow:0 0 0 1px var(--zhu) inset}
.hc.sel{outline:2px solid var(--qing)}
.hc .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--zhu);z-index:2}

/* 将领详情 */
.hd-top{display:flex;gap:12px;align-items:flex-start}
.hd-top .por{width:40%;max-width:190px;flex:none}
.hd-top .info{flex:1;min-width:0}
.hd-name{font-family:var(--f-title);font-size:1.5em;line-height:1.2}
.stat4{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin:8px 0}
.stat4 div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--ink-4);font-size:.9em}
.stat4 b{font-family:var(--f-title);font-weight:400;font-size:1.05em}
.stat4 small{color:var(--ink-3);font-size:.78em;margin-left:3px}
.skill{border:1px solid var(--paper-3);background:var(--card);border-radius:6px;padding:10px;margin:8px 0}
.skill .sn{font-family:var(--f-title);font-size:1.15em;color:var(--zhu)}
.skill .st{font-size:.76em;border:1px solid var(--ink-4);border-radius:2px;padding:0 4px;margin-left:6px;color:var(--ink-2)}
.skill p{font-size:.9em;margin-top:4px;line-height:1.7}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.slot{border:1px dashed var(--ink-4);border-radius:5px;padding:7px 8px;cursor:pointer;min-height:54px;background:var(--card)}
.slot .sl{font-size:.72em;color:var(--ink-3)}
.slot .en{font-family:var(--f-title)}
.slot.fill{border-style:solid;border-color:var(--paper-3)}
.item{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px dashed var(--paper-3)}
.item .en{font-family:var(--f-title);font-size:1.02em}
.item .ed{font-size:.78em;color:var(--ink-3)}
.gseal{display:inline-block;width:1.5em;height:1.5em;line-height:1.5em;text-align:center;color:#fff;border-radius:3px;font-family:var(--f-title);font-size:.82em;flex:none}

/* 布阵 */
.form-wrap{display:flex;gap:10px;align-items:flex-start}
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:100%;max-width:240px;margin:0 auto}
.gcell{border:1px dashed var(--ink-4);border-radius:5px;background:var(--card);position:relative;cursor:pointer;aspect-ratio:3/4.6;display:flex;flex-direction:column;overflow:hidden}
.gcell .por{border-radius:0}
.gcell .gn{font-size:.74em;text-align:center;font-family:var(--f-title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 2px}
.gcell .bar{margin:0 4px 4px}
.gcell.sel{outline:2px solid var(--qing);outline-offset:1px}
.gcell.empty-c{align-items:center;justify-content:center;color:var(--ink-4);font-size:.8em}
.rowlab{font-size:.72em;color:var(--ink-3);text-align:center;margin:2px 0}

/* 战斗 */
.bf{--cw:clamp(48px,calc((100dvh - 330px) / 8.3),92px);display:flex;flex-direction:column;align-items:center;margin:4px auto 0}
.bgrid{display:grid;grid-template-columns:repeat(3,var(--cw));gap:4px}
.bf.side{--cw:clamp(56px,calc((100dvh - 300px) / 4.4),120px);flex-direction:row;justify-content:center;gap:18px}
.bf.side .vs{flex-direction:column}
.bcell{position:relative;background:var(--card);border:1px solid var(--paper-3);border-radius:4px;overflow:visible;height:calc(var(--cw) * 1.333 + 16px)}
.bcell.void{background:transparent;border:1px dashed var(--paper-3)}
.bcell .por{border-radius:3px 3px 0 0}
.bcell .por .ph{font-size:.8em}
.bcell .bn{font-size:.64em;line-height:1.3;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-title);padding:0 2px}
.bcell .bar{margin:0 3px;height:4px}
.bcell .sts{position:absolute;top:2px;left:2px;right:2px;display:flex;flex-wrap:wrap;gap:1px;z-index:3}
.bcell .sts span{font-size:.58em;background:rgba(43,37,32,.72);color:#fff;border-radius:2px;padding:0 2px;line-height:1.35}
.bcell .sts span.good{background:rgba(44,95,141,.8)}
.bcell.dead{opacity:.28;filter:grayscale(1)}
.bcell.act{box-shadow:0 0 0 2px var(--jin);z-index:4}
.bcell.hit{animation:shake .28s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:6}
.fnum{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-family:var(--f-title);font-size:1.05em;color:var(--zhu);text-shadow:0 0 3px #fff,0 0 3px #fff;white-space:nowrap;animation:up .9s forwards}
.fnum.heal{color:var(--lv)} .fnum.crit{font-size:1.4em} .fnum.miss{color:var(--ink-3)}
.fsk{position:absolute;left:50%;top:-6px;transform:translateX(-50%);background:var(--zhu);color:#fff;font-family:var(--f-title);font-size:.8em;padding:1px 6px;border-radius:3px;white-space:nowrap;animation:pop 1s forwards;z-index:7}
.fsk.prep{background:var(--qing)}
@keyframes up{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-26px}}
@keyframes pop{0%{opacity:0;transform:translate(-50%,4px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
.vs{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0;font-family:var(--f-title);color:var(--ink-3)}
.vs .rn{color:var(--zhu);font-size:1.2em}
.blog{max-height:150px;overflow:auto;font-size:.76em;color:var(--ink-2);background:var(--card);border:1px solid var(--paper-3);border-radius:5px;padding:6px 8px;margin-top:8px;line-height:1.6}
.blog.full{max-height:62vh;max-height:62dvh}
.blog>div{padding:1px 0}
.blog .r{font-family:var(--f-title);color:var(--ink-2);border-bottom:1px dotted var(--ink-4);margin-top:4px;padding-bottom:1px;font-size:1.08em}
.blog .sk{color:var(--zi)} .blog .dm{color:var(--zhu)} .blog .he{color:var(--lv)} .blog .sh{color:var(--qing)} .blog .st{color:var(--zi)}
.blog .in{color:var(--ink-3)} .blog .ps{color:var(--ink-3);font-style:italic}
.blog .ln-a{color:var(--qing);font-weight:600} .blog .ln-f{color:var(--zhu);font-weight:600}
.bd-side{font-family:var(--f-title);font-size:.9em;color:var(--ink-2);margin:6px 0 2px;letter-spacing:.2em}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:.78em}
.bd-col i{display:block;font-style:normal;color:var(--ink-3);border-bottom:1px solid var(--paper-3);margin-bottom:2px}
.bd-col span{display:flex;justify-content:space-between;gap:4px}
.bd-col em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-col u{text-decoration:none;color:var(--ink-2)}
.bd-col .r0 em{color:var(--zhu)} .bd-col .none{color:var(--ink-4)}
.ctrl{display:flex;gap:6px;justify-content:center;margin-top:8px}
.result{text-align:center;font-family:var(--f-title);font-size:2em;letter-spacing:.3em;margin:8px 0}
.result.win{color:var(--zhu)} .result.lose{color:var(--ink-3)}

/* 标题 */
.title-page{min-height:88vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.title-page h1{font-size:2.6em;letter-spacing:.3em;margin-left:.3em;color:var(--ink)}
.title-page .sub{color:var(--ink-3);font-size:.9em;letter-spacing:.2em}
.title-page .seal-big{width:64px;height:64px;background:var(--zhu);color:#fff;font-family:var(--f-title);font-size:2.1em;display:flex;align-items:center;justify-content:center;border-radius:6px;margin-bottom:6px}
.title-page .btn{width:220px}
.title-page .ver{font-size:.75em;color:var(--ink-4);margin-top:16px}

/* 招贤结果 */
.pulls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pull{text-align:center;font-size:.76em}
.pull .nm{font-family:var(--f-title);font-size:1.05em;white-space:nowrap;overflow:hidden}
.pull .new{color:var(--zhu)}

/* 霸业地图 */
.map{position:relative;width:100%;aspect-ratio:1/1.02;background:#f1ead9;border:1px solid var(--paper-3);border-radius:8px;overflow:hidden}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.city{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer;z-index:2}
.city .dot{margin:0 auto;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.city .cn{font-family:var(--f-title);font-size:.7em;white-space:nowrap;text-shadow:0 0 2px #f6f1e6,0 0 2px #f6f1e6;line-height:1.1;margin-top:1px}
.city.sel .dot{box-shadow:0 0 0 3px var(--jin)}
.city.can .cn{color:var(--zhu);font-weight:bold}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.78em;margin:6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px;vertical-align:-1px}
.cq-log{font-size:.8em;color:var(--ink-2);max-height:150px;overflow:auto}

/* ---- V0.2 借鉴水浒：大帐、图鉴、章首卡、战力对比 ---- */
.nav .inner.two{grid-template-columns:repeat(4,1fr)}
.nav .inner.two .tab{padding:6px 0 7px}
.app{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.banner{text-align:center;padding:14px 0 6px}
.banner .bt{font-family:var(--f-title);font-size:1.9em;letter-spacing:.25em}
.banner .bs{font-size:.8em;color:var(--ink-3);letter-spacing:.15em}
.banner .btitle{color:var(--zhu);font-family:var(--f-title);margin-top:2px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;border-top:1px solid var(--ink-4);border-bottom:1px solid var(--ink-4);padding:8px 0;margin:10px 0}
.stat3 b{display:block;font-family:var(--f-title);font-weight:400;font-size:1.4em}
.stat3 i{font-style:normal;font-size:.76em;color:var(--ink-3)}
.nextup{border:1px solid var(--zhu);border-left-width:4px;background:var(--card);border-radius:5px;padding:9px 12px;cursor:pointer;margin:10px 0}
.nextup .k{font-size:.72em;color:var(--zhu);letter-spacing:.2em}
.nextup .v{font-family:var(--f-title);font-size:1.15em}
.nextup .m{font-size:.8em;color:var(--ink-3)}
.logbox div{border-bottom:1px dotted var(--paper-3);padding:2px 0}
.contact{text-align:center;font-size:.78em;color:var(--ink-3);margin:22px 0 6px;cursor:pointer}
.contact b{color:var(--ink-2);margin:0 3px}
.contact i{font-style:normal;color:var(--ink-4);margin-left:6px}
.stele{text-align:center;border:1px solid var(--ink-4);background:var(--card);border-radius:6px;padding:12px;margin:8px 0 4px}
.stele .st-t{font-family:var(--f-title);font-size:1.5em;letter-spacing:.4em}
.stele .st-s{font-size:.78em;color:var(--ink-3)}
.stele .st-n{font-size:.9em;margin-top:4px}
.stele .st-n b{font-family:var(--f-title);font-size:1.6em;font-weight:400;color:var(--zhu)}
.codex{display:flex;flex-wrap:wrap;gap:4px}
.cx{font-family:var(--f-title);font-size:.84em;border:1px solid currentColor;border-radius:3px;padding:1px 5px;min-width:3.6em;text-align:center;cursor:pointer;background:var(--card)}
.cx.no{color:var(--ink-4);border-color:var(--paper-3);cursor:default}
.cx small{margin-left:3px;font-size:.8em;color:var(--ink-3)}
.chapcard{text-align:center;padding:30px 10px 16px;cursor:pointer}
.chapcard .cc-ch{font-size:.85em;color:var(--zhu);letter-spacing:.3em}
.chapcard .cc-t{font-family:var(--f-title);font-size:2em;letter-spacing:.2em;margin:4px 0}
.chapcard .cc-y{font-size:.8em;color:var(--ink-3)}
.chapcard .cc-rule{width:60px;height:1px;background:var(--jin);margin:12px auto}
.chapcard .cc-l{font-size:.95em;line-height:1.9;color:var(--ink-2);max-width:340px;margin:0 auto}
.chapcard .cc-go{font-size:.75em;color:var(--ink-4);margin-top:20px}
.vsbar{display:flex;align-items:center;justify-content:space-between;margin:8px 0 4px}
.vsbar .side{text-align:center;min-width:5em}
.vsbar .side b{display:block;font-family:var(--f-title);font-weight:400;font-size:1.2em}
.vsbar .side i{font-style:normal;font-size:.72em;color:var(--ink-3)}
.vsbar .mid{font-family:var(--f-title);font-size:1.15em;letter-spacing:.15em}
.vsbar .mid.v-ok{color:var(--lv)} .vsbar .mid.v-mid{color:var(--jin)} .vsbar .mid.v-bad{color:var(--zhu)}
.pbar{height:5px;background:var(--zhu);border-radius:3px;overflow:hidden;opacity:.85}
.pbar em{display:block;height:100%;background:var(--qing)}

/* 羁绊 */
.bonds .bd{display:flex;gap:8px;align-items:baseline;margin-top:3px}
.bonds .bd .bn{font-family:var(--f-title);color:var(--zhu)}
.bonds .bd i{font-style:normal;font-size:.8em;color:var(--ink-3)}
.bms{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0}
.bm{font-size:.8em;padding:0 4px;border:1px solid var(--paper-3);border-radius:2px;color:var(--ink-4)}
.bm.own{color:var(--ink-2);border-color:var(--ink-4)}
.bm.in{color:#fff;background:var(--zhu);border-color:var(--zhu)}
.brow{padding:6px 2px;border-bottom:1px dashed var(--paper-3)}
.brow .tiny{margin-left:8px}
.brow.ok b{color:var(--zhu)}
.bcard{margin-top:6px}

/* 天象 */
.txs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tx{border:1px solid var(--ink-4);background:var(--card);border-radius:3px;padding:6px;text-align:center;font-size:.8em}
.tx .tn{font-family:var(--f-title);font-size:1.3em;color:var(--zhu);letter-spacing:.2em}
.tx .tg{color:var(--ink);margin-top:3px}
.tx .tb{color:var(--ink-3);margin:2px 0 4px}
.tx .tb::before{content:'但 '}

/* 功名 */
.ach{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px dashed var(--paper-3)}
.ach .tier{font-size:.72em;margin-left:6px;padding:0 4px;border:1px solid var(--ink-4);border-radius:2px;color:var(--ink-3)}
.ach .t-大,.ach .t-特{color:var(--zhu);border-color:var(--zhu)}
.ach.got{opacity:.6}
.ach.pend b{color:var(--zhu)}
.ach-up{border-color:var(--zhu)}

.imp{margin-top:14px;font-size:.85em;color:var(--ink-3);text-decoration:underline;cursor:pointer}

.sellbar{display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:5;background:var(--paper);border:1px solid var(--zhu);border-radius:3px;padding:6px 8px;margin:6px 0;font-size:.86em}
.item.picked{background:rgba(180,60,40,.06)}
[data-a=eq-info]{cursor:pointer}
.lim.zhuan{background:var(--zhu);color:#fff;border-color:var(--zhu)}
.lim.zhuan.done{background:var(--ink-4);border-color:var(--ink-4)}

/* 开篇、尾声 */
.crawl{position:fixed;inset:0;background:var(--paper);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;cursor:pointer;overflow:auto}
.crawl-in{max-width:30em;line-height:2;font-family:var(--f-title)}
.cr-h{font-size:1.5em;letter-spacing:.3em;text-align:center;margin:0 0 1em;color:var(--zhu)}
.cr-p{margin:0 0 .9em;color:var(--ink)}
.cr-h,.cr-p{opacity:0;animation:crIn 1.2s ease forwards}
@keyframes crIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.crawl-skip{position:fixed;bottom:18px;left:0;right:0;text-align:center;font-size:.8em;color:var(--ink-3)}

/* 场景原画：没图就不渲染 */
.scene-full{position:fixed;inset:0;background:center/cover no-repeat;opacity:.18;pointer-events:none}
.crawl-in{position:relative}
.cc-scene{height:150px;margin:-10px -10px 10px;background:center/cover no-repeat;opacity:.55;-webkit-mask-image:radial-gradient(ellipse at center,#000 45%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 45%,transparent 75%)}
.sc-band{height:120px;margin:-14px -14px 8px;background:center/cover no-repeat;opacity:.30;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}

.copy{margin-top:18px;font-size:.72em;line-height:1.7;color:var(--ink-3);text-align:center;cursor:pointer}
ol.lic{margin:4px 0 6px;padding-left:1.6em}
ol.lic li{margin:2px 0}

</style>

"year":"","intro":"董卓迁都长安，王允在府里对着月亮叹气，貂蝉在后面听着。"},"5":{"name":"群雄逐鹿（191–194）","year":"","intro":"董卓死了，天下没太平，反倒是人人都想当董卓。"},"6":{"name":"江东小霸王（195–200）","year":"","intro":"孙策拿传国玺押给袁术，借了三千兵回江东，五年打下六郡。"},"7":{"name":"辕门射戟（196–198）","year":"","intro":"吕布抢了徐州，刘备反倒住进了小沛。两年后下邳城被水泡了三个月。"},"8":{"name":"煮酒论英雄（199–200）","year":"","intro":"许都的天子是个摆设，刘备在后园种菜，种得很认真。"},"9":{"name":"千里走单骑（200）","year":"","intro":"关羽降了汉，没降曹。曹操给了他一匹马，他谢了，说这马快，能早点去找哥哥。"},"10":{"name":"官渡之战（200–202）","year":"","intro":"袁绍七十万，曹操七万，粮草够一个月。"},"11":{"name":"三顾茅庐（207–208）","year":"","intro":"刘备在新野住了七年，腿上长了肉，哭了一场，然后去了隆中。"},"12":{"name":"长坂坡（208）","year":"","intro":"十几万百姓跟着刘备走，一天十里。虎豹骑一天三百里。"},"13":{"name":"赤壁·上（208）","year":"","intro":"诸葛亮过江，江东文官排在堂下等他。周瑜在后面等着看。"},"14":{"name":"赤壁·下（208）","year":"","intro":"东南风起，二十条火船。"},"15":{"name":"三气周瑜（209–210）","year":"","intro":"周瑜三十六岁，气死的。他临死前说的话，孙权没听懂。"},"16":{"name":"马超复仇（211）","year":"","intro":"马腾死在许都。马超带西凉二十万人到了潼关。"},"17":{"name":"取西川（211–214）","year":"","intro":"张松带着西川地图去许都，曹操没正眼看他。他回头去了荆州。"},"18":{"name":"汉中王（215–219）","year":"","intro":"刘备在汉中筑坛称王，五虎上将的名单发下去，关羽看了一眼。"},"19":{"name":"走麦城（219）","year":"","intro":"关羽水淹七军，威震华夏。四个月后他死在临沮。"},"20":{"name":"夷陵之战（220–223）","year":"","intro":"曹丕篡汉，刘备称帝，然后带七十万人去给关羽报仇。"},"21":{"name":"七擒孟获（225）","year":"","intro":"南中三郡反了，诸葛亮五月渡泸，深入不毛。"},"22":{"name":"出师北伐（227–228）","year":"","intro":"建兴五年春，诸葛亮上表出师。表上写着「臣本布衣」。"},"23":{"name":"六出祁山（228–234）","year":"","intro":"五丈原的秋风，帐中七盏灯。"},"24":{"name":"司马篡魏（239–260）","year":"","intro":"司马懿装病装了十年，曹爽陪着少帝出城祭祖那天，他好了。"},"25":{"name":"姜维九伐（249–262）","year":"","intro":"诸葛亮死了二十八年，姜维还在往北打。"},"26":{"name":"三国归晋（263–280）","year":"","intro":"天下大势，分久必合。"},"27":{"name":"黄巾余烬","year":"","intro":""},"28":{"name":"西凉羌胡","year":"","intro":""},"29":{"name":"南蛮秘境","year":"","intro":""},"30":{"name":"边地烽火","year":"","intro":""}},"stages":{"1|桃园三结义":"刘备看着榜叹气，身后一个黑脸大汉喝道：大丈夫不为国出力，何故长叹？","1|大破程远志":"程远志领五万黄巾犯涿郡，邹靖手里只有五百乡勇，三个新拜的兄弟站在最前头。","1|颍川解围":"长社一把火，黄巾溃兵漫山遍野往北跑，正撞上刘备的队伍。","1|广宗之战":"张角病死，张梁守广宗，城下黄巾摆了三十六方的阵。","1|太平要术":"张角死后，那三卷天书没人知道去了哪。","2|鞭打督邮":"安喜县督邮索贿不成，要害刘备，张飞把他绑在县前的马桩上。","2|宫门之变":"何进进宫，嘉德殿门一关，十常侍的刀已经在袖子里。","2|董卓进京":"西凉兵进了洛阳，董卓每天带铁甲卫士出入宫廷，百官没人敢说话。","2|吕布杀丁原":"李肃牵着赤兔马进了吕布的营帐，天亮时丁原的头挂在辕门上。","3|矫诏聚义":"曹操刺董不成逃回陈留，散了家财招兵，十八路诸侯的旗在酸枣立起来。","3|汜水关":"华雄连斩鲍忠、祖茂、俞涉、潘凤，帐中诸侯的脸色一个比一个白。","3|温酒斩华雄":"关羽出帐时，曹操斟的那杯酒还热着。","3|三英战吕布":"虎牢关前，吕布方天画戟一挑，八路诸侯十几员将没人接得住三合。","3|洛阳井中物":"洛阳宫里一口井，井底沉着个宫女，怀里抱着个匣子。","4|火烧洛阳":"董卓一把火烧了洛阳，曹操追到荥阳，徐荣在半路等着。","4|凤仪亭":"貂蝉在凤仪亭边扑向池子，吕布抱住她，董卓的画戟从后面掷了过来。","4|诛董卓":"董卓乘车入朝受禅，车到宫门，两旁伏了一百多人。","4|李郭反攻长安":"贾诩对李傕郭汜说，你们要是散伙，一个亭长就能把你们抓了。","5|界桥之战":"麹义的先登死士射倒了白马义从，一个常山少年从阵里杀出来。","5|岘山伏兵":"孙坚追刘表追进了岘山，山上滚石乱箭一齐下来。","5|陶谦让徐州":"曹操报父仇，兵锋所至鸡犬不留，刘备带着几千兵去救徐州。","5|濮阳大战":"濮阳城的火光里，曹操险些死在吕布戟下，问他曹操在哪，他指了指前面。","5|白马义从":"公孙瓒的白马义从是在幽州边上打乌桓练出来的。","6|传国玺借兵":"袁术收了玉玺，给了三千兵，孙策连夜过江。","6|神亭酣斗":"神亭岭上太史慈和孙策打到天黑，一个抢了头盔一个抢了短戟。","6|平定江东":"严白虎、王朗、刘繇一个一个倒下，孙策从此人称小霸王。","6|小霸王之死":"许贡的三个门客等在丹徒的猎场，孙策的马跑得太快，卫士没跟上。","6|于吉的符水":"于吉死后，城楼上的人夜夜看见他。","7|吕布袭徐州":"张飞喝醉了打曹豹，曹豹连夜开门放吕布进城。","7|辕门射戟":"纪灵带三万兵来打小沛，吕布把画戟插在辕门外一百五十步。","7|宛城之战":"张绣先降后叛，典韦守在营门口，手里没有双戟。","7|白门楼":"侯成宋宪魏续绑了吕布献城，白门楼上曹操问刘备：你怎么看？","7|陈宫的最后一计":"陈宫劝吕布出城成犄角之势，吕布听了严氏的话，没出去。","8|许田打围":"曹操接了献帝的箭射死那只鹿，站在天子前面受了百官的贺。","8|衣带诏":"董承带着缝在衣带里的血诏出宫，一路不敢回头。","8|煮酒论英雄":"曹操说天下英雄唯使君与操耳，刘备的筷子掉在地上，正巧一声雷。","8|徐州失守":"曹操亲征徐州，刘备兵败投袁绍，张飞逃入芒砀山，关羽困在下邳。","9|土山约三事":"张辽上土山劝关羽，关羽提了三件事，一件都不能少。","9|斩颜良诛文丑":"白马坡下颜良在麾盖下，只看见一匹赤兔马冲过来。","9|过五关斩六将":"东岭、洛阳、汜水、荥阳、滑州，五道关六个守将，一把青龙刀。","9|古城会":"古城外张飞挺矛就刺，说你要是真心，三通鼓内斩了追来的蔡阳。","10|白马延津":"袁绍大军压到官渡，田丰在冀州牢里，沮授在军中被看着。","10|许攸夜奔":"许攸半夜到曹营，曹操光着脚出来迎他。","10|火烧乌巢":"乌巢是袁绍的粮仓，淳于琼喝醉了睡在营里。","10|官渡决战":"粮烧了，张郃高览投了曹操，七十万人一夜散了。","10|冀州府库":"袁家四世三公，冀州府库里的东西比皇宫多。","10|河北四庭柱":"颜良文丑张郃高览，河北人叫他们四庭柱。","11|跃马檀溪":"蔡瑁在襄阳设宴要杀刘备，的卢马一跃三丈过了檀溪。","11|三顾茅庐":"第三次去隆中，半路撞上夏侯惇派来的探马。那个人在睡午觉，刘备在阶下站了两个时辰。","11|火烧博望":"夏侯惇十万兵到博望坡，诸葛亮第一次调兵，关羽张飞不太服。","11|火烧新野":"曹仁进了新野空城，屋顶上全是干柴硫磺。","11|水镜山庄":"司马徽说卧龙凤雏，得一可安天下。","12|携民渡江":"刘备说百姓跟我来的，我怎么能丢下他们。","12|赵云救主":"长坂坡上赵云杀了七进七出，怀里的阿斗睡着了。","12|据水断桥":"长坂桥头张飞一个人，桥后二十个骑兵拖着树枝来回跑。","12|曹操南下":"曹操得了荆州，八十三万人马顺江而下，写信给孙权说要会猎于吴。","12|徐母的信":"徐母那封信的字，是程昱临的。","13|舌战群儒":"张昭第一个开口 <script>
/* ---- engine_battle.js ---- */
// 三国群英录 · 战斗引擎（从 sim/engine.py + sim/dsl.py + sim/skills_custom.py 逐行搬过来）
// 不碰 DOM。浏览器里挂在 window.SG，node 里 module.exports。
(function (G) {
'use strict';
const SG = G.SG = G.SG || {};

// ---------------- 随机数 ----------------
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function makeRng(seed) {
  const f = seed == null ? Math.random : mulberry32(seed);
  const R = {
    random: f,
    uniform: (a, b) => a + (b - a) * f(),
    choice: L => { if (!L.length) throw new IndexError('choice'); return L[Math.floor(f() * L.length)]; },
    sample: (L, n) => {
      if (n > L.length) throw new Error('sample larger than population');
      const c = L.slice(), out = [];
      for (let i = 0; i < n; i++) { const j = i + Math.floor(f() * (c.length - i)); const t = c[i]; c[i] = c[j]; c[j] = t; out.push(c[i]); }
      return out;
    },
    shuffle: L => { for (let i = L.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); const t = L[i]; L[i] = L[j]; L[j] = t; } return L; },
    randint: (a, b) => a + Math.floor(f() * (b - a + 1)),
  };
  return R;
}
// 战斗用的全局随机源，可以换成带种子的
let R = makeRng();
SG.setBattleSeed = s => { R = makeRng(s); SG.R = R; };
SG.makeRng = makeRng;
SG.R = R;

class IndexError extends Error { constructor(m) { super(m); this.name = 'IndexError'; } }
SG.IndexError = IndexError;
function first(L) { if (!L || !L.length) throw new IndexError('list index out of range'); return L[0]; }
function argmax(L, key) { if (!L.length) throw new Error('max() arg is an empty sequence'); let b = L[0], bk = key(b); for (let i = 1; i < L.length; i++) { const k = key(L[i]); if (k > bk) { b = L[i]; bk = k; } } return b; }
function argmin(L, key) { if (!L.length) throw new Error('min() arg is an empty sequence'); let b = L[0], bk = key(b); for (let i = 1; i < L.length; i++) { const k = key(L[i]); if (k < bk) { b = L[i]; bk = k; } } return b; }
function sortBy(L, key) { const m = L.map((x, i) => [key(x), i, x]); m.sort((a, b) => a[0] - b[0] || a[1] - b[1]); return m.map(x => x[2]); }
function pyRound(x) { const r = Math.round(x); return (Math.abs(x % 1) === 0.5 && r % 2 !== 0) ? r - 1 : r; }
SG.util = { first, argmax, argmin, sortBy, pyRound };

const BASE = 0.30, GAMMA = 2.0;
const CTRL = ['震慑', '混乱', '缴械', '计穷', '怯战', '挑衅', '迷惑'];
const STARK = { 1: 0, 2: .05, 3: .10, 4: .15, 5: .20 };
SG.CTRL = CTRL;

// ---------------- Unit ----------------
class Unit {
  constructor(h, lv = 50, star = 1) {
    this.name = h['名']; this.faction = h['阵营']; this.role = h['定位']; this.tier = h['品阶'];
    const g = (k, gk) => (parseFloat(h[k]) + parseFloat(h[gk]) * (lv - 1)) * (1 + STARK[star]);
    this.base = { atk: g('武力', '武成长'), def: g('统率', '统成长'), int: g('智力', '智成长'), agi: g('速度', '速成长') };
    this.lv = lv; this.star = star;
    this.maxhp = lv * 1000.0; this.hp = this.maxhp; this.lvhp = this.maxhp;
    this.buffs = []; this.status = {}; this.shield = 0.0;
    this.skill = null; this.extras = []; this.equip = [];
    this.prep = null; this.flags = {};
    this.team = null; this.side = 0; this.idx = 0; this.battle = null;
    this.taunt_by = null; this.hidden = 0; this.once = new Set();
    this.tally = { dealt: 0, taken: 0, healed: 0 };
  }
  alive() { return this.hp > 0; }
  front() { return this.idx < 3; }
  stat(k) {
    let pct = 0; for (const b of this.buffs) if (b[0] === k) pct += b[1];
    pct = Math.max(-0.30, Math.min(0.25, pct));
    let flat = 0, epct = 0;
    for (const e of this.equip) {
      if (e['维'] === k) {
        flat += parseFloat(e['固定']) * (e['归属'] === this.name ? 1.5 : 1.0);
        epct += parseFloat(e['百分比']) / 100;
      }
    }
    return (this.base[k] + flat) * (1 + pct + epct);
  }
  addbuff(k, pct, rounds = -1, tag = null) {
    if (tag) { for (const b of this.buffs) if (b[3] === tag) { b[1] = pct; b[2] = rounds; return; } }
    this.buffs.push([k, pct, rounds, tag]);
  }
  flag(k) {
    let s = 0; for (const b of this.buffs) if (b[0] === k) s += b[1];
    const v = this.flags[k];
    if (typeof v === 'number') s += v; else if (v === true) s += 1;
    return s;
  }
  has(s) { return (this.status[s] || 0) > 0; }
  add_status(s, rounds, prob = 1.0, src = null) {
    const b = this.battle;
    if (CTRL.includes(s) && src != null) {
      prob = Math.min(0.95, (prob + src.flag('ctrlhit')) * Math.sqrt(Math.max(0.2, src.stat('int') / Math.max(1, this.stat('int')))));
    }
    if (b.hook_all('resist_status', this, s)) return false;
    if (s === '隐身') { this.hidden = Math.max(this.hidden, rounds); return true; }
    if (s === '挑衅' && this.flags['immune_taunt']) return false;
    if (s === '震慑' && this.flags['吓死']) { this.hp = 0; b.say(`${this.name} 吓死`, { t: 'die', u: this }); return true; }
    if (R.random() < prob) {
      let r = CTRL.includes(s) ? rounds + Math.trunc(pyRound(this.flag('ctrllen'))) : rounds;
      if (CTRL.includes(s)) r = Math.max(1, r);
      this.status[s] = Math.max(this.status[s] || 0, r);
      b.say(`${this.name} ${s}`, { t: 'st', u: this, s, n: this.status[s], by: src });
      if ((s === '震慑' || s === '混乱' || s === '计穷') && this.prep && !this.flags['prep_unbreak']) this.prep = null;
      return true;
    }
    if (src && b.log) b.say(`${this.name} 抵抗 ${s}`, { t: 'resist', u: this, s, p: prob, by: src });
    return false;
  }
  cleanse() { for (const s of CTRL) delete this.status[s]; }
  dispel() {
    this.buffs = this.buffs.filter(b => b[1] < 0 || (b[2] === -1 && b[3] && b[3].startsWith('perm')));
    this.shield = 0;
  }
  ratio() { return this.hp / this.maxhp; }
}
SG.Unit = Unit;


// ---- 羁绊（V0.3）：同一方阵上凑齐给满、四人以上凑半数给一半；每人每项合计封顶 12% ----
SG.BONDS = [];
SG.BOND_ON = true;
const BOND_CAP = 0.12;
function bondTier(n, c) { if (c >= n) return 1; if (n >= 4 && c >= Math.max(2, Math.ceil(n / 2))) return 0.5; return 0; }
function activeBonds(names) {
  const s = new Set(names), out = [];
  for (const b of SG.BONDS) { const c = b.mem.filter(m => s.has(m)).length; const t = bondTier(b.mem.length, c); if (t) out.push({ b, t, c }); }
  return out;
}
function applyBonds(team) {
  const act = activeBonds(team.map(u => u.name));
  for (const u of team) {
    const tot = {};
    for (const { b, t } of act) if (b.mem.includes(u.name)) tot[b.k] = (tot[b.k] || 0) + b.v * t;
    for (const k in tot) u.addbuff(k, Math.min(BOND_CAP, tot[k]), -1, 'perm羁绊' + k);
  }
  return act;

}

// ---------------- 天象（V0.3，二周目起） ----------------
// 每颗一好一坏。A 我方单位，B 敌方单位，b 这一阵的 Battle。百分比加成走 perm buff，跟技能、羁绊同一个 25% 封顶。
const addf = (u, k, v) => { u.flags[k] = (u.flags[k] || 0) + v; };

  { id: '太白', good: '我方兵刃伤害 +12%', bad: '我方受到的兵刃伤害 +8%', g: { A: u => addf(u, 'physout', .12) }, b: { A: u => addf(u, 'physin', .08) } },
  { id: '辰星', good: '我方谋略伤害 +12%', bad: '我方受到的谋略伤害 +8%', g: { A: u => addf(u, 'magout', .12) }, b: { A: u => addf(u, 'magin', .08) } },
  { id: '镇星', good: '我方统率 +12%', bad: '我方速度 −10%', g: { A: u => u.addbuff('def', .12, -1, 'perm天象') }, b: { A: u => u.addbuff('agi', -.10, -1, 'perm天象g') } },
  { id: '天狼', good: '首通黄金 +1', bad: '敌方每关多一个杂兵；加不进人的关（满九人、单挑、车轮战）敌方兵力 +10%' },
  { id: '贪狼', good: '装备掉落翻倍（首通两件，复刷四成）', bad: '掉落品阶降一档' },
  { id: '破军', good: '我方全属性 +6%', bad: '羁绊全部失效', g: { A: u => { for (const k of ['atk', 'def', 'int', 'agi']) u.addbuff(k, .06, -1, 'perm天象' + k); } }, b: { battle: bt => { bt.nobond = [true, false]; } } },
  { id: '七杀', good: '我方追击率 +10%', bad: '敌方追击率 +10%', g: { A: u => addf(u, 'pursue', .10) }, b: { B: u => addf(u, 'pursue', .10) } },
  { id: '文曲', good: '我方主动技发动率 +5%', bad: '我方普攻伤害 −5%', g: { A: u => addf(u, 'rate', .05) }, b: { A: u => addf(u, 'atkmult', -.05) } },
  { id: '武曲', good: '我方前排受到的伤害 −20%', bad: '我方后排受到的伤害 +20%', g: { battle: bt => { for (const u of bt.teams[0]) if (u.front()) u.addbuff('dmgin', -.20, -1, 'perm武曲'); } }, b: { battle: bt => { for (const u of bt.teams[0]) if (!u.front()) u.addbuff('dmgin', .20, -1, 'perm武曲'); } } },
  { id: '紫微', good: '每回合末我方全体回兵 2%', bad: '华佗不在麾下时，我方开场兵力 −8%', g: { battle: bt => { bt.regen = [.02, 0]; } }, b: { A0: (A, opt) => { if (!opt.huatuo) for (const u of A) u.hp *= .92; } } },

const TXID = {}; TX.forEach(t => TXID[t.id] = t);
SG.TX = TX; SG.TXID = TXID;
// opt.tx：天象 id 列表；opt.huatuo：华佗在不在麾下；opt.txHalf：{id: 'g'|'b'} 只开一半（验收用）
function txParts(opt) {

// 天狼：加不进杂兵的关改成敌方兵力 +10%
function tlFull(stage, cycle, opt) { return (opt.tx || []).includes('天狼') && (opt.txHalf || {})['天狼'] !== 'g' && txMob(stage, stageFoes(stage, cycle).names).length === stageFoes(stage, cycle).names.length; }

// 打一关。A：玩家单位（已按阵位排好）；ease：敌方四维系数；cells：玩家阵位（0–8，前排 0–2），可选

// ---------------- 存档与养成（闯关） ----------------
const SAVE_KEY = 'sgqyl_campaign_v1';
function today() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }

class Game {
  constructor(s) { this.s = s; this.rng = SG.makeRng((s.seed ^ (s.draws * 7919) ^ (s.smithDraws * 104729) ^ Date.now()) >>> 0); }
  static fresh(seed) {

    const s = { v: 1, seed, cycle: 1, gold: CFG.start_gold, gold2: 0, heroes: {}, draws: 0, sinceHu: 0, smithDraws: 0, sinceZhen: 0, tokens: 0, tokensBought: 0, bag: [], gear: {}, uid: 1, cleared: {}, replay: { day: today(), n: {} }, formation: [null, null, null, null, null, null, null, null, null], seen: {}, log: [] };
    const g = new Game(s);
    const rng = SG.makeRng(seed);
    const gift = [rng.choice(SG.D.HLIST), rng.choice(SG.D.HLIST)];
    gift.forEach(n => g.addHero(n));
    s.gift = gift;
    // 开局两人先上阵
    s.formation[1] = gift[0]; if (gift[1] !== gift[0]) s.formation[4] = gift[1];
    return g;
  }
  // ---- 基本 ----
  get D() { return SG.D; }
  maxLv() { return Math.min(70, 50 + 10 * (this.s.cycle - 1)); }

  txHas(id) { return this.s.cycle >= 2 && !!this.s.tx && this.s.tx.on.includes(id); }
  ensureTx() { if (this.s.cycle >= 2 && (!this.s.tx || this.s.tx.cycle !== this.s.cycle)) this.rollTx(); }
  rollTx() {
    const ids = TX.map(t => t.id), on = [];

    this.s.tx = { cycle: this.s.cycle, on, used: [false, false, false], seen: on.slice() };
  }
  rerollTx(i) {
    this.ensureTx(); const T = this.s.tx;
    if (!T || T.used[i]) return { err: '这颗换过了' };
    if (this.s.tokens < CFG.tx_reroll) return { err: `兵符不够，要 ${CFG.tx_reroll} 枚` };
    const pool = TX.map(t => t.id).filter(x => !T.seen.includes(x));
    if (!pool.length) return { err: '没有可换的了' };
    const x = this.rng.choice(pool);
    this.s.tokens -= CFG.tx_reroll; T.on[i] = x; T.used[i] = true; T.seen.push(x);
    return { ok: true, id: x };
  }
  // 这一关能掉谁的专属、各缺几件
  exclOf(id) {
    const st = this.D.STAGE[id], typ = st['类型'];
    const pe = typ === '章末' ? CFG.boss_excl : typ === '隐藏' ? CFG.hidden_excl : typ === '支线' ? CFG.side_excl : 0;
    if (!pe) return null;
    const have = new Set(this.s.bag.map(it => it.id));
    const L = this.foesOf(id).names.filter(n => this.D.EXCL[n]).map(n => ({ n, miss: this.D.EXCL[n].filter(e => !have.has(e.id)).length }));
    return L.length ? { pe, L, done: L.every(x => !x.miss) } : null;
  }
  bondsOff() { return this.txHas('破军'); }
  foesOf(id) { return stageFoes(this.D.STAGE[id], this.s.cycle, this.txList()); }
  hero(n) { return this.s.heroes[n]; }
  addHero(n) {
    const h = this.s.heroes[n];
    if (h) { h.frag += CFG.frag_per_dup; return { name: n, dup: true }; }
    this.s.heroes[n] = { lv: 1, star: 1, frag: 0, hp: 1000 };
    this.s.seen[n] = 1;
    return { name: n, dup: false };
  }
  maxhp(n) { return this.s.heroes[n].lv * 1000; }
  // ---- 练级 ----
  trainCost(n, to) { const h = this.hero(n); let c = 0; for (let l = h.lv + 1; l <= to; l++) c += CFG.train_cost(l); return c; }
  train(n, k = 1) {
    const h = this.hero(n); let did = 0;
    while (did < k && h.lv < this.maxLv()) {
      const c = CFG.train_cost(h.lv + 1);
      if (this.s.gold < c) break;
      this.s.gold -= c; h.lv++; h.hp += 1000; did++;   // 新增的一千兵是满的
    }
    return did;
  }
  // ---- 征兵 ----
  recruitCost(n) { const h = this.hero(n); const lack = Math.max(0, h.lv * 1000 - h.hp); return Math.ceil(lack / 1000 * CFG.recruit_per_k * h.lv); }
  recruit(n) { const c = this.recruitCost(n); if (!c || this.s.gold < c) return false; this.s.gold -= c; this.hero(n).hp = this.hero(n).lv * 1000; return true; }
  recruitAllCost(names) { return names.reduce((a, n) => a + this.recruitCost(n), 0); }
  // ---- 招贤 ----
  drawTier() {
    const r = this.rng.random(); let acc = 0, tier = '校';
    for (const t of TIER_ORDER) { acc += CFG.pool[t]; if (r < acc) { tier = t; break; } }
    this.s.draws++; this.s.sinceHu++;
    if (this.s.sinceHu >= 50 && TIER_ORDER.indexOf(tier) < 3) tier = '虎';
    if (tier === '虎' || tier === '无双') this.s.sinceHu = 0;
    return tier;
  }
  draw(k) {
    const cost = k === 10 ? CFG.draw10 : CFG.draw * k;
    if (this.s.gold < cost) return null;
    this.s.gold -= cost;
    const tiers = []; for (let i = 0; i < k; i++) tiers.push(this.drawTier());
    if (k === 10 && tiers.every(t => TIER_ORDER.indexOf(t) < 2)) tiers[9] = '名';

  }

    const t = this.rng.random() < CFG.pool['无双'] / (CFG.pool['无双'] + CFG.pool['虎']) ? '无双' : '虎';

  tokenCost(k) { let c = 0; for (let i = 0; i < k; i++) c += this.tokenPrice(i); return c; }

  starNeed(n) { const h = this.hero(n); if (h.star >= 5) return 0; return Math.trunc(pyRound(CFG.star_need[h.star] * CFG.star_q[this.D.H[n]['品阶']])); }
  canStar(n) { const h = this.hero(n), need = this.starNeed(n); return h.star < 5 && h.frag + this.s.tokens >= need; }
  starUp(n) {
    const h = this.hero(n), need = this.starNeed(n);
    if (h.star >= 5 || h.frag + this.s.tokens < need) return false;
    const useF = Math.min(h.frag, need); h.frag -= useF; this.s.tokens -= (need - useF); h.star++; return true;
  }
  // ---- 装备 ----
  curChapter() {
    let ch = 1;
    for (const s of this.D.STAGES) if ((s['类型'] === '主线' || s['类型'] === '章末') && this.stageUnlocked(s.id)) ch = Math.max(ch, +s['章']);
    return Math.min(26, ch);
  }
  addItem(id) { const it = { uid: this.s.uid++, id }; this.s.bag.push(it); return it; }
  item(uid) { return this.s.bag.find(x => x.uid === uid); }
  smithRoll() {
    const r = this.rng.random(); let acc = 0, tier = '凡品';
    for (const t in CFG.smith_pool) { acc += CFG.smith_pool[t]; if (r < acc) { tier = t; break; } }

  // ---- 面板（界面显示用） ----
  unitOf(n, full) { const h = this.hero(n); return mkHeroUnit(n, h.lv, h.star, this.gearIds(n), full ? null : h.hp); }
  panel(n) {

  }
  power(n) { const p = this.panel(n); return Math.round((p.atk + p.def + p.int + p.agi) * (1 + .15 * TIER_ORDER.indexOf(this.D.H[n]['品阶']))); }

  }
  replayLeft(id) { if (this.s.replay.day !== today()) this.s.replay = { day: today(), n: {} }; return CFG.replay_per_day - (this.s.replay.n[id] || 0); }
  // ---- 打关 ----
  // cells: 长度 9，放将领名或 null
  fight(id, cells, opt = {}) {
    const D = this.D, st = D.STAGE[id];
    if (!this.stageUnlocked(id)) return { err: '还没解锁' };
    const lim = stageLimit(st);
    const picks = []; cells.forEach((n, i) => { if (n && this.hero(n)) picks.push([n, i]); });
    if (!picks.length) return { err: '阵上没人' };
    if (picks.length > lim.max) return { err: `这关只能带 ${lim.max} 人` };
    if (picks.some(([n]) => this.hero(n).hp < 1)) return { err: '有人没兵了，先征兵' };
    const replay = this.isCleared(id);
    if (replay && this.replayLeft(id) <= 0) return { err: '这关今天刷满三次了' };
    const A = picks.map(([n]) => this.unitOf(n));
    SG.setBattleSeed(opt.seed != null ? opt.seed : Math.floor(Math.random() * 2 ** 31));
    const res = fightStage(st, A, parseFloat(st['系数']) || 1, { log: !opt.quick, cycle: this.s.cycle, cells: picks.map(p => p[1]), tx: this.txList(), huatuo: !!this.s.heroes['华佗'] });
    // 残兵带回
    picks.forEach(([n], i) => { this.hero(n).hp = Math.max(0, A[i].hp); });
    // V0.2：赢了带残兵、全员回两成；输了退回去整顿，全员兵力回满（残兵版模拟见施工报告 V0.2）
    for (const n in this.s.heroes) { const h = this.s.heroes[n]; h.hp = res.win ? Math.min(h.lv * 1000, h.hp + h.lv * 1000 * CFG.regen_after_stage) : h.lv * 1000; }
    const rew = { gold: 0, gold2: 0, items: [], first: false, replay };
    if (res.win) {
      const lv = stageFoes(st, this.s.cycle).lv, ch = +st['章'], typ = st['类型'];
      if (!replay) {
        rew.first = true;
        rew.gold = Math.round(CFG.gold_clear(lv) * (typ === '章末' ? CFG.boss_mult : typ === '隐藏' ? CFG.hidden_mult : 1) * this.goldMul());
        rew.gold2 = (CFG.gold2_clear[typ] || 0) * (this.s.cycle >= 2 ? 2 : 1) + (this.txHas('天狼') ? 1 : 0);
        const tl = this.txHas('贪狼');
        const ti = Math.max(0, CFG.drop_tier(ch) - (tl ? 1 : 0));
        const L = D.EQROWS.filter(e => e['档'] === EQ_TIERS[ti] && !e['归属']);
        for (let k = 0; k < (tl ? 2 : 1); k++) rew.items.push(this.addItem(this.rng.choice(L).id));
        this.s.cleared[id] = 1;
      } else {
        this.s.replay.n[id] = (this.s.replay.n[id] || 0) + 1;
        rew.gold = Math.round(CFG.gold_replay(lv) * this.goldMul());
        const tl = this.txHas('贪狼');
        if (this.rng.random() < CFG.replay_drop * (tl ? 2 : 1)) {
          const ti = Math.max(0, CFG.drop_tier(ch) - 1 - (tl ? 1 : 0));
          const L = D.EQROWS.filter(e => e['档'] === EQ_TIERS[ti] && !e['归属']);
          rew.items.push(this.addItem(this.rng.choice(L).id));
        }
        this.s.cleared[id]++;
      }
      // 专属掉落：章末 3%、隐藏 10%、支线 3%（V0.4），掉本关出场无双的件
      const pe = typ === '章末' ? CFG.boss_excl : typ === '隐藏' ? CFG.hidden_excl : typ === '支线' ? CFG.side_excl : 0;
      if (pe && this.rng.random() < pe) {
        const ws = stageFoes(st, this.s.cycle, this.txList()).names.filter(n => D.EXCL[n]);
        if (ws.length) rew.items.push(this.addItem(this.rng.choice(D.EXCL[this.rng.choice(ws)]).id));
      }
      this.s.gold += rew.gold; this.s.gold2 += rew.gold2;
    } else if (replay) {
      this.s.replay.n[id] = (this.s.replay.n[id] || 0) + 1;
    }
    return { res, rew, picks };
  }
  // ---- 借鉴水浒：战力、一键、引导 ----
  teamPower(cells) {
    const U = (cells || this.s.formation).filter(n => n && this.hero(n)).map(n => this.unitOf(n));
    if (!this.bondsOff()) SG.applyBonds(U);
    for (const p of txParts({ tx: this.txList() })) if (p.A) U.forEach(p.A);
    return Math.round(U.reduce((a, u) => a + unitPower(u), 0));
  }
  bondsOff() { return false; }
  stagePower(id) {
    const st = this.D.STAGE[id], f = stageFoes(st, this.s.cycle, this.txList()), ease = parseFloat(st['系数']) || 1;
    const B = f.names.map(n => mkEnemy(n, f.lv, f.star, ease)); apply_limit(st, [], B); SG.applyBonds(B);
    for (const p of txParts({ tx: this.txList() })) if (p.B) B.forEach(p.B);
    if (tlFull(st, this.s.cycle, { tx: this.txList() })) for (const u of B) { u.maxhp *= 1.10; u.hp *= 1.10; }
    return Math.round(B.reduce((a, u) => a + unitPower(u), 0));
  }
  itemScore(n, row) {
    const main = this.D.H[n]['定位'] === '武将' ? 'atk' : 'int';
    const own = row['归属'] === n;
    let v = parseFloat(row['固定']) * (own ? 1.5 : 1) * (row['槽'] === '武器' && row['维'] !== main ? 0.3 : 1) + parseFloat(row['百分比']) * 4;
    if (own) v += 200;   // 本人专属优先，凑两件四件
    return v;
  }
  autoEquip(names) {
    names = names.filter(n => n && this.hero(n)).sort((a, b) => this.power(b) - this.power(a));
    const team = new Set(names);
    for (const n of names) for (const sl of SLOTS) {
      let best = null, bv = -1;
      for (const it of this.s.bag) {
        const row = this.D.EQID[it.id]; if (row['槽'] !== sl) continue;
        const who = this.equippedBy(it.uid);
        if (who && who !== n && team.has(who) && names.indexOf(who) < names.indexOf(n)) continue;   // 排在前面的人已经穿上了
        const v = this.itemScore(n, row); if (v > bv) { bv = v; best = it; }
      }
      if (best) this.equip(n, best.uid);
    }
  }
  stripTeam(names) { for (const n of names) if (n && this.s.gear[n]) for (const sl of SLOTS) this.s.gear[n][sl] = null; }
  ownStarReady(n) { const h = this.hero(n); return h.star < 5 && h.frag >= this.starNeed(n) && this.starNeed(n) > 0; }
  starAll() { let k = 0; for (const n in this.s.heroes) while (this.ownStarReady(n)) { const h = this.hero(n); h.frag -= this.starNeed(n); h.star++; k++; } return k; }
  trainMax(n) { return this.train(n, 999); }
  nextStage() { return this.D.STAGES.find(s => (s['类型'] === '主线' || s['类型'] === '章末') && !this.isCleared(s.id) && this.stageUnlocked(s.id)); }
  guide() {
    const owned = Object.keys(this.s.heroes), F = this.s.formation.filter(Boolean), nx = this.nextStage();
    const cl = Object.keys(this.s.cleared).length;
    if (!cl && owned.length < 4 && this.s.gold >= CFG.draw) return { txt: '先去招贤', sub: '过关不送人，将领只能招。开局的钱够抽三次', act: 'go', v: 'tavern' };
    if (owned.length < 9 && this.s.gold >= CFG.draw + 200) return { txt: `手上才 ${owned.length} 个人`, sub: '去招贤添几个，九宫格坐满打得轻松', act: 'go', v: 'tavern' };
    if (F.length < Math.min(9, owned.length)) return { txt: `还有 ${owned.length - F.length} 个人没上阵`, sub: '去布阵把空位填满', act: 'go', v: 'form' };
    const ready = owned.filter(n => this.ownStarReady(n)).length;
    if (ready) return { txt: `${ready} 个人碎片够升星`, sub: '将领页一键升星，只花本人碎片', act: 'go', v: 'heroes' };
    const low = F.filter(n => this.hero(n).hp < this.hero(n).lv * 1000 * .6);
    if (low.length) return { txt: `${low.length} 个人兵力不到六成`, sub: '布阵页可以一键征兵', act: 'go', v: 'form' };
    if (nx) return { txt: `下一关：${nx['关']}`, sub: `第 ${nx['章']} 章 ${nx['章名']}　敌方 ${stageFoes(nx, this.s.cycle).lv} 级`, act: 'stage', v: nx.id };
    if (this.allCleared()) return { txt: '终章打完了', sub: `可以开第 ${this.s.cycle + 1} 周目`, act: 'go', v: 'stages' };
    return null;
  }
  allCleared() { const last = this.D.STAGES.find(x => x['章'] === '26' && x['类型'] === '章末'); return this.isCleared(last.id); }
  newCycle() {
    if (!this.allCleared()) return false;
    const s = this.s; s.cycle++; s.cleared = {}; s.tokensBought = 0; s.replay = { day: today(), n: {} }; this.rollTx(); return true;
  }
  // ---- 存档 ----
  toJSON() { return JSON.stringify(this.s); }
  static load(str) { try { const s = JSON.parse(str); if (!s || s.v !== 1 || s.kind === 'conquest') return null; return new Game(s); } catch (e) { return null; } }
}

// 存档码：压缩（浏览器自带 deflate-raw）+ base64，前缀 SG1:；老码（V0.3 以前，JSON 直接 base64）照样认
(function () {
const SG = globalThis.SG;
const PREFIX = 'SG1:';
const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => { const t = atob(s); const u = new Uint8Array(t.length); for (let i = 0; i < t.length; i++) u[i] = t.charCodeAt(i); return u; };
async function pipe(u8, stream) {

  return new Uint8Array(await r.arrayBuffer());
}
const canZip = () => typeof CompressionStream === 'function' && typeof DecompressionStream === 'function';
async function encode(json) {

  if (!canZip()) return b64(raw);
  return PREFIX + b64(await pipe(raw, new CompressionStream('deflate-raw')));
}
async function decode(code) {
  code = (code || '').replace(/\s+/g, '');
  if (!code) throw new Error('空的');
  if (code.startsWith(PREFIX)) {
    if (!canZip()) throw new Error('这个浏览器解不开压缩存档，换 Chrome 或 Safari 新版');
    return new TextDecoder().decode(await pipe(unb64(code.slice(PREFIX.length)), new DecompressionStream('deflate-raw')));
  }
  return new TextDecoder().decode(unb64(code));
}
// 看一眼存档里是什么：{ kind:'camp'|'conquest', s, sum } 或 { err }
function inspect(json) {
  let s;
  try { s = JSON.parse(json); } catch (e) { return { err: '码不全，或者不是本游戏的存档' }; }
  if (!s || typeof s !== 'object' || !s.heroes || !s.formation) return { err: '这不是三国群英录的存档' };
  if (s.v !== 1) return { err: `存档版本对不上（${s.v}）` };
  const n = Object.keys(s.heroes).length;
  if (!n) return { err: '存档里一个将领也没有' };
  if (s.kind === 'conquest') {
    if (!s.world) return { err: '霸业存档不全，缺地图' };
    const me = s.world.me, cities = Object.values(s.world.city || {}).filter(c => c.owner === me).length;
    return { kind: 'conquest', s, sum: `霸业 ${me}　第 ${s.world.turn} 回合　${cities} 城　${n} 将` };
  }
  return { kind: 'camp', s, sum: `闯关 ${s.cycle || 1} 周目　${n} 将　本周目通 ${Object.keys(s.cleared || {}).length} 关` };

function sortedHeroes() {
  const T = SG.TIER_ORDER;
  let L = Object.keys(G.s.heroes);
  const f = V.filt;
  if (f.fac !== '全') L = L.filter(n => D.H[n]['阵营'] === f.fac);
  if (f.tier !== '全') L = L.filter(n => D.H[n]['品阶'] === f.tier);
  if (f.role !== '全') L = L.filter(n => D.H[n]['定位'] === f.role);
  if (f.frag) L = L.filter(n => G.ownStarReady(n));
  const pw = {}; L.forEach(n => pw[n] = G.power(n));
  if (V.sort === 'power') L.sort((a, b) => pw[b] - pw[a]);
  else if (V.sort === 'tier') L.sort((a, b) => T.indexOf(D.H[b]['品阶']) - T.indexOf(D.H[a]['品阶']) || pw[b] - pw[a]);
  else if (V.sort === 'lv') L.sort((a, b) => G.hero(b).lv - G.hero(a).lv || pw[b] - pw[a]);
  return L;
}

const Play = {
  tok: 0, speed: +(store.get('sgqyl_speed') || 1) || 1, full: false,
  begin(out) {
    V.battle = { out, bi: 0, ei: 0, done: false, lines: [] };
    this.full = false;
    V.view = 'battle'; render();
  },
  cur() { const B = V.battle; return B.out.res.battles[B.bi]; },
  mount() {
    const B = V.battle; if (!B) return;
    this.paintAll();
    if (!B.done) { const t = ++this.tok; setTimeout(() => this.step(t), 380); }
  },
  step(t) {
    if (t !== this.tok) return;
    const B = V.battle; if (!B || B.done) return;
    const b = this.cur();
    if (B.ei >= b.events.length) {
      if (B.bi < B.out.res.battles.length - 1) {
        B.bi++; B.ei = 0; B.lines.push({ c: 'r', h: `第 ${B.bi + 1} 阵` }); render(); return;
      }
      B.done = true; render(); return;
    }
    const ev = b.events[B.ei++];
    this.show(b, ev);
    // 打到后面节奏收一收：开场看得清，鏖战不拖（照水浒）
    const decay = ev.r <= 6 ? 1 : ev.r <= 12 ? .9 : ev.r <= 20 ? .8 : .7;
    const d = (EV_DELAY[ev.t] != null ? EV_DELAY[ev.t] : 150) * decay / this.speed;
    setTimeout(() => this.step(t), d);
  },
  skip() {
    const B = V.battle; if (!B) return;
    this.tok++;
    const bs = B.out.res.battles;
    for (let i = B.bi; i < bs.length; i++) {
      if (i > B.bi) B.lines.push({ c: 'r', h: `第 ${i + 1} 阵` });
      for (const ev of bs[i].events.slice(i === B.bi ? B.ei : 0)) { const l = this.line(bs[i], ev); if (l) B.lines.push(l); }
    }
    B.bi = bs.length - 1; B.ei = bs[B.bi].events.length; B.done = true;
    render();
  },
  // 一条事件 → { c: 类别, h: html }；c 同水浒：r 回合 sk 技能 dm 伤害 he 回兵 sh 护盾 st 状态 in 提示 ps 被动/加成
  line(b, ev) {
    const side = u => u && b.teams[0].includes(u) ? 'a' : 'f';
    const n = u => u ? `<b class="ln-${side(u)}">${esc(u.label || u.name)}</b>` : '';
    const hp = (a, z) => `兵力 ${num(a)}→${num(z)}`;
    switch (ev.t) {
      case 'start': return { c: 'r', h: '两军对阵' };
      case 'round': return { c: 'r', h: `第 ${ev.r} 回合` };
      case 'gear': {
        const u = ev.u, own = u.equip.filter(e => e['归属'] === u.name).length, st = D0.sets[u.name];
        const parts = [u.equip.map(e => esc(e['名'])).join('、')];
        if (own >= 2) parts.push(`专属两件：${u.role !== '武将' ? '智力' : '武力'} +6%`);
        if (own >= 4 && st) parts.push(`四件：${esc(st.four)}`);
        return { c: 'ps', h: `${n(u)} 整备：${parts.join('；')}` };
      }
      case 'bond': {
        const bd = SG.BONDS.find(x => x.name === ev.n);
        return { c: 'ps', h: `${ev.side === 0 ? '我方' : '敌方'}羁绊【${esc(ev.n)}】${ev.mem.map(m => `<b class="ln-${ev.side === 0 ? 'a' : 'f'}">${esc(m)}</b>`).join('、')}：${KEYCN[ev.k]} +${Math.round(ev.v * 100)}%${ev.full ? '' : '（凑半）'}${bd && bd.txt ? `｜${esc(bd.txt)}` : ''}` };
      }
      case 'atk': return null;
      case 'skill': {
        const typ = ev.how === '追击' ? '追击' : ev.how === '指挥' || ev.how === '兵种' ? ev.how : (ev.sk && ev.sk.type) || '';
        const k = b._all.indexOf(ev.u), tp = ev.snap && k >= 0 ? ev.snap[k][0] / ev.snap[k][1] : ev.u.hp / ev.u.maxhp;
        return { c: 'sk', h: `${n(ev.u)} · ${esc(ev.n)}（${esc(typ)}${ev.how === '结算' ? '，结算' : ''}）${tp < .995 && ev.how !== '指挥' && ev.how !== '兵种' ? `（兵力 ${pct(Math.max(0, tp))}）` : ''}｜${skillWords(ev.u, ev.sk)}` };
      }
      case 'prep': return { c: 'sk', h: `${n(ev.u)} 准备「${esc(ev.n)}」，下次行动时结算` };
      case 'hit': {
        const g = ev.g;
        let head;
        if (g === 'attack') head = `${n(ev.s)} 普攻 ${n(ev.u)}`;
        else if (g === 'pursue') head = `${n(ev.s)} 追击 ${n(ev.u)}`;
        else if (g === '反击') head = `${n(ev.s)} 反击 ${n(ev.u)}`;
        else if (g === '斩杀') head = `${n(ev.s)} 斩杀 ${n(ev.u)}`;
        else if (g === '连环') head = `${n(ev.u)} 受【连环】牵连`;
        else if (DOT_ST.has(g) || g === '反目' || g === '诅咒') head = `${n(ev.u)} 受【${esc(g)}】`;
        else if (ev.s && g && g !== 'skill') head = `${n(ev.s)} → ${n(ev.u)}（${esc(g)}）`;
        else head = ev.s ? `${n(ev.s)} → ${n(ev.u)}` : n(ev.u);
        const notes = [];

function bcell(b, u, k) {
  if (!u) return '<div class="bcell void"></div>';

}
function battleGrids(b) {
  const A = b.teams[0], B = b.teams[1];
  const posA = {}, posB = {};
  A.forEach(u => posA[u.idx] = u); B.forEach(u => posB[u.idx] = u);
  const cell = (pos, i) => { const u = pos[i]; return bcell(b, u, u ? b._all.indexOf(u) : -1); };
  let top = '', bot = '';
  if (V.side) {
    // 横排：我方在左、前排朝右；敌方在右、前排朝左
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) { bot += cell(posA, (2 - c) * 3 + r); top += cell(posB, c * 3 + r); }
  } else {
    // 竖排：敌方在上、前排在下；我方在下、前排在上
    for (const r of [2, 1, 0]) for (let c = 0; c < 3; c++) top += cell(posB, r * 3 + c);
    for (const r of [0, 1, 2]) for (let c = 0; c < 3; c++) bot += cell(posA, r * 3 + c);

}

}

// ---------------- 地图 ----------------
VIEWS.map = () => {
  const g = G(), w = W(), st = w.st, me = st.me;
  const tg = new Set(w.targets());
  let lines = '';
  const seen = new Set();
  for (const a in w.ADJ) for (const b of w.ADJ[a]) {
    const k = a < b ? a + b : b + a; if (seen.has(k)) continue; seen.add(k);
    const [x1, y1] = POS[a], [x2, y2] = POS[b];
    lines += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#b9ae9b" stroke-width=".35" />`;
  }
  const cities = Object.keys(st.city).map(n => {
    const c = st.city[n], [x, y] = POS[n], sz = c.tier === '都' ? 15 : c.tier === '大' ? 11 : 8;
    const cap = Object.values(st.capital).includes(n) && c.owner !== '无' && st.capital[c.owner] === n;
    return `<div class="city${V.cqSel === n ? ' sel' : ''}${tg.has(n) && !g.s.acted ? ' can' : ''}" style="left:${x}%;top:${y}%" data-a="cq-city" data-c="${n}">
      <div class="dot" style="width:${sz}px;height:${sz}px;background:${FCOL[c.owner]}${cap ? ';border-color:#2b2520' : ''}"></div><div class="cn">${n}</div></div>`;
  }).join('');
  const cnt = {}; for (const n in st.city) cnt[st.city[n].owner] = (cnt[st.city[n].owner] || 0) + 1;
  const legend = ['魏', '蜀', '吴', '汉', '无'].map(f => `<span><i style="background:${FCOL[f]}"></i>${f === '无' ? '无主' : f}${f === me ? '（你）' : ''} ${cnt[f] || 0}${f !== '无' && !st.alive[f] ? '·灭' : ''}</span>`).join('');
  const news = (g.s.news || []).slice(-6).map(esc).join('<br>');

      <span class="btn sm main" data-a="cq-end">${g.s.acted ? '结束回合' : '过回合'}</span></div>
    <div class="map"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${lines}</svg>${cities}</div>
    <div class="legend">${legend}</div>
    <div class="small muted">${g.s.acted ? '这回合已出过兵。' : '红字的城可以打，点城看守军。'}练级、升星、招降、招贤不占回合。</div>
    ${news ? `<div class="card cq-log" style="margin-top:8px">${news}</div>` : ''}
    <div class="btns"><div class="btn sm" data-a="cq-reguard">重排守将（最弱的守城）</div></div>`;
};
function garrisonHtml(n) {

function citySheet(n) {

Conq.formHead = () => {

Conq.formButtons = cnt => V.cq.kind === 'attack'
  ? `<div class="btns"><div class="btn" data-a="cq-cancel">回地图</div><div class="btn main${cnt ? '' : ' off'}" data-a="cq-go">出征</div></div>`

function picks() { const g = G(), pool = new Set(Conq.pool()); return g.s.formation.map((n, i) => [n, i]).filter(([n]) => n && pool.has(n)); }
ACT['cq-go'] = () => {
  const g = G(), w = W(), n = V.cq.city;
  const P = picks(); if (!P.length) { toast('阵上没人'); return; }
  if (P.some(([x]) => g.hero(x).hp < 1)) { toast('有人没兵了，先征兵'); return; }
  const A = w.my_units(P.map(p => p[0])), B = w.foe_units(n);
  SG.setBattleSeed(Math.floor(Math.random() * 2 ** 31));

  g.s.acted = true;
  let note;
  if (res.won) {
    note = `${esc(n)} 归你了。${res.caught.length ? `俘虏 ${res.caught.map(esc).join('、')}，去俘虏营花钱招降。` : ''}${res.fell === 'dead' ? `${res.old}只剩这几座城，就此灭了。` : res.fell === 'moved' ? `${res.old}迁都${esc(res.cap)}。` : ''}`;
    g.s.news.push(`第 ${w.st.turn} 回合：攻下${n}。`);
  } else { note = `没打下来。${esc(n)} 守军兵力还剩 ${Math.round(w.st.city[n].hp * 100)}%，过几回合会回满。`; g.s.news.push(`第 ${w.st.turn} 回合：攻${n}没下。`); }
  V.cq = null; saveCq();
  SG.Play.begin({ res: { win: res.won, battles: [b] }, rew: {}, title: `出征 ${n}`, note, back: 'map', backAct: 'cq-after' });
};
ACT['cq-after'] = () => { if (!Conq.checkEnd()) SG.go('map'); };

// ---------------- 过回合：三家 AI ----------------
ACT['cq-end'] = () => {
  const g = G(), w = W();
  g.s.queue = SG.CQ_FACTIONS.filter(f => f !== w.st.me);
  g.s.turnNews = [];
  Conq.step();
};
Conq.step = () => {
  const g = G(), w = W();
  while (g.s.queue && g.s.queue.length) {
    const f = g.s.queue.shift();
    const plan = w.aiPlan(f);
    if (!plan) continue;
    if (plan.kind === 'ai') {
      const who = x => x === '无' ? '无主的' : x;
      g.s.turnNews.push(plan.won ? `${f}从${plan.a}打下${who(plan.old)}${plan.best}。` : `${f}攻${who(plan.old)}${plan.best}，没下。`);
      continue;
    }
    // 打到你了
    const c = w.st.city[plan.best];
    const names = w.defenders(plan.best);
    if (!names.length) {
      w.afterDefense(plan, [], [], 1);
      g.s.turnNews.push(`${f}从${plan.a}打下你的${plan.best}，城里没人。`);
      continue;
    }
    g.s.pending = plan; saveCq();
    const capital = plan.best === w.st.capital[w.st.me];
    openModal(`<div class="shead" style="color:var(--zhu)">${f}来打${plan.best}</div>
      <div class="small">${f}从${esc(plan.a)}出兵。${c.guard ? `守将 ${esc(c.guard)}。` : '这城没有守将。'}${capital ? '都城被打，得自己挑人守。' : ''}</div>${garrisonHtml(plan.a)}
      <div class="btns">${capital ? '' : '<div class="btn" data-a="cq-def-auto">自动守</div>'}<div class="btn main" data-a="cq-def-pick">自己挑人</div></div>`);
    return;
  }
  Conq.finishTurn();
};
ACT['cq-def-pick'] = () => {
  const g = G(), w = W(), plan = g.s.pending;
  V.cq = { kind: 'defend', plan };
  const auto = w.defenders(plan.best);
  const F = [null, null, null, null, null, null, null, null, null];
  const order = [1, 0, 2, 4, 3, 5, 7, 6, 8];
  auto.slice(0, 9).forEach((n, i) => F[order[i]] = n);
  g.s.formation = F;
  closeModal(); SG.go('form');
};
function defend(names, cells) {
  const g = G(), w = W(), plan = g.s.pending;
  const { A, B } = w.defenseUnits(plan, names);
  SG.setBattleSeed(Math.floor(Math.random() * 2 ** 31));
  const b = new SG.Battle(A, B, true);
  if (cells) A.forEach((u, i) => u.idx = cells[i]);
  const [r] = b.run();
  const out = w.afterDefense(plan, A, B, r);
  g.s.pending = null; V.cq = null;
  let note;
  if (out.won) { note = `${esc(plan.best)} 丢了。${out.lostGuard ? `守将 ${esc(out.lostGuard)} 被俘。` : ''}`; g.s.turnNews.push(`${plan.f}打下你的${plan.best}。`); }
  else { note = `守住了。${out.caught.length ? `${out.caught.map(esc).join('、')} 战死被擒，进了俘虏营。` : ''}`; g.s.turnNews.push(`${plan.f}攻${plan.best}，被你守住。`); }
  saveCq();
  SG.Play.begin({ res: { win: !out.won, battles: [b] }, rew: {}, title: `守 ${plan.best}`, note, winTxt: out.won ? '城破' : '守住', back: 'map', backAct: 'cq-resume', backTxt: '接着过回合' });
}
ACT['cq-def-auto'] = () => { closeModal(); defend(null, null); };
ACT['cq-def-go'] = () => {
  const P = picks(); if (!P.length) { toast('阵上没人'); return; }
  defend(P.map(p => p[0]), P.map(p => p[1]));
};
ACT['cq-resume'] = () => { SG.go('map'); Conq.step(); };
Conq.checkEnd = () => {
  const w = W(), s = w.status();
  if (!s) return false;
  const g = G();
  if (s === 'win') {
    store.set('sgqyl_title', '一统天下');
    { const r = SG.cqAch.get(); r.win = r.win || {}; r.win[w.st.me] = 1; if (w.st.turn <= 40) r.fast = 1; SG.cqAch.set(r); }
    openModal(`<div class="shead">天下归一</div><div class="story">第 ${w.st.turn} 回合，${w.st.me}据有四海。</div><div class="small muted">功名簿里记下了「一统天下」，回闯关去领。</div><div class="btns"><div class="btn main" data-a="to-title">回标题</div></div>`);
  } else {
    openModal(`<div class="shead">败亡</div><div class="story">都城丢了，手里不到四座城。第 ${w.st.turn} 回合，${w.st.me}散了。</div><div class="btns"><div class="btn" data-a="close">看看地图</div><div class="btn main" data-a="to-title">回标题</div></div>`);

};
Conq.finishTurn = () => {
  const g = G(), w = W();

  g.s.acted = false;

  g.s.news.push(`第 ${w.st.turn} 回合，进账 ${inc} 金，全军回两成兵。`);
  g.s.news = g.s.news.slice(-40);
  saveCq(); SG.go('map');
  if (g.s.turnNews.length) openModal(`<div class="shead">第 ${w.st.turn - 1} 回合各家动静<span class="x" data-a="close">关闭</span></div><div class="small">${g.s.turnNews.map(esc).join('<br>')}</div><div class="small muted" style="margin-top:6px">进账 ${inc} 金。</div><div class="btns"><div class="btn main" data-a="close">知道了</div></div>`);
  g.s.turnNews = [];
};

/* ---- pwa.js ---- */
// 装到桌面：Chrome/Edge 走 beforeinstallprompt；Safari 没有安装接口，给图文指引。
// 玩进去 45 秒后问一次；点过「以后再说」或装过就不再问；存档菜单里随时能手动装。
// 更新：放到网上改版后，service worker 换代时提示「有新版本」，点了刷新。
(function () {
  const SG = window.SG;
  const KEY = 'sgqyl_pwa';
  let deferred = null, armed = false;
  const ua = navigator.userAgent;
  const standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  const isSafari = /Safari/.test(ua) && !/Chrome|Chromium|CriOS|FxiOS|Edg|OPR/.test(ua);
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isFirefox = /Firefox|FxiOS/.test(ua);
  const onWeb = location.protocol.startsWith('http');
  const st = () => { try { return localStorage.getItem(KEY); } catch (e) { return null; } };
  const setSt = v => { try { localStorage.setItem(KEY, v); } catch (e) { } };
  const guide = () => isIOS
    ? '点屏幕底部的<b>分享</b>按钮，往下找<b>「添加到主屏幕」</b>，再点右上角<b>添加</b>。'
    : '菜单栏<b>文件</b> → <b>「添加到程序坞」</b>。';
  function arm() {
    if (armed || standalone || !onWeb || isFirefox) return;
    const s = st(); if (s === 'dismissed' || s === 'installed') return;
    armed = true;
    const wait = () => {   // 等进了游戏（不在标题页）再开始计时
      if (SG.V && SG.V.mode && SG.V.mode !== 'title') setTimeout(offer, 45000);
      else setTimeout(wait, 2000);
    };
    wait();
  }
  function offer() {
    if (standalone || (!deferred && !isSafari)) return;
    if (document.querySelector('#modal.on')) { setTimeout(offer, 15000); return; }
    SG.ui.openModal(`<div class="shead">装到桌面</div>
      <div class="small">装好之后从桌面图标进，全屏，断网也能打。</div>
      ${deferred ? '' : `<div class="small" style="margin-top:6px">${guide()}</div>`}
      <div class="btns"><div class="btn" data-a="pwa-later">以后再说</div>${deferred ? '<div class="btn main" data-a="pwa-install">装</div>' : '<div class="btn main" data-a="pwa-later">知道了</div>'}</div>`);
  }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; arm(); });
  window.addEventListener('appinstalled', () => setSt('installed'));
  if (isSafari) window.addEventListener('load', arm);
  // 新版本提示
  if (onWeb && 'serviceWorker' in navigator) {
    const had = !!navigator.serviceWorker.controller; let shown = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!had || shown) return; shown = true;
      SG.ui.openModal(`<div class="shead">有新版本</div><div class="small">刷新一下就是新版，存档不受影响。</div>
        <div class="btns"><div class="btn" data-a="close">等会儿</div><div class="btn main" data-a="pwa-reload">刷　新</div></div>`);
    });
  }
  SG.pwa = {
    can: () => !standalone && onWeb && (!!deferred || isSafari),
    install: async () => {
      if (deferred) {
        deferred.prompt();
        try { const r = await deferred.userChoice; setSt(r.outcome === 'accepted' ? 'installed' : 'dismissed'); } catch (e) { }
        deferred = null; return;
      }
      SG.ui.openModal(`<div class="shead">装到桌面<span class="x" data-a="close">关闭</span></div><div class="small">${guide()}装好之后从图标进，断网也能打。</div>`);
    },
    later: () => { setSt('dismissed'); SG.ui.closeModal(); },
    reload: () => location.reload(),
  };
})();

</script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</body>
</html>
