","智力":"18","速度":"54","武成长":"1.2","统成长":"0.8","智成长":"0.3","速成长":"0.9","特点":"","生平":"袁绍的部将。荀攸看过他：「锐而轻敌。」｜官渡相持时，他押着几千车粮草过来。曹操派徐晃、史涣半路截住，粮车一把火烧了。"},{"名":"蒋义渠","阵营":"汉","定位":"武将","品阶":"校","武力":"48","统率":"46","智力":"30","速度":"48","武成长":"0.9","统成长":"1.0","智成长":"0.5","速成长":"0.7","特点":"","生平":"袁绍的部将，官渡时守在黎阳北岸。｜袁绍兵败，带着八百骑逃过河，进了他的营，拉着他的手：「孤以首领相付矣。」他把大帐让出来，请袁绍在里面发号施令。散掉的兵听到消息，又聚了回来。"},{"名":"邢道荣","阵营":"汉","定位":"武将","品阶":"校","武力":"56","统率":"44","智力":"16","速度":"50","武成长":"1.3","统成长":"0.8","智成长":"0.2","速成长":"0.8","特点":"自称万夫不当","生平":"零陵太守刘度手下的上将，使一柄开山大斧，自称万夫不当。｜阵前和张飞交手，没几回合拨马就走，又撞上赵云，被捉了回去。他答应回城做内应，当夜领兵来劫寨，赵云在路口等着，一枪刺在马下。"},{"名":"潘凤","阵营":"汉","定位":"武将","品阶":"校","武力":"54","统率":"42","智力":"18","速度":"48","武成长":"1.2","统成长":"0.8","智成长":"0.3","速成长":"0.7","特点":"吾有上将","生平":"冀州牧韩馥帐下的将军，使一柄大斧。｜诸侯会盟讨董，华雄在关前连斩几员将，帐中没人出声。韩馥开口：「吾有上将潘凤，可斩华雄。」潘凤提斧上马出了营门。｜没过多久，探马飞报：潘凤又被华雄斩了。"},{"名":"俞涉","阵营":"汉","定位":"武将","品阶":"校","武力":"48","统率":"40","智力":"20","速度":"52","武成长":"1.0","统成长":"0.7","智成长":"0.3","速成长":"0.8","特点":"","生平":"袁术帐下的骁将。华雄在关前连斩几人，袁绍问谁敢出战，他从袁术身后站出来：「小将愿往。」｜袁绍很高兴，着他出马。营里的酒还没凉，探马就回来了：他和华雄交手，不到三合。"},{"名":"武安国","阵营":"汉","定位":"武将","品阶":"校","武力":"52","统率":"44","智力":"18","速度":"46","武成长":"1.1","统成长":"0.9","智成长":"0.3","速成长":"0.6","特点":"铁锤，断了一只手","生平":"北海太守孔融的部将，使一柄铁锤。虎牢关下吕布出阵，他飞马迎上去，斗了十来个回合。｜吕布一戟砍断他的手腕，锤掉在地上。八路诸侯的兵一齐冲出，才把他抢了回去。"},{"名":"李肃","阵营":"汉","定位":"武将","品阶":"校","武力":"46","统率":"42","智力":"40","速度":"52","武成长":"0.9","统成长":"0.8","智成长":"0.8","速成长":"0.8","特点":"牵赤兔的说客","生平":"吕布的同乡。他牵着赤兔马，带上黄金明珠去丁原营里找吕布，第二天丁原的人头就到了董卓帐下。｜后来他捧着假诏去郿坞，请董卓入朝受禅。车驾进了北掖门，吕布一戟刺中董卓咽喉，他上前割了首级。"},{"名":"董旻","阵营":"汉","定位":"武将","品阶":"校","武力":"46","统率":"44","智力":"28","速度":"48","武成长":"0.9","统成长":"0.9","智成长":"0.4","速成长":"0.7","特点":"","生平":"董卓的弟弟，字叔颖。何进死在宫中那夜，他当奉车都尉，与何进旧部吴匡合兵，杀了车骑将军何苗。｜董卓掌权，他升到左将军，封鄠侯。董卓死在长安，皇甫嵩领兵直奔郿坞。"},{"名":"穆顺","阵营":"汉","定位":"武将","品阶":"校","武力":"48","统率":"40","智力":"22","速度":"54","武成长":"1.0","统成长":"0.7","智成长":"0.3","速成长":"0.9","特点":"","生平":"上党太守张杨帐下的将。吕布在虎牢关前搦战，他挺枪出了阵。｜两马只一个照面，吕布一戟，他就落在马下。北海的武安国紧跟着冲了上去。"},{"名":"张让","阵营":"汉","定位":"文臣","品阶":"校","武力":"30","统率":"40","智力":"58","速度":"46","武成长":"0.3","统成长":"0.7","智成长":"1.3","速成长":"0.6","特点":"十常侍头","生平":"颍川人，十常侍的头一个。汉灵帝常讲：「张常侍是我公，赵常侍是我母。」｜何进要诛宦官，他抢先在宫里杀了何进。袁绍领兵杀进宫，他劫着少帝逃到黄河边，追兵赶到，他哭着拜别天子，跳进了河里。"},{"名":"杨松","阵营":"汉","定位":"文臣","品阶":"校","武力":"30","统率":"38","智力":"54","速度":"48","武成长":"0.2","统成长":"0.6","智成长":"1.2","速成长":"0.7","特点":"贪","生平":"汉中张鲁的谋臣。诸葛亮派人给他送金银，他就在张鲁跟前讲马超要反；曹操送来一副金掩心甲，他又讲庞德收了曹操的钱。｜曹兵到了南郑，他开门放进来。曹操进城，叫人把他拉到街市上斩了。"},{"名":"王累","阵营":"汉","定位":"文臣","品阶":"校","武力":"32","统率":"42","智力":"56","速度":"44","武成长":"0.3","统成长":"0.8","智成长":"1.3","速成长":"0.6","特点":"倒吊城门谏刘璋","生平":"广汉人，刘璋手下的从事。刘璋要迎刘备入川，他拿绳子把自己倒吊在城门上，一手执谏章，一手握剑。｜刘璋出城，看了谏章，没有理会。他挥剑割断绳子，头朝下摔在地上。"},{"名":"韩浩","阵营":"魏","定位":"武将","品阶":"骁","武力":"62","统率":"58","智力":"44","速度":"58","武成长":"1.3","统成长":"1.4","智成长":"0.9","速成长":"0.9","特点":"屯田","生平":"河内人。夏侯惇让几个假降的兵劫作人质，营中大乱。韩浩带兵围住，喝道：「汝等凶逆，乃敢执劫大将军，复欲望生邪！」又对夏侯惇流泪：「当奈国法何！」下令进攻。｜曹操随后下令：往后有劫人质的，连人质一起打。"},{"名":"史涣","阵营":"魏","定位":"武将","品阶":"骁","武力":"64","统率":"54","智力":"30","速度":"62","武成长":"1.5","统成长":"1.2","智成长":"0.5","速成长":"1.1","特点":"","生平":"沛国人，年轻时好行侠。曹操起兵，他以宾客身份跟着，做中军校尉，替曹操管着诸将。｜官渡相持，袁绍的运粮车几千辆往前线送。史涣和徐晃带兵半道截住，一把火全烧了。"},{"名":"牛金","阵营":"魏","定位":"武将","品阶":"骁","武力":"66","统率":"52","智力":"22","速度":"60","武成长":"1.6","统成长":"1.0","智成长":"0.3","速成长":"1.0","特点":"","生平":"曹仁的部将。周瑜攻江陵，他带三百人出城，一出去就让人围了。曹仁披甲上马，带几十骑冲进去把他捞了回来。｜多年后，司马懿听到一句谶语「牛继马后」，请牛金喝酒，壶里分两格，给他倒的是毒酒那格。"},{"名":"朱灵","阵营":"魏","定位":"武将","品阶":"骁","武力":"64","统率":"56","智力":"36","速度":"60","武成长":"1.4","统成长":"1.3","智成长":"0.6","速成长":"1.0","特点":"","生平":"清河人，本是袁绍的将领。袁绍派他带三营兵帮曹操打陶谦，仗打完，他留下没走：「灵观人多矣，无若曹公者，此乃真明主也。」｜后来曹操派于禁带几十骑，拿着手令进营夺了他的兵，营里没人敢动。"},{"名":"曹昂","阵营":"魏","定位":"武将","品阶":"骁","武力":"60","统率":"54","智力":"42","速度":"62","武成长":"1.4","统成长":"1.2","智成长":"0.8","速成长":"1.1","特点":"让马给父亲","生平":"曹操的长子，生母早亡，由丁夫人养大。｜宛城那夜张绣反了，曹操的坐骑绝影脸上、脚上都中了箭。曹昂把自己的马让给父亲，留在了后头。｜丁夫人后来整日哭：「将我儿杀之，都不复念！」"},{"名":"夏侯恩","阵营":"魏","定位":"武将","品阶":"骁","武力":"62","统率":"50","智力":"20","速度":"64","武成长":"1.4","统成长":"1.0","智成长":"0.3","速成长":"1.2","特点":"背剑的","生平":"曹操身边背剑的。曹操有两口宝剑，倚天自己佩着，青釭交给他背。｜长坂坡上，他仗着这口剑，只带十几个人四处抢东西。赵云迎面撞来，一枪把他挑下马，拔剑一看，靶上用金嵌着「青釭」二字。"},{"名":"吕虔","阵营":"魏","定位":"武将","品阶":"骁","武力":"60","统率":"56","智力":"40","速度":"56","武成长":"1.2","统成长":"1.3","智成长":"0.8","速成长":"0.9","特点":"","生平":"任城人，在泰山当了十几年太守。他有口佩刀，相刀的匠人看过，要位至三公的人才佩得住。吕虔把刀送给了手下的别驾王祥。｜后来王祥真做到了三公，临死又把刀传给弟弟王览。"},{"名":"蔡阳","阵营":"魏","定位":"武将","品阶":"骁","武力":"66","统率":"54","智力":"24","速度":"60","武成长":"1.6","统成长":"1.1","智成长":"0.3","速成长":"1.0","特点":"三通鼓","生平":"曹操手下的将领，关羽在黄河渡口杀的秦琪是他外甥。他追到古城，要替外甥报仇。｜张飞在城上不开门，要关羽先斩了来将，亲自擂鼓，三通为限。第一通还没擂完，蔡阳的头已经落地。"},{"名":"车胄","阵营":"魏","定位":"武将","品阶":"骁","武力":"58","统率":"54","智力":"32","速度":"56","武成长":"1.2","统成长":"1.2","智成长":"0.5","速成长":"0.9","特点":"","生平":"曹操派到徐州的刺史。曹操密令他除掉刘备，陈登把消息透给了关羽。｜当夜关羽带兵打着曹军旗号来叫城，自称张辽。车胄出城迎接，看清来人时，关羽的刀已经到了。"},{"名":"秦琪","阵营":"魏","定位":"武将","品阶":"骁","武力":"60","统率":"50","智力":"20","速度":"62","武成长":"1.4","统成长":"1.0","智成长":"0.3","速成长":"1.1","特点":"","生平":"夏侯惇的部将，守黄河渡口。关羽连过四关走到这里要船，秦琪问他要文书：「你便插翅，也飞不过去！」｜关羽拍马上前，只一合，秦琪的头落了地。渡口的兵把船撑了过来。"},{"名":"王凌","阵营":"魏","定位":"武将","品阶":"骁","武力":"60","统率":"58","智力":"48","速度":"56","武成长":"1.2","统成长":"1.4","智成长":"1.0","速成长":"0.9","特点":"","生平":"王允的侄子，王允遇害那年，他翻城墙逃回了太原。｜晚年他镇守淮南，想改立楚王曹彪。司马懿大军突然开到，他自缚出降。押往洛阳路过贾逵庙，他冲庙门大喊：「贾梁道！王凌固忠于魏之社稷者，唯尔有神，知之。」"},{"名":"毌丘俭","阵营":"魏","定位":"武将","品阶":"骁","武力":"64","统率":"58","智力":"46","速度":"58","武成长":"1.4","统成长":"1.4","智成长":"0.9","速成长":"0.9","特点":"","生平":"河东闻喜人。他带兵攻下高句丽的丸都城，在山上刻石记功，这块碑后来在集安挖了出来。｜司马师废了曹芳，他和文钦在寿春起兵。兵败后他独自南逃，藏在河边草丛里，一个叫张属的平民放箭射死了他。"},{"名":"诸葛诞","阵营":"魏","定位":"武将","品阶":"骁","武力":"62","统率":"60","智力":"44","速度":"54","武成长":"1.3","统成长":"1.5","智成长":"0.9","速成长":"0.8","特点":"","生平":"诸葛亮的族弟。当时有句话：「蜀得其龙，吴得其虎，魏得其狗。」｜他在寿春起兵，城破身死。帐下几百个亲兵拱手站成一排，不肯投降。每杀一个就问下一个降不降，个个都答：「为诸葛公死，不恨。」"},{"名":"文钦","阵营":"魏","定位":"武将","品阶":"骁","武力":"66","统率":"54","智力":"28","速度":"62","武成长":"1.6","统成长":"1.2","智成长":"0.4","速成长":"1.1","特点":"文鸯他爹","生平":"谯郡人，曹爽的同乡。他随毌丘俭起兵，约好和儿子文鸯两路夜袭司马师大营。文鸯在营外擂鼓呼喊了一夜，文钦的兵始终没到。｜他逃去吴国，后来又随吴军进了寿春，城里粮尽，诸葛诞把他杀了。"},{"名":"田豫","阵营":"魏","定位":"武将","品阶":"骁","武力":"62","统率":"58","智力":"50","速度":"60","武成长":"1.3","统成长":"1.4","智成长":"1.0","速成长":"1.0","特点":"镇北","生平":"渔阳雍奴人。年少时跟过刘备，刘备做了豫州刺史，他以母亲年老辞归。刘备哭着送他：「恨不与君共成大业也。」｜晚年他上书请退：「钟鸣漏尽而夜行不休，是罪人也。」"},{"名":"王经","阵营":"魏","定位":"武将","品阶":"骁","武力":"60","统率":"56","智力":"40","速度":"56","武成长":"1.2","统成长":"1.3","智成长":"0.7","速成长":"0.9","特点":"","生平":"清河人，庄户人家出身，官做到二千石，母亲劝他到此为止，他没听。｜曹髦要带宿卫去打司马昭，王沈、王业跑去报信，王经没去。临刑前他向母亲叩头，母亲笑道：「人谁不死，但恐不得其所。以此并命，何恨之有！」"},{"名":"韩龙","阵营":"魏","定位":"武将","品阶":"骁","武力":"58","统率":"44","智力":"36","速度":"68","武成长":"1.4","统成长":"0.8","智成长":"0.6","速成长":"1.3","特点":"刺客，快","生平":"幽州刺史王雄手下的剑客。青龙三年，王雄派他进了鲜卑，轲比能死在他手里。｜他是怎么混进去的，用的什么兵器，事后得了什么赏，《三国志》一个字没写。"},{"名":"毛玠","阵营":"魏","定位":"文臣","品阶":"骁","武力":"32","统率":"46","智力":"68","速度":"50","武成长":"0.3","统成长":"1.0","智成长":"1.7","速成长":"0.8","特点":"","生平":"陈留平丘人。曹操刚占兖州时，他进言：「宜奉天子以令不臣，修耕植，畜军资。」｜后来他在东曹管选官，朝中大官不敢穿新衣、坐好车，有人特意穿破衣去见他。崔琰死后，有人告他说了怨话，下狱后免官回了家。"},{"名":"董昭","阵营":"魏","定位":"文臣","品阶":"骁","武力":"34","统率":"46","智力":"70","速度":"52","武成长":"0.3","统成长":"1.0","智成长":"1.8","速成长":"0.8","特点":"","生平":"天子回到洛阳，宫室烧光了，百官自己出去挖野菜。董昭给曹操出主意：先放话去鲁阳就粮，半路转去许县。｜樊城被围时，孙权来信要偷袭关羽，他主张把信射进两边营里，让关羽和曹仁都看到。"},{"名":"蒋济","阵营":"魏","定位":"文臣","品阶":"骁","武力":"36","统率":"48","智力":"68","速度":"50","武成长":"0.4","统成长":"1.1","智成长":"1.7","速成长":"0.8","特点":"","生平":"楚国平阿人。孙权围合肥，救兵迟迟不来，他写了封假信，称四万步骑已到雩娄，派三路信使送去，两路故意落进孙权手里。孙权烧了营就走。｜高平陵那年，他写信担保曹爽只会免官。曹爽满门被诛，他当年发病，没再起来。"},{"名":"孔秀","阵营":"魏","定位":"武将","品阶":"校","武力":"50","统率":"42","智力":"20","速度":"48","武成长":"1.0","统成长":"0.8","智成长":"0.3","速成长":"0.7","特点":"五关六将","生平":"守东岭关，手下五百兵。关羽护着两位嫂嫂到了关前，他要看丞相的文凭。关羽拿不出，他不放行，披挂上马杀下关来。｜只一个回合，关羽一刀砍了他。这是关羽过的头一道关。"},{"名":"韩福","阵营":"魏","定位":"武将","品阶":"校","武力":"48","统率":"44","智力":"24","速度":"46","武成长":"0.9","统成长":"0.9","智成长":"0.3","速成长":"0.6","特点":"","生平":"洛阳太守。关羽过了东岭关往洛阳来，他在城门口摆开人马。｜孟坦出去诱敌，他躲在门边，一箭射中关羽左臂。关羽用口咬出箭头，血流不住，飞马冲到门下，一刀连头带肩把他劈了。"},{"名":"孟坦","阵营":"魏","定位":"武将","品阶":"校","武力":"52","统率":"40","智力":"18","速度":"52","武成长":"1.1","统成长":"0.7","智成长":"0.3","速成长":"0.8","特点":"","生平":"韩福手下的牙将。关羽到了洛阳，两人商量好，他出城挑战，佯败把关羽引到门下。｜他拨马往回跑，马不如赤兔快，关羽赶上一刀，把他砍成两段。"},{"名":"卞喜","阵营":"魏","定位":"武将","品阶":"校","武力":"50","统率":"42","智力":"30","速度":"54","武成长":"1.0","统成长":"0.8","智成长":"0.5","速成长":"0.9","特点":"流星锤，设伏","生平":"汜水关守将，使流星锤，从前是黄巾余党。他在关前镇国寺埋下刀斧手，请关羽进寺喝酒。｜寺里长老普净是关羽同乡，举起腰间戒刀，朝关羽递了个眼色。关羽喝破埋伏，卞喜抡锤打来，关羽一刀隔开，追上去砍了。"},{"名":"王植","阵营":"魏","定位":"武将","品阶":"校","武力":"46","统率":"44","智力":"34","速度":"48","武成长":"0.9","统成长":"0.9","智成长":"0.6","速成长":"0.7","特点":"","生平":"荥阳太守，韩福的亲家。关羽进城，他摆酒款待，安排住进馆驿，半夜叫从事胡班领兵去放火。｜胡班偷看关羽夜读，认出他是父亲胡华托信的那个人，把实情讲了。关羽连夜出城，王植举着火把追上来，关羽回马一刀砍了他。"},{"名":"夏侯杰","阵营":"魏","定位":"武将","品阶":"校","武力":"48","统率":"40","智力":"16","速度":"50","武成长":"0.9","统成长":"0.7","智成长":"0.2","速成长":"0.8","特点":"吓死的","生平":"曹操身边的将。长坂坡上，张飞一人一马立在当阳桥头，曹军不敢上前。｜张飞挺矛又喝一声：「战又不战，退又不退，却是何故！」喊声未落，夏侯杰肝胆碎裂，从马上倒栽下来。"},{"名":"曹安民","阵营":"魏","定位":"武将","品阶":"校","武力":"50","统率":"42","智力":"26","速度":"52","武成长":"1.1","统成长":"0.8","智成长":"0.4","速成长":"0.8","特点":"","生平":"曹操的侄子。宛城张绣投降，曹操喝醉了，问左右城里可有妓女，曹安民凑上去，提起张济的遗孀邹氏。｜张绣得知，夜里起兵。曹操骑着大宛马逃出，曹安民徒步跟在后头，乱军追上来，把他剁成了肉泥。"},{"名":"许仪","阵营":"魏","定位":"武将","品阶":"校","武力":"54","统率":"44","智力":"16","速度":"50","武成长":"1.2","统成长":"0.9","智成长":"0.2","速成长":"0.8","特点":"许褚儿子","生平":"许褚的儿子。钟会伐蜀，派他在前头修路架桥。｜钟会骑马过桥，桥板一塌，马蹄陷了进去。钟会叫人把他拿下斩首，诸将提起许褚当年的功劳，钟会没理。"},{"名":"成济","阵营":"魏","定位":"武将","品阶":"校","武力":"54","统率":"40","智力":"14","速度":"54","武成长":"1.2","统成长":"0.7","智成长":"0.2","速成长":"0.9","特点":"弑君的戈","生平":"太子舍人。甘露五年，皇帝曹髦带着宫中卫士杀向司马昭，贾充领兵在南阙下拦住。成济问怎么办，贾充答：「司马公畜养汝等，正为今日！」｜成济抽戈上前，刺穿曹髦胸口，刃从背后透出。事后司马昭拿他顶罪，夷了三族。"},{"名":"贾充","阵营":"魏","定位":"文臣","品阶":"校","武力":"34","统率":"42","智力":"60","速度":"48","武成长":"0.4","统成长":"0.8","智成长":"1.4","速成长":"0.7","特点":"奸","生平":"平阳襄陵人，父亲贾逵是魏国名臣。曹髦举兵那天，是他在南阙下督兵迎战。｜晋朝立国，他位列三公，把女儿贾南风嫁给太子司马衷。晋伐吴，他一路反对，吴国平了，他进宫请罪。"},{"名":"糜芳","阵营":"蜀","定位":"武将","品阶":"骁","武力":"56","统率":"54","智力":"36","速度":"56","武成长":"1.1","统成长":"1.2","智成长":"0.6","速成长":"0.9","特点":"开门的","生平":"糜竺的弟弟。｜守江陵时，关羽嫌他军资供应不上，放话回来要治他。吕蒙兵到，他开了城门。｜在吴国坐船撞上虞翻，他的人喊着让路。虞翻骂：「失忠与信，何以事君？」他关上舱门，让自己的船先躲了。"},{"名":"傅士仁","阵营":"蜀","定位":"武将","品阶":"骁","武力":"56","统率":"52","智力":"34","速度":"56","武成长":"1.1","统成长":"1.1","智成长":"0.6","速成长":"0.9","特点":"","生平":"守公安，关羽出征时供应不力，挨过斥责。吕蒙兵到，虞翻在城外写信给他，他读完就降了，又领着吴兵去江陵劝糜芳。｜演义里刘备东征，他和糜芳砍了马忠的头来投。刘备不收，让关兴在关羽灵前把两人杀了。"},{"名":"孟达","阵营":"蜀","定位":"武将","品阶":"骁","武力":"62","统率":"54","智力":"48","速度":"60","武成长":"1.3","统成长":"1.2","智成长":"1.0","速成长":"1.0","特点":"反复","生平":"扶风人，字子度。｜关羽在襄樊求援，他和刘封推说山郡刚附，不肯发兵。关羽死后他降了魏，曹丕拉他同乘一辆车。｜曹丕死后，诸葛亮来信，他又动了心。司马懿八天赶了一千二百里，到了新城城下。"},{"名":"吴班","阵营":"蜀","定位":"武将","品阶":"骁","武力":"64","统率":"56","智力":"36","速度":"58","武成长":"1.5","统成长":"1.3","智成长":"0.6","速成长":"0.9","特点":"","生平":"吴懿的族弟，父亲吴匡是何进的部将。｜刘备伐吴，派他领几千人在平地扎营挑战，想把吴军引出来。陆逊按住诸将：「此必有谲，且观之。」｜建兴九年卤城一战，他和魏延、高翔迎击司马懿，斩首三千。"},{"名":"马忠","阵营":"蜀","定位":"武将","品阶":"骁","武力":"62","统率":"58","智力":"46","速度":"56","武成长":"1.3","统成长":"1.4","智成长":"0.9","速成长":"0.9","特点":"南中","生平":"巴西阆中人，小时候养在外家，姓狐，名笃，后来才改回马姓。｜猇亭兵败，他从巴西带五千人来补。刘备和他谈过，对刘巴感叹：「虽亡黄权，复得狐笃。」｜他在南中做庲降都督多年，死后当地夷人给他立了庙。"},{"名":"雷铜","阵营":"蜀","定位":"武将","品阶":"骁","武力":"64","统率":"52","智力":"24","速度":"60","武成长":"1.5","统成长":"1.1","智成长":"0.3","速成长":"1.0","特点":"","生平":"刘备手下的将领。建安二十三年刘备进兵汉中，分派他和吴兰进武都。｜曹洪的兵打过来，这一路人马全折了。陈寿只在《先主传》里提了一笔，连怎么死的都没写。"},{"名":"吴兰","阵营":"蜀","定位":"武将","品阶":"骁","武力":"62","统率":"52","智力":"26","速度":"62","武成长":"1.4","统成长":"1.1","智成长":"0.4","速成长":"1.1","特点":"","生平":"刘备的将领。建安二十三年进驻下辩，张飞、马超也在那一路。张飞扬言要断曹军后路，曹休看穿是虚张声势，曹洪便直扑吴兰。｜吴兰逃进氐人地界，阴平氐帅强端砍了他的头，送给曹操。"},{"名":"高翔","阵营":"蜀","定位":"武将","品阶":"骁","武力":"60","统率":"54","智力":"32","速度":"58","武成长":"1.2","统成长":"1.2","智成长":"0.5","速成长":"0.9","特点":"","生平":"演义里诸葛亮出祁山，派他去守列柳城，和街亭互为犄角。马谡丢了街亭，他那边也没守住。｜正史上，建兴九年在卤城，他和魏延、吴班一齐出战，把司马懿的兵打回营里，斩首三千。"},{"名":"陈式","阵营":"蜀","定位":"武将","品阶":"骁","武力":"60","统率":"52","智力":"26","速度":"58","武成长":"1.3","统成长":"1.1","智成长":"0.4","速成长":"0.9","特点":"","生平":"汉中之战，他领十几营人马去截马鸣阁道。徐晃杀过来，他的兵慌不择路，不少人跳进山谷摔死。｜建兴七年，诸葛亮派他取武都、阴平。郭淮来救，诸葛亮亲自出兵建威，郭淮退了回去，两郡就此拿下。"},{"名":"句扶","阵营":"蜀","定位":"武将","品阶":"骁","武力":"64","统率":"56","智力":"34","速度":"60","武成长":"1.5","统成长":"1.3","智成长":"0.6","速成长":"1.0","特点":"","生平":"巴西汉昌人，王平的同乡。王平传后面捎了他几句：忠勇宽厚，屡有战功，名位只比王平低一点。｜官做到左将军，封宕渠侯。史书上就这么多。"},{"名":"向宠","阵营":"蜀","定位":"武将","品阶":"骁","武力":"58","统率":"60","智力":"44","速度":"54","武成长":"1.1","统成长":"1.5","智成长":"0.9","速成长":"0.8","特点":"出师表点名，统率型","生平":"向朗的侄子。猇亭那一仗，各营都溃了，只有他那一营人马完整退了回来。｜诸葛亮出汉中前上表，特地点他的名：「性行淑均，晓畅军事。」营中的事，都要后主去问他。｜延熙三年，他领兵去打汉嘉的蛮夷，没有回来。"},{"名":"阎宇","阵营":"蜀","定位":"武将","品阶":"骁","武力":"58","统率":"54","智力":"38","速度":"56","武成长":"1.2","统成长":"1.2","智成长":"0.7","速成长":"0.9","特点":"","生平":"南郡人，做事勤快，在南中接了马忠的位子，后来升到右大将军。｜黄皓和他交好，想让他替掉姜维。姜维不敢回成都，求去沓中种麦。｜魏军入蜀那年，他在巴东，领兵西援，留罗宪守永安。"},{"名":"王甫","阵营":"蜀","定位":"文臣","品阶":"骁","武力":"34","统率":"46","智力":"68","速度":"50","武成长":"0.3","统成长":"1.0","智成长":"1.7","速成长":"0.8","特点":"","生平":"关羽北伐前，他劝关羽别让潘濬管江陵的粮草，换赵累去。关羽没听。｜后来随关羽困在麦城。关羽要走小路出城，他拦着：「小路有埋伏，可走大路。」｜关羽父子的首级传到城下，他大叫一声，从城头跳了下去。"},{"名":"赵累","阵营":"蜀","定位":"文臣","品阶":"骁","武力":"36","统率":"48","智力":"66","速度":"50","武成长":"0.4","统成长":"1.1","智成长":"1.6","速成长":"0.8","特点":"","生平":"关羽军中的都督。演义里王甫举荐他替潘濬管粮草，关羽没答应。｜建安二十四年十二月，关羽从麦城出走，到了章乡，潘璋的司马马忠截住了路。一起被捉的，有关羽、关平，还有他。"},{"名":"黄权","阵营":"蜀","定位":"文臣","品阶":"骁","武力":"44","统率":"50","智力":"70","速度":"52","武成长":"0.6","统成长":"1.2","智成长":"1.8","速成长":"0.8","特点":"谏刘备伐吴","生平":"刘备伐吴，他请命：「臣请为先驱以尝寇，陛下宜为后镇。」刘备不许，派他在江北防魏。｜猇亭兵败，回蜀的路断了，他领兵降了魏。有司请收押他的家小，刘备摆手：「孤负黄权，权不负孤也。」"},{"名":"范疆","阵营":"蜀","定位":"武将","品阶":"校","武力":"48","统率":"40","智力":"22","速度":"52","武成长":"1.0","统成长":"0.7","智成长":"0.3","速成长":"0.8","特点":"","生平":"张飞帐下的末将。张飞要替关羽报仇，限三天造齐白旗白甲。他和张达进帐求宽限，张飞把两人绑在树上，各打五十鞭。｜当夜张飞大醉，睡在帐中，两人怀揣短刀摸了进去。"},{"名":"张达","阵营":"蜀","定位":"武将","品阶":"校","武力":"48","统率":"40","智力":"20","速度":"52","武成长":"1.0","统成长":"0.7","智成长":"0.3","速成长":"0.8","特点":"","生平":"跟范疆一起进了张飞的帐。张飞睡觉不合眼，两人在床前站着不敢动，听见鼾声如雷，才一刀刺进他腹中。｜他们提着首级坐船投了东吴。刘备大军压境，孙权把二人绑了，连同张飞的首级送回蜀营。"},{"名":"马邈","阵营":"蜀","定位":"武将","品阶":"校","武力":"46","统率":"42","智力":"30","速度":"48","武成长":"0.9","统成长":"0.8","智成长":"0.5","速成长":"0.7","特点":"江油降的","生平":"守江油。邓艾的兵从阴平小道钻出来，他想着前头有姜维挡着，整日在家饮酒。｜妻子李氏听他要降，往他脸上啐了一口。他出城拜在邓艾马前，回到家里，李氏已经在房中自缢。"},{"名":"黄皓","阵营":"蜀","定位":"文臣","品阶":"校","武力":"30","统率":"38","智力":"56","速度":"48","武成长":"0.2","统成长":"0.6","智成长":"1.3","速成长":"0.7","特点":"奸","生平":"宫中宦官，从黄门丞做到中常侍。姜维请杀他，刘禅回话：「皓趋走小臣耳。」叫黄皓去给姜维赔罪。｜钟会、邓艾出兵，姜维上表求援，他找巫师占了一卦，报称魏兵不会来。表章就压下了。"},{"名":"樊建","阵营":"蜀", 长":"1.2","特点":"劫阿斗","生平":"孙权派他驾几十条船去荆州，带着假信，称吴国太病重，接孙夫人回去，还要她把阿斗一并抱上。｜船刚离岸，赵云追上来跳上船，从夫人怀里夺回阿斗。张飞的船横在江心，上船一剑，砍翻了他。"},{"名":"韩综","阵营":"吴","定位":"武将","品阶":"骁","武力":"58","统率":"52","智力":"30","速度":"58","武成长":"1.2","统成长":"1.1","智成长":"0.5","速成长":"0.9","特点":"叛","生平":"韩当的儿子。韩当一死，他怕从前的罪事发，趁出殡把父亲的灵柩和一家老小带过江，降了魏。｜此后他常领兵犯吴境，孙权提起他就咬牙。东兴一战魏军溃败，诸葛恪拿了他的首级，送到孙权庙前祭告。"},{"名":"孙翊","阵营":"吴","定位":"武将","品阶":"骁","武力":"64","统率":"52","智力":"28","速度":"62","武成长":"1.5","统成长":"1.1","智成长":"0.4","速成长":"1.1","特点":"孙策弟，暴","生平":"孙策的三弟，性子暴烈，很像他大哥。孙策临死，张昭一班人想让他接位，孙策把印绶给了孙权。｜二十岁做丹阳太守。一回宴请属下，他喝醉了，手边没带刀，边鸿从背后砍倒了他。"},{"名":"谷利","阵营":"吴","定位":"武将","品阶":"骁","武力":"58","统率":"56","智力":"32","速度":"66","武成长":"1.2","统成长":"1.3","智成长":"0.5","速成长":"1.3","特点":"救主","生平":"孙权身边的侍从。｜逍遥津那天，桥南的板子拆掉了一丈多。他在马后喊孙权抓牢鞍子、放松缰绳，自己一鞭抽下去，马跃过去了。｜后来孙权坐大船遇上大风，要往罗州，他拔刀对着舵工：「不取樊口者斩。」"},{"名":"孙静","阵营":"吴","定位":"辅助","品阶":"骁","武力":"40","统率":"52","智力":"62","速度":"50","武成长":"0.5","统成长":"1.2","智成长":"1.6","速成长":"0.8","特点":"孙坚弟","生平":"孙坚的幼弟。孙坚起兵，他在家乡聚了五六百人守门户。｜孙策打会稽，王朗据城死守。他出主意：从查渎绕过去，打高迁屯。孙策照做，王朗溃走。｜孙策要给他官做，他恋着祖坟和宗族，不肯出来。"},{"名":"张温","阵营":"吴","定位":"文臣","品阶":"骁","武力":"34","统率":"46","智力":"70","速度":"52","武成长":"0.3","统成长":"1.0","智成长":"1.8","速成长":"0.8","特点":"","生平":"吴郡人，出使蜀国。饯行宴上秦宓来得晚，他问：「君学乎？」接着问天有头吗、有耳朵吗，秦宓一句句引诗来答。｜回吴后他称赞蜀政，孙权不悦。又受暨艳一案牵连，罢官回乡，六年后病故。"},{"名":"薛综","阵营":"吴","定位":"文臣","品阶":"骁","武力":"32","统率":"46","智力":"68","速度":"50","武成长":"0.3","统成长":"1.0","智成长":"1.7","速成长":"0.8","特点":"","生平":"年轻时避乱到了交州。｜蜀使张奉在孙权席上拿阚泽的名字开玩笑，阚泽答不上。他起身敬酒：「有犬为獨，无犬为蜀，横目苟身，虫入其腹。」张奉反问吴字怎么讲，他应声就答：「无口为天，有口为吴。」"},{"名":"严畯","阵营":"吴","定位":"文臣","品阶":"骁","武力":"30","统率":"46","智力":"66","速度":"48","武成长":"0.3","统成长":"1.0","智成长":"1.6","速成长":"0.7","特点":"","生平":"彭城人，避乱到江东，和诸葛瑾、步骘交好。｜鲁肃死后，孙权要他带一万兵去守陆口。他再三推辞：「朴素书生，不闲军事。」推到后来掉了泪。孙权只好另派了人。"},{"名":"程秉","阵营":"吴","定位":"文臣","品阶":"骁","武力":"30","统率":"44","智力":"66","速度":"48","武成长":"0.3","统成长":"0.9","智成长":"1.6","速成长":"0.7","特点":"","生平":"汝南人，跟郑玄读过书，后来避乱交州，在士燮手下做长史。｜孙权请他来做太子孙登的太傅。孙登娶周瑜的女儿，他去吴郡迎亲，路上跟孙登讲夫妇之道。孙登恭恭敬敬听着，应了下来。"},{"名":"是仪","阵营":"吴","定位":"文臣","品阶":"骁","武力":"32","统率":"48","智力":"68","速度":"50","武成长":"0.3","统成长":"1.1","智成长":"1.7","速成长":"0.8","特点":"","生平":"北海营陵人，本来姓氏。孔融拿他的姓打趣：「氏」字是「民」字没了头，不如改成「是」。他就改了。｜吕壹告刁嘉诽谤朝政，旁人都怕吕壹，应承听到了，只有他答没听到。孙权一连几天追问，他不改口。"},{"名":"孙皓","阵营":"吴","定位":"辅助","品阶":"校","武力":"40","统率":"42","智力":"52","速度":"48","武成长":"0.5","统成长":"0.8","智成长":"1.2","速成长":"0.7","特点":"暴君","生平":"孙权的孙子。宫中设宴，群臣每人以七升为限，喝不下的就往嘴里灌；他还剥人面皮，凿人眼睛。｜吴亡后到了洛阳，晋武帝指着一个座位：「朕设此座以待卿久矣。」孙皓答：「臣于南方，亦设此座以待陛下。」"},{"名":"岑昏","阵营":"吴","定位":"文臣","品阶":"校","武力":"30","统率":"38","智力":"54","速度":"46","武成长":"0.2","统成长":"0.6","智成长":"1.2","速成长":"0.6","特点":"奸","生平":"孙皓宠信的宦官。晋军顺江东下，他出主意在江里横铁索、打铁锥，拦截晋船。｜王濬烧断铁索，船队一路下来。殿上几百人跪着请杀岑昏，孙皓点了头，众人冲进宫去把他剁碎了。"},{"名":"万彧","阵营":"吴","定位":"文臣","品阶":"校","武力":"30","统率":"40","智力":"56","速度":"46","武成长":"0.3","统成长":"0.7","智成长":"1.3","速成长":"0.6","特点":"","生平":"做过乌程令，和当时的乌程侯孙皓交好。孙休死后，他在濮阳兴、张布面前一再夸孙皓，孙皓这才当上皇帝。｜后来他做到右丞相。孙皓宴上赐他毒酒，倒酒的人偷偷减了分量，他没死成。几年后又挨了斥责，忧惧而终。"},{"名":"张悌","阵营":"吴","定位":"文臣","品阶":"校","武力":"40","统率":"44","智力":"58","速度":"48","武成长":"0.5","统成长":"0.9","智成长":"1.4","速成长":"0.7","特点":"末代丞相，战死","生平":"襄阳人，孙皓最后一任丞相。晋军南下，他领着沈莹、诸葛靓渡江迎战。｜兵败，诸葛靓来拉他走，他流着泪不动：「仲思，今日是我死日也。」诸葛靓走出百余步回头，晋兵已经围了上去。"},{"名":"沈莹","阵营":"吴","定位":"武将","品阶":"校","武力":"54","统率":"46","智力":"28","速度":"50","武成长":"1.2","统成长":"1.0","智成长":"0.4","速成长":"0.8","特点":"丹阳青巾兵","生平":"吴国的丹阳太守，手下五千刀盾兵，人称青巾兵，攻破过不少坚阵。｜太康元年随张悌渡江，他领青巾兵冲晋军阵，冲了三次，晋阵不动。他下令后撤，兵一退就乱了，晋将薛胜、蒋班追了上来。"},{"名":"程远志","阵营":"无","定位":"武将","品阶":"骁","武力":"60","统率":"50","智力":"22","速度":"56","武成长":"1.3","统成长":"1.0","智成长":"0.3","速成长":"0.9","特点":"第一关 Boss","生平":"黄巾将领，带五万人马犯涿郡。｜两军在大兴山下摆开，副将邓茂先出马，张飞一矛刺中心窝。他拍马舞刀直取张飞，关羽纵马迎上来，一刀挥为两段。"},{"名":"波才","阵营":"无","定位":"武将","品阶":"骁","武力":"62","统率":"54","智力":"34","速度":"58","武成长":"1.3","统成长":"1.2","智成长":"0.6","速成长":"0.9","特点":"颍川","生平":"颍川的黄巾首领。朱儁先来，被他打退了。他接着围住长社，皇甫嵩守在城里。｜他的兵靠着草丛扎营。一天夜里起了大风，城里每人扎一把草，从城外绕出来放火，城头举火接应。"},{"名":"孟优","阵营":"无","定位":"武将","品阶":"骁","武力":"60","统率":"54","智力":"20","速度":"56","武成长":"1.3","统成长":"1.2","智成长":"0.3","速成长":"0.9","特点":"孟获弟","生平":"孟获的弟弟。孟获第二回被放回去后，他领着一百多个蛮兵，抬着金珠宝贝进蜀营诈降，约好半夜里应外合。｜诸葛亮收了礼，摆酒款待，酒里下了药。孟获半夜杀进营来，只看见他和手下醉倒一地。"},{"名":"迷当大王","阵营":"无","定位":"武将","品阶":"骁","武力":"62","统率":"56","智力":"24","速度":"60","武成长":"1.4","统成长":"1.3","智成长":"0.3","速成长":"1.0","特点":"羌","生平":"西羌的国王。姜维北伐，派人带金珠来结好，他发兵五万相助。｜半路中了郭淮的计，连人带马掉进陷坑，被活捉了。郭淮亲手给他松绑，好言放回，他掉头领着羌兵去打蜀营。"},{"名":"邓茂","阵营":"无","定位":"武将","品阶":"校","武力":"50","统率":"42","智力":"18","速度":"52","武成长":"1.1","统成长":"0.8","智成长":"0.3","速成长":"0.8","特点":"张飞一矛","生平":"黄巾程远志的副将。五万黄巾扑向涿郡，刘关张领着五百人在大兴山下迎住。｜他挺枪出阵，张飞挺起丈八蛇矛，一矛刺中他心窝，他翻身落马。程远志拍马舞刀来战，关羽迎了上去。"},{"名":"韩忠","阵营":"无","定位":"武将","品阶":"校","武力":"50","统率":"44","智力":"22","速度":"48","武成长":"1.0","统成长":"0.9","智成长":"0.3","速成长":"0.7","特点":"","生平":"宛城黄巾的头领。朱儁围城，他派人出来求降，朱儁不许：「若容其降，无以劝善。」｜刘备献计，撤开东南，猛攻西北。韩忠果然弃城往东南跑，刘备兄弟领兵截住掩杀，乱箭把他射死了。"},{"名":"赵弘","阵营":"无","定位":"武将","品阶":"校","武力":"52","统率":"42","智力":"18","速度":"50","武成长":"1.1","统成长":"0.8","智成长":"0.3","速成长":"0.8","特点":"","生平":"黄巾余党。韩忠死后，他和孙仲收拾残兵，又占了宛城。｜朱儁再来攻城，孙坚头一个爬上城头，连杀二十多人。赵弘挺槊直冲过来，孙坚夺过他手里的槊，反手把他刺下了马。"},{"名":"孙仲","阵营":"无","定位":"武将","品阶":"校","武力":"50","统率":"42","智力":"18","速度":"50","武成长":"1.0","统成长":"0.8","智成长":"0.3","速成长":"0.8","特点":"","生平":"跟着赵弘守宛城的黄巾头目。孙坚上城杀了赵弘，城里乱成一团。｜他引着残兵从北门冲出，正撞上刘备。他只顾逃命，刘备拉弓一箭，他翻身栽下马来。"},{"名":"严政","阵营":"无","定位":"武将","品阶":"校","武力":"48","统率":"40","智力":"24","速度":"50","武成长":"0.9","统成长":"0.7","智成长":"0.4","速成长":"0.8","特点":"杀张宝的","生平":"地公将军张宝帐下的将。张宝在阳城被朱儁围住，城外攻得一天比一天紧。｜城里撑不下去，严政摸到张宝身后，一刀把他刺死，割下首级，开城投降。"},{"名":"裴元绍","阵营":"无","定位":"武将","品阶":"校","武力":"52","统率":"42","智力":"16","速度":"50","武成长":"1.1","统成长":"0.8","智成长":"0.2","速成长":"0.8","特点":"","生平":"黄巾余党，和周仓一起占着卧牛山。周仓跟着关羽走了，他留在山上。｜后来有个汉子单枪匹马从山下过，他看中那匹马，带人去抢。那人是赵云，一枪把他刺死，占了他的山寨。"},{"名":"带来洞主","阵营":"无","定位":"武将","品阶":"校","武力":"50","统率":"46","智力":"26","速度":"48","武成长":"1.0","统成长":"1.0","智成长":"0.4","速成长":"0.7","特点":"","生平":"祝融夫人的弟弟，孟获的妻弟。孟获屡败，他出主意去请八纳洞木鹿大王，那人会驱使虎豹豺狼。｜后来他又献计诈降，绑着孟获去见诸葛亮，各人身上藏着刀。进了大寨，两边壮士齐出，一个个都拿下了。"},{"名":"忙牙长","阵营":"无","定位":"武将","品阶":"校","武力":"56","统率":"42","智力":"14","速度":"52","武成长":"1.3","统成长":"0.8","智成长":"0.2","速成长":"0.8","特点":"","生平":"孟获手下的大将，使一口截头大刀，骑一匹黄骠马。｜马岱渡过泸水，截了蛮兵的粮道。孟获派他去夺，两马相交只一个回合，马岱一刀把他砍下马去。"},{"名":"金环三结","阵营":"无","定位":"武将","品阶":"校","武力":"54","统率":"44","智力":"16","速度":"50","武成长":"1.2","统成长":"0.9","智成长":"0.2","速成长":"0.8","特点":"","生平":"南中三洞元帅之一，孟获起兵，他领五万蛮兵守中路。｜赵云、魏延趁夜劫寨，他慌忙出迎，赵云一枪把他刺于马下，割了首级回营。"},{"名":"董荼那","阵营":"无","定位":"武将","品阶":"校","武力":"50","统率":"44","智力":"20","速度":"50","武成长":"1.0","统成长":"0.9","智成长":"0.3","速成长":"0.8","特点":"","生平":"三洞元帅之一。头一仗就让蜀军捉了，诸葛亮给他酒食，放了回去。｜孟获逼他再去交战，阵前马岱骂他忘恩，他红着脸退了回来，挨了孟获一百大棍。当天夜里，他和阿会喃趁孟获酒醉，把他绑了送往蜀营。"},{"名":"阿会喃","阵营":"无","定位":"武将","品阶":"校","武力":"50","统率":"44","智力":"20","速度":"50","武成长":"1.0","统成长":"0.9","智成长":"0.3","速成长":"0.8","特点":"","生平":"三洞元帅之一，领五万蛮兵守一路。蜀军劫寨，他往山谷里逃，撞进伏兵手里，诸葛亮给了酒饭放回去。｜后来他跟董荼那绑了孟获献给诸葛亮。孟获回洞，请两人到帐中议事，席上叫人杀了，尸首扔进山涧。"},{"名":"徹里吉","阵营":"无","定位":"武将","品阶":"校","武力":"52","统率":"46","智力":"26","速度":"50","武成长":"1.1","统成长":"1.0","智成长":"0.4","速成长":"0.8","特点":"羌王","生平":"西羌国王。曹真派人带着金珠厚礼来求援，他派丞相雅丹、元帅越吉领着铁车兵东进。｜天降大雪，铁车兵追进诸葛亮挖好的陷坑。雅丹被擒，诸葛亮放了回去，托他带话：蜀汉与羌人本来无仇。"}],"skills":[{"名":"刘备","品阶":"无双","技能":"仁德","类型":"指挥","发动":"—","DSL":"指挥 | buff(aall,def,10); rend:heal(ahpmin,6)","文案":"开战时我方全体统率 +10%。每回合结束，我方兵力比例最低的一人回兵 6%。"},{"名":"关羽","品阶":"无双","技能":"温酒斩将","类型":"主动·瞬发","发动":"40%","DSL":"瞬发 40 | custom(关羽斩)","文案":"刀劈敌方兵力最多的一人，造成 2.6 倍兵刃伤害。那人兵力已不到三成时，直接斩杀，每场一次。"},{"名":"张飞","品阶":"无双","技能":"当阳一吼","类型":"主动·准备","发动":"40%","DSL":"准备 40 | dmg(eall,0.7); st(last,震慑,1,50)","文案":"先蓄一回合。下回合一声大吼，对敌方全体造成 0.7 倍兵刃伤害，每人 50% 被震慑 1 回合。"},{"名":"赵云","品阶":"无双","技能":"七进七出","类型":"追击","发动":"55%","DSL":"追击 55 | custom(赵云七进七出); rstart:custom(赵云追击率)","文案":"普攻之后再追一枪，造成 1.2 倍兵刃伤害。被追的人兵力不到一半时再追一枪，最多连追三枪。赵云自己每少一成兵，追击率 +3%。"},{"名":"马超","品阶":"无双","技能":"神威天将军","类型":"兵种·西凉铁骑","发动":"—","DSL":"兵种 | buff(self,agi,10); atk:dmg(other,1)@r<=3; rend:custom(马超后期)","文案":"速度 +10%。前三回合，马超每次普攻顺带冲撞另一个敌人，造成 1.0 倍兵刃伤害。第四回合起不再冲撞，改为每回合武力 +4%，最多 +16%。"},{"名":"黄忠","品阶":"无双","技能":"百步穿杨","类型":"主动·瞬发","发动":"45%","DSL":"瞬发 45 | custom(黄忠老当益壮)","文案":"射敌方统率最低的一人，造成 2.4 倍兵刃伤害，不会被闪开，这一箭暴击率 +40%。战斗每多一回合，倍率 +0.1，最多 +0.8。"},{"名":"诸葛亮","品阶":"无双","技能":"借东风","类型":"主动·准备" ,"story":{"chapters":{"1":{"name":"桃园结义（184）","year":"","intro":"中平元年，黄巾起。涿县街上贴出招兵榜文，三个不认识的人站在榜下。"},"2":{"name":"十常侍之乱（189）","year":"","intro":"灵帝驾崩，何进和十常侍在宫里对上了，谁也没赢，赢的是从西凉来的那个人。"},"3":{"name":"讨董联盟（190–191）","year":"","intro":"曹操发矫诏，十八路诸侯会于酸枣。人多，心不齐。"},"4":{"name":"连环计（191–192）","year":"","intro":"董卓迁都长安，王允在府里对着月亮叹气，貂蝉在后面听着。"},"5":{"name":"群雄逐鹿（191–194）","year":"","intro":"董卓死了，天下没太平，反倒是人人都想当董卓。"},"6":{"name":"江东小霸王（195–200）","year":"","intro":"孙策拿传国玺押给袁术，借了三千兵回江东，五年打下六郡。"},"7":{"name":"辕门射戟（196–198）","year":"","intro":"吕布抢了徐州，刘备反倒住进了小沛。两年后下邳城被水泡了三个月。"},"8":{"name":"煮酒论英雄（199–200）","year":"","intro":"许都的天子是个摆设，刘备在后园种菜，种得很认真。"},"9":{"name":"千里走单骑（200）","year":"","intro":"关羽降了汉，没降曹。曹操给了他一匹马，他谢了，说这马快，能早点去找哥哥。"},"10":{"name":"官渡之战（200–202）","year":"","intro":"袁绍七十万，曹操七万，粮草够一个月。"},"11":{"name":"三顾茅庐（207–208）","year":"","intro":"刘备在新野住了七年，腿上长了肉，哭了一场，然后去了隆中。"},"12":{"name":"长坂坡（208）","year":"","intro":"十几万百姓跟着刘备走，一天十里。虎豹骑一天三百里。"},"13":{"name":"赤壁·上（208）","year":"","intro":"诸葛亮过江，江东文官排在堂下等他。周瑜在后面等着看。"},"14":{"name":"赤壁·下（208）","year":"","intro":"东南风起，二十条火船。"},"15":{"name":"三气周瑜（209–210）","year":"","intro":"周瑜三十六岁，气死的。他临死前说的话，孙权没听懂。"},"16":{"name":"马超复仇（211）","year":"","intro":"马腾死在许都。马超带西凉二十万人到了潼关。"},"17":{"name":"取西川（211–214）","year":"","intro":"张松带着西川地图去许都，曹操没正眼看他。他回头去了荆州。"},"18":{"name":"汉中王（215–219）","year":"","intro":"刘备在汉中筑坛称王，五虎上将的名单发下去，关羽看了一眼。"},"19":{"name":"走麦城（219）","year":"","intro":"关羽水淹七军，威震华夏。四个月后他死在临沮。"},"20":{"name":"夷陵之战（220–223）","year":"","intro":"曹丕篡汉，刘备称帝，然后带七十万人去给关羽报仇。"},"21":{"name":"七擒孟获（225）","year":"","intro":"南中三郡反了，诸葛亮五月渡泸，深入不毛。"},"22":{"name":"出师北伐（227–228）","year":"","intro":"建兴五年春，诸葛亮上表出师。表上写着「臣本布衣」。"},"23":{"name":"六出祁山（228–234）","year":"","intro":"五丈原的秋风，帐中七盏灯。"},"24":{"name":"司马篡魏（239–260）","year":"","intro":"司马懿装病装了十年，曹爽陪着少帝出城祭祖那天，他好了。"},"25":{"name":"姜维九伐（249–262）","year":"","intro":"诸葛亮死了二十八年，姜维还在往北打。"},"26":{"name":"三国归晋（263–280）","year":"","intro":"天下大势，分久必合。"},"27":{"name":"黄巾余烬","year":"","intro":""},"28":{"name":"西凉羌胡","year":"","intro":""},"29":{"name":"南蛮秘境","year":"","intro":""},"30":{"name":"边地烽火","year":"","intro":""}},"stages":{"1|桃园三结义":"刘备看着榜叹气，身后一个黑脸大汉喝道：大丈夫不为国出力，何故长叹？","1|大破程远志":"程远志领五万黄巾犯涿郡，邹靖手里只有五百乡勇，三个新拜的兄弟站在最前头。","1|颍川解围":"长社一把火，黄巾溃兵漫山遍野往北跑，正撞上刘备的队伍。","1|广宗之战":"张角病死，张梁守广宗，城下黄巾摆了三十六方的阵。","1|太平要术":"张角死后，那三卷天书没人知道去了哪。","2|鞭打督邮":"安喜县督邮索贿不成，要害刘备，张飞把他绑在县前的马桩上。","2|宫门之变":"何进进宫，嘉德殿门一关，十常侍的刀已经在袖子里。","2|董卓进京":"西凉兵进了洛阳，董卓每天带铁甲卫士出入宫廷，百官没人敢说话。","2|吕布杀丁原":"李肃牵着赤兔马进了吕布的营帐，天亮时丁原的头挂在辕门上。","3|矫诏聚义":"曹操刺董不成逃回陈留，散了家财招兵，十八路诸侯的旗在酸枣立起来。","3|汜水关":"华雄连斩鲍忠、祖茂、俞涉、潘凤，帐中诸侯的脸色一个比一个白。","3|温酒斩华雄":"关羽出帐时，曹操斟的那杯酒还热着。","3|三英战吕布":"虎牢关前，吕布方天画戟一挑，八路诸侯十几员将没人接得住三合。","3|洛阳井中物":"洛阳宫里一口井，井底沉着个宫女，怀里抱着个匣子。","4|火烧洛阳":"董卓一把火烧了洛阳，曹操追到荥阳，徐荣在半路等着。","4|凤仪亭":"貂蝉在凤仪亭边扑向池子，吕布抱住她，董卓的画戟从后面掷了过来。","4|诛董卓":"董卓乘车入朝受禅，车到宫门，两旁伏了一百多人。","4|李郭反攻长安":"贾诩对李傕郭汜说，你们要是散伙，一个亭长就能把你们抓了。","5|界桥之战":"麹义的先登死士射倒了白马义从，一个常山少年从阵里杀出来。","5|岘山伏兵":"孙坚追刘表追进了岘山，山上滚石乱箭一齐下来。","5|陶谦让徐州":"曹操报父仇，兵锋所至鸡犬不留，刘备带着几千兵去救徐州。","5|濮阳大战":"濮阳城的火光里，曹操险些死在吕布戟下，问他曹操在哪，他指了指前面。","5|白马义从":"公孙瓒的白马义从是在幽州边上打乌桓练出来的。","6|传国玺借兵":"袁术收了玉玺，给了三千兵，孙策连夜过江。","6|神亭酣斗":"神亭岭上太史慈和孙策打到天黑，一个抢了头盔一个抢了短戟。","6|平定江东":"严白虎、王朗、刘繇一个一个倒下，孙策从此人称小霸王。","6|小霸王之死":"许贡的三个门客等在丹徒的猎场，孙策的马跑得太快，卫士没跟上。","6|于吉的符水":"于吉死后，城楼上的人夜夜看见他。","7|吕布袭徐州":"张飞喝醉了打曹豹，曹豹连夜开门放吕布进城。","7|辕门射戟":"纪灵带三万兵来打小沛，吕布把画戟插在辕门外一百五十步。","7|宛城之战":"张绣先降后叛，典韦守在营门口，手里没有双戟。","7|白门楼":"侯成宋宪魏续绑了吕布献城，白门楼上曹操问刘备：你怎么看？","7|陈宫的最后一计":"陈宫劝吕布出城成犄角之势，吕布听了严氏的话，没出去。","8|许田打围":"曹操接了献帝的箭射死那只鹿，站在天子前面受了百官的贺。","8|衣带诏":"董承带着缝在衣带里的血诏出宫，一路不敢回头。","8|煮酒论英雄":"曹操说天下英雄唯使君与操耳，刘备的筷子掉在地上，正巧一声雷。","8|徐州失守":"曹操亲征徐州，刘备兵败投袁绍，张飞逃入芒砀山，关羽困在下邳。","9|土山约三事":"张辽上土山劝关羽，关羽提了三件事，一件都不能少。","9|斩颜良诛文丑":"白马坡下颜良在麾盖下，只看见一匹赤兔马冲过来。","9|过五关斩六将":"东岭、洛阳、汜水、荥阳、滑州，五道关六个守将，一把青龙刀。","9|古城会":"古城外张飞挺矛就刺，说你要是真心，三通鼓内斩了追来的蔡阳。","10|白马延津":"袁绍大军压到官渡，田丰在冀州牢里，沮授在军中被看着。","10|许攸夜奔":"许攸半夜到曹营，曹操光着脚出来迎他。","10|火烧乌巢":"乌巢是袁绍的粮仓，淳于琼喝醉了睡在营里。","10|官渡决战":"粮烧了，张郃高览投了曹操，七十万人一夜散了。","10|冀州府库":"袁家四世三公，冀州府库里的东西比皇宫多。","10|河北四庭柱":"颜良文丑张郃高览，河北人叫他们四庭柱。","11|跃马檀溪":"蔡瑁在襄阳设宴要杀刘备，的卢马一跃三丈过了檀溪。","11|三顾茅庐":"第三次去隆中，半路撞上夏侯惇派来的探马。那个人在睡午觉，刘备在阶下站了两个时辰。","11|火烧博望":"夏侯 <script>
/* ---- engine_battle.js ---- */
// 三国群英录 · 战斗引擎（从 sim/engine.py + sim/dsl.py + sim/skills_custom.py 逐行搬过来）
// 不碰 DOM。浏览器里挂在 window.SG，node 里 module.exports。
(function (G) {
'use strict';
const SG = G.SG = G.SG || {};

// ---------------- 随机数 ----------------
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function makeRng(seed) {
  const f = seed == null ? Math.random : mulberry32(seed);
  const R = {
    random: f,
    uniform: (a, b) => a + (b - a) * f(),
    choice: L => { if (!L.length) throw new IndexError('choice'); return L[Math.floor(f() * L.length)]; },
    sample: (L, n) => {
      if (n > L.length) throw new Error('sample larger than population');
      const c = L.slice(), out = [];
      for (let i = 0; i < n; i++) { const j = i + Math.floor(f() * (c.length - i)); const t = c[i]; c[i] = c[j]; c[j] = t; out.push(c[i]); }
      return out;
    },
    shuffle: L => { for (let i = L.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); const t = L[i]; L[i] = L[j]; L[j] = t; } return L; },
    randint: (a, b) => a + Math.floor(f() * (b - a + 1)),
  };
  return R;
}
// 战斗用的全局随机源，可以换成带种子的
let R = makeRng();
SG.setBattleSeed = s => { R = makeRng(s); SG.R = R; };
SG.makeRng = makeRng;
SG.R = R;

class IndexError extends Error { constructor(m) { super(m); this.name = 'IndexError'; } }
SG.IndexError = IndexError;
function first(L) { if (!L || !L.length) throw new IndexError('list index out of range'); return L[0]; }
function argmax(L, key) { if (!L.length) throw new Error('max() arg is an empty sequence'); let b = L[0], bk = key(b); for (let i = 1; i < L.length; i++) { const k = key(L[i]); if (k > bk) { b = L[i]; bk = k; } } return b; }
function argmin(L, key) { if (!L.length) throw new Error('min() arg is an empty sequence'); let b = L[0], bk = key(b); for (let i = 1; i < L.length; i++) { const k = key(L[i]); if (k < bk) { b = L[i]; bk = k; } } return b; }
function sortBy(L, key) { const m = L.map((x, i) => [key(x), i, x]); m.sort((a, b) => a[0] - b[0] || a[1] - b[1]); return m.map(x => x[2]); }
function pyRound(x) { const r = Math.round(x); return (Math.abs(x % 1) === 0.5 && r % 2 !== 0) ? r - 1 : r; }
SG.util = { first, argmax, argmin, sortBy, pyRound };

const BASE = 0.30, GAMMA = 2.0;
const CTRL = ['震慑', '混乱', '缴械', '计穷', '怯战', '挑衅', '迷惑'];
const STARK = { 1: 0, 2: .05, 3: .10, 4: .15, 5: .20 };
SG.CTRL = CTRL;

// ---------------- Unit ----------------
class Unit {
  constructor(h, lv = 50, star = 1) {
    this.name = h['名']; this.faction = h['阵营']; this.role = h['定位']; this.tier = h['品阶'];
    const g = (k, gk) => (parseFloat(h[k]) + parseFloat(h[gk]) * (lv - 1)) * (1 + STARK[star]);
    this.base = { atk: g('武力', '武成长'), def: g('统率', '统成长'), int: g('智力', '智成长'), agi: g('速度', '速成长') };
    this.lv = lv; this.star = star;
    this.maxhp = lv * 1000.0; this.hp = this.maxhp; this.lvhp = this.maxhp;
    this.buffs = []; this.status = {}; this.shield = 0.0;
    this.skill = null; this.extras = []; this.equip = [];
    this.prep = null; this.flags = {};
    this.team = null; this.side = 0; this.idx = 0; this.battle = null;
    this.taunt_by = null; this.hidden = 0; this.once = new Set();
    this.tally = { dealt: 0, taken: 0, healed: 0 };
  }
  alive() { return this.hp > 0; }
  front() { return this.idx < 3; }
  stat(k) {
    let pct = 0; for (const b of this.buffs) if (b[0] === k) pct += b[1];
    pct = Math.max(-0.30, Math.min(0.25, pct));
    let flat = 0, epct = 0;
    for (const e of this.equip) {
      if (e['维'] === k) {
        flat += parseFloat(e['固定']) * (e['归属'] === this.name ? 1.5 : 1.0);
        epct += parseFloat(e['百分比']) / 100;
      }
    }
    return (this.base[k] + flat) * (1 + pct + epct);
  }
  addbuff(k, pct, rounds = -1, tag = null) {
    if (rounds > 0 && SG.REND_FIX && this.battle && this.battle.inRend) rounds += 1;   // V0.7：回合末加的效果要撑到下一回合
    if (tag) { for (const b of this.buffs) if (b[3] === tag) { b[1] = pct; b[2] = rounds; return; } }

  D.CHAPTERS = [];

function skillMul(name) { const k = (SG.D && SG.D.SKPOW && SG.D.SKPOW[name]) || 0; return Math.max(.5, 1 + 2 * k); }
SG.skillMul = skillMul;
function unitPower(u) {

  return (u.stat('atk') + u.stat('def') + u.stat('int') + u.stat('agi')) * (1 + .15 * ti) * (u.maxhp / 1000) / 10 * (0.5 + 0.5 * Math.max(0, u.hp) / u.maxhp) * skillMul(u.name);
}

// V0.7 战斗经验：算一个人这一仗拿多少
function expFor(lv, foeLv, nFoes, win, alive, replay) {
  let e = CFG.exp_win(Math.min(foeLv, lv + CFG.exp_under), nFoes);   // 敌方高出 10 级以上按高 10 级算，免得拿低级将领送死刷经验
  if (!win) e *= CFG.exp_lose;
  if (!alive) e *= CFG.exp_dead;
  if (replay) e *= CFG.exp_replay;
  if (lv >= foeLv + CFG.exp_over) e *= CFG.exp_over_k;

  h.exp = (h.exp || 0) + e; let up = 0;
  while (h.lv < maxLv && h.exp >= CFG.exp_need(h.lv)) { h.exp -= CFG.exp_need(h.lv); h.lv++; up++; }
  if (h.lv >= maxLv) h.exp = 0;

}

function strHash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  if (lim.includes('一对一')) max = 1;
  const sv = /撑过(\S)回合即胜/.exec(lim);
  return { text: lim, max, survive: sv ? CN_NUM[sv[1]] : 0, wheel: lim.includes('车轮战'), bridge: lim.includes('桥窄'), noAttack: lim.includes('我方不能攻击'), duel: lim.includes('一对一') };
}
// 引擎实现了的限制，界面上照原文显示；没实现的（sim 里也没做）归到剧情说明
const LIMIT_IMPL = [/只能带\S人/, /一对一/, /撑过\S回合即胜/, /车轮战/, /桥窄/, /我方不能攻击/, /兵力\d+%/, /敌方前(三|两)回合/, /敌方三回合不攻击/, /反目/, /灼烧伤害翻倍/, /回场/];
function limitParts(stage) {

}
SG.stageLimit = stageLimit; SG.limitParts = limitParts;

// 周目换算：等级平移到 30–60，星级 +1，杂兵换同阵营名档（按关卡 id 哈希定死），隐藏关不换
function stageFoes(stage, cycle = 1, tx = null, myLv = 0) {
  const D = SG.D;
  let names = stage['敌方'].split('、').filter(x => x);
  let lv = +stage['等级'], star = +stage['星级'];
  if (stage['类型'] === '章末') lv += CFG.boss_lv_plus;
  if (cycle >= 2) {
    lv = Math.min(70, Math.round(30 + (lv - 1) * 30 / 52) + (cycle - 2) * 10);
    star = Math.min(5, star + 1);
    if (stage['类型'] !== '隐藏') {
      const used = new Set(names);
      names = names.map((n, i) => {
        if (D.H[n]) return n;
        const fac = MOB_FAC[n] || '汉';
        const pool = D.HLIST.filter(x => D.H[x]['品阶'] === '名' && D.H[x]['阵营'] === fac && !used.has(x));
        if (!pool.length) return n;
        const pick = pool[strHash(stage.id + ':' + i) % pool.length]; used.add(pick); return pick;
      });
    }
  }
  if (stage['类型'] === '隐藏') { if (CFG.hidden_star) star = CFG.hidden_star; if (myLv) lv = Math.min(CFG.hidden_cap, Math.max(lv, myLv + CFG.hidden_over)); }
  if (tx && tx.includes('天狼')) names = txMob(stage, names);
  return { names, lv, star };
}
SG.stageFoes = stageFoes;
// 敌方属性系数：表里的「系数」已含章末 ×1.10，这里换成 type_mul
function stageEase(st) { const e = parseFloat(st['系数']) || 1, t = st['类型']; return t === '章末' || t === '隐藏' ? e / 1.10 * (CFG.type_mul[t] || 1) : e; }

function apply_limit(stage, A, B) {

  if (lim.includes('我方不能攻击')) for (const a of A) { a.status['缴械'] = 3; a.status['计穷'] = 3; }
  if (lim.includes('敌方前三回合怯战')) for (const e of B) e.status['怯战'] = 3;
  if (lim.includes('桥窄')) for (const e of B) e.flags['桥窄'] = true;
  if (lim.includes('敌方前两回合不能攻击')) for (const e of B) { e.status['缴械'] = 2; e.status['计穷'] = 2; }
  if (lim.includes('敌方三回合不攻击')) for (const e of B) { e.status['缴械'] = 3; e.status['计穷'] = 3; }

  if (lim.includes('反目')) for (const e of B) if (e.name === '吕布' || e.name === '董卓') e.extras.push(SG.build(SG.parse_line('被动 | rend:custom(反目自伤)'), '反目'));

// ---------------- 存档与养成（闯关） ----------------

  tokenCost(k) { let c = 0; for (let i = 0; i < k; i++) c += this.tokenPrice(i); return c; }
  buyTokens(k) { const c = this.tokenCost(k); if (this.s.gold < c) return false; this.s.gold -= c; this.s.tokensBought += k; this.s.tokens += k; return true; }
  starNeed(n) { const h = this.hero(n); if (h.star >= 5) return 0; return Math.trunc(pyRound(CFG.star_need[h.star] * CFG.star_q[this.D.H[n]['品阶']])); }

  }

      if (!replay) {

      ${win ? `<div class="small" style="text-align:center">${rew.first ? '首通　' : ''}金 +${num(rew.gold)}${rew.gold2 ? `　黄金 +${rew.gold2}` : ''}</div>${items ? `<div class="small" style="margin-top:6px">${items}</div>` : ''}${exclNote(rew)}${expNote(rew)}`
        : `<div class="small muted" style="text-align:center">败退。折损的兵马要去征兵补齐。</div>${expNote(rew)}`}
      ${achRows(out.ach)}
      ${win && st && +st['章'] === 26 && st['类型'] === '章末' && !G.s.seenEpi && (D0.crawl || {}).epilogue ? '<div class="btns"><div class="btn main" data-a="crawl-epi">尾　声</div></div>' : ''}
      <div class="btns"><div class="btn" data-a="go" data-v="${out.back || 'stages'}">回征战</div>${st ? `<div class="btn" data-a="to-form" data-id="${st.id}">重新布阵</div><div class="btn main" data-a="refight">再战一场</div>` : ''}</div></div>`;
  }
  const title = out.title || (st ? st['关'] : '');
  V.side = window.innerWidth >= 700 && window.innerWidth > window.innerHeight;
  const rn0 = b.events.length && B.ei ? b.events[Math.min(B.ei, b.events.length) - 1].r : 0;
  const vs = V.side ? `<div class="vs"><span>我</span><span>第<span class="rn" id="rn">${rn0}</span>回合</span><span>敌</span></div>` : `<div class="vs"><span>敌</span><span>第 <span class="rn" id="rn">${rn0}</span> 回合</span><span>我</span></div>`;
  return `<div class="row" style="padding:10px 0 4px"><b class="kai" style="font-size:1.1em">${esc(title)}</b><span class="grow"></span><span class="small muted">${out.res.battles.length > 1 ? `第 ${B.bi + 1} / ${out.res.battles.length} 阵　` : ''}</span></div>
    ${V.side ? `<div class="bf side"><div class="bgrid">${g.bot}</div>${vs}<div class="bgrid">${g.top}</div></div>`
      : `<div class="bf"><div class="bgrid">${g.top}</div>${vs}<div class="bgrid">${g.bot}</div></div>`}
    ${B.done ? '' : `<div class="ctrl"><span class="btn sm${Play.speed === 1 ? ' main' : ''}" data-a="spd" data-v="1">1×</span><span class="btn sm${Play.speed === 2 ? ' main' : ''}" data-a="spd" data-v="2">2×</span><span class="btn sm${Play.speed === 4 ? ' main' : ''}" data-a="spd" data-v="4">4×</span><span class="btn sm" data-a="skip">跳过</span></div>`}
    ${B.done ? `<div class="row" style="margin-top:8px"><span class="small muted">共 ${out.res.rounds || Play.cur().round} 回合</span><span class="grow"></span><span class="btn sm" data-a="blog-full">${Play.full ? '收起战报' : '看全战报'}</span></div>` : ''}
    <div class="blog${B.done && Play.full ? ' full' : ''}" id="blog"></div>${tail}${B.done ? `<div class="card" style="margin-top:8px">${Play.board()}</div>` : ''}`;
}

  import: () => openModal(`<div class="shead">导入<span class="x" data-a="close">关闭</span></div>

  'import-do': async () => {
    let json;

    const r = SG.SaveIO.inspect(json);

    openModal(`<div class="shead">确认导入<span class="x" data-a="close">关闭</span></div>
      <div class="card small"><div class="muted">现在这台设备上</div><div>${ci && !ci.err ? esc(ci.sum) : '没有' + (r.kind === 'conquest' ? '霸业' : '闯关') + '存档'}</div></div>
      <div class="card small"><div class="muted">导入以后</div><div><b>${esc(r.sum)}</b></div></div>
      ${ci && !ci.err ? '<div class="tiny muted">现在这份会留作备份，存档菜单里能换回来。</div>' : ''}

  },
  'import-yes': () => {

    const cur = store.get(key);

    if (!b) { toast('没有备份'); return; }
    const cur = store.get(key);
    ask('换回备份', `把「${SG.SaveIO.inspect(b.s).sum}」换回来；现在这份「${cur ? SG.SaveIO.inspect(cur).sum : '空'}」留作备份，还能再换过去。`, '换', () => {
      if (cur) store.set(key + '_bak', JSON.stringify({ t: Date.now(), s: cur }));
      store.set(key, b.s); G = null; V.mode = 'title'; closeModal(); render();
      if (el.dataset.k === 'cq') SG.Conq && SG.Conq.cont(); else ACT['camp-continue']();
      toast('换回来了');
    });
  },
  'camp-continue': () => { V.cq = null; G = load(); if (!G) { toast('存档坏了'); return; } V.mode = 'camp'; go('main'); },

      V.cq = null; G = SG.Game.fresh(); save(); V.mode = 'camp'; V.view = 'main'; render();

      openModal(`<div class="shead">开局</div><div class="story">中平元年，涿县街上贴出招兵榜文。榜下站着两个人。</div>
        <div class="pulls" style="grid-template-columns:repeat(2,1fr);max-width:260px;margin:0 auto">${g.map(n => `<div class="pull">${por(n)}<div class="nm c-${D.H[n]['品阶']}">${esc(n)}</div><div class="muted">${D.H[n]['品阶']}·${esc(D.H[n]['定位'])}</div></div>`).join('')}</div>
        <div class="small muted" style="margin-top:8px">手里 1000 金。先去招贤凑几个人，再打第一关。</div><div class="btns"><div class="btn main" data-a="close">走</div></div>`);
    };
    if (store.get(SG.SAVE_KEY)) ask('新开闯关', '现有的闯关进度会被覆盖。', '新开', start); else showCrawl('intro', start);
  },
  'conq-continue': () => SG.Conq && SG.Conq.cont(),
  'conq-new': () => SG.Conq && SG.Conq.pickFaction(),
  chap: el => { const c = +el.dataset.c; const C = D.CHAPTERS[c]; const cur = V.open[c] != null ? V.open[c] : (c === G.curChapter()); if (!C.stages.some(s => G.stageUnlocked(s.id))) { toast('还没打到这一章'); return; } V.open[c] = !cur; render(); },
  locked: el => { const s = D.STAGE[el.dataset.id]; toast(s['类型'] === '隐藏' ? '本章其余关卡全通才开' : (+s['章'] >= 27 ? '终章打完才开' : '先打前面的')); },

  },
  sweep: el => {
    const id = el.dataset.id, st = D.STAGE[id];
    const lim = SG.stageLimit(st);
    const F = G.s.formation.slice(); if (F.filter(Boolean).length > lim.max) { toast(`这关只能带 ${lim.max} 人，先去布阵`); return; }
    const r = G.fight(id, F, { quick: true, sweep: true });
    if (r.err) { toast(r.err); return; }
    glog(`速战 ${st['关']}：${r.res.win ? `胜，金 +${r.rew.gold}${r.rew.items.length ? '，得 ' + r.rew.items.map(it => D.EQID[it.id]['名']).join('、') : ''}` : '败'}`);
    save(); render(); sweepSheet(st, r);
  },
  'copy-wx': () => { try { navigator.clipboard.writeText('lynchrrr'); toast('微信号复制了'); } catch (e) { toast('微信号：lynchrrr'); } },
  'ach-claim': (el) => { const r = G.achClaim(el.dataset.id); if (r) { toast(`领了「${r.a.name}」：${SG.rewardText(r.a.tier)}${r.a.title ? `，得称号「${r.a.title}」` : ''}`); glog(`功名「${r.a.name}」`); save(); render(); } },
  'ach-all': () => { const R = G.achClaimAll(); if (R.length) { const sum = { gold: 0, gold2: 0, tokens: 0 }; R.forEach(x => { for (const k in x.r) sum[k] += x.r[k]; }); toast(`领了 ${R.length} 条：金 ${sum.gold}、黄金 ${sum.gold2}、兵符 ${sum.tokens}`); glog(`领功名 ${R.length} 条`); save(); render(); } },
  'title-set': (el) => { G.s.title = el.dataset.t || ''; save(); render(); toast(G.s.title ? `挂上「${G.s.title}」` : '不挂称号'); },
  'tx-reroll': (el) => {
    const i = +el.dataset.i, old = G.s.tx.on[i];
    ask('换天象', `花 ${SG.CFG.tx_reroll} 枚兵符把「${old}」换成一颗没见过的，这颗换过就不能再换。`, '换', () => {
      const r = G.rerollTx(i); if (r.err) { toast(r.err); return; }
      glog(`天象「${old}」换成「${r.id}」`); save(); render(); toast(`换成了「${r.id}」`);

  },
  'star-all': () => {
    const before = {}; for (const n in G.s.heroes) before[n] = G.s.heroes[n].star;

    const L = Object.keys(before).filter(n => G.s.heroes[n].star > before[n]).sort((a, b) => G.s.heroes[b].star - G.s.heroes[a].star);
    glog(`一键升星：${L.map(n => `${n} ${before[n]}→${G.s.heroes[n].star}星`).join('、')}`); save(); render();
    openModal(`<div class="shead">一键升星<span class="x" data-a="close">关闭</span></div><div class="small muted">只花本人碎片，兵符一枚没动。</div>
      ${L.map(n => `<div class="item"><span>${por(n, 's')}</span><div class="grow"><div class="en">${esc(n)}</div><div class="ed"><span class="stars">${stars(before[n])}</span> → <span class="stars">${stars(G.s.heroes[n].star)}</span>　剩碎片 ${G.s.heroes[n].frag}</div></div></div>`).join('')}

  },
  'auto-equip': () => { G.autoEquip(G.s.formation); save(); render(); toast('按战力从高到低配好了'); },
  'strip-team': () => { G.stripTeam(G.s.formation); save(); render(); toast('阵上的人装备都卸了'); },
  'train-max': () => { const n = G.trainMax(V.hero); if (!n) toast(G.hero(V.hero).lv >= G.maxLv() ? '已到上限' : '钱不够'); else toast(`练了 ${n} 级`); save(); render(); },
  'refight': () => { const id = V.battle && V.battle.out.stageId; if (!id) return; const r = G.fight(id, G.s.formation); if (r.err) { toast(r.err); return; } quietAch(r.ach); save(); Play.begin({ res: r.res, rew: r.rew, ach: r.ach, stageId: id }); },
  'to-form': el => {
    const id = el.dataset.id, st = D.STAGE[id];
    if (G.isCleared(id) && G.replayLeft(id) <= 0) { toast('这关今天刷满了'); return; }

    const lim = SG.stageLimit(st);
    if (G.s.formation.filter(Boolean).length > lim.max || !G.s.formation.some(Boolean)) autoForm(lim.max);

  },
  'cx-tog': el => { V.cx = V.cx || {}; V.cx[el.dataset.k] = !V.cx[el.dataset.k]; render(); },
  hero: el => { V.hero = el.dataset.n; V.heroFrom = el.dataset.from || null; V.view = 'hero'; render(); window.scrollTo(0, 0); },
  filt: el => { V.filt[el.dataset.k] = el.dataset.v; render(); repick(); },
  sort: el => { V.sort = el.dataset.v; render(); repick(); },
  train: el => { const k = +el.dataset.k; const n = G.train(V.hero, k); if (!n) toast(G.hero(V.hero).lv >= G.maxLv() ? '已到上限' : '钱不够'); save(); render(); },
  star: () => { if (G.starUp(V.hero)) { toast(`${V.hero} 升到 ${G.hero(V.hero).star} 星`); save(); render(); } else toast('碎片加兵符不够'); },
  recruit: () => { if (G.recruit(V.hero)) { save(); render(); } else toast('钱不够或兵是满的'); },
  'recruit-all': () => {
    const L = G.s.formation.filter(Boolean); let ok = 0;
    for (const n of L) if (G.recruitCost(n) > 0 && G.recruit(n)) ok++;

  },
  slot: el => slotPicker(V.hero, el.dataset.sl),
  equip: el => { G.equip(V.hero, +el.dataset.uid); save(); closeModal(); render(); },
  unequip: el => { G.unequip(V.hero, el.dataset.sl); save(); closeModal(); render(); },
  cell: el => {
    if (Date.now() - DRAG.end < 400) return;
    pickSheet(+el.dataset.i);
  },
  'pick-to': el => {
    const i = V.pickAt, n = el.dataset.n, F = G.s.formation;
    if (i == null) return;
    const lim = !V.cq && V.stage ? SG.stageLimit(D.STAGE[V.stage]).max : 9;
    if (!F[i] && F.filter(Boolean).length >= lim) { toast(`这关只能带 ${lim} 人`); return; }
    const at = F.indexOf(n); if (at >= 0) F[at] = null;
    F[i] = n; save(); closeModal(); render();
  },
  'form-hero': el => {
    if (Date.now() - DRAG.end < 400) return;
    V.hero = el.dataset.n; V.heroFrom = 'form'; V.sel = null; V.view = 'hero'; render(); window.scrollTo(0, 0);
  },
  'form-off': () => {
    const F = G.s.formation, at = F.indexOf(V.hero);
    if (at >= 0) F[at] = null;
    save(); toast(`${V.hero} 下阵了`); go('form');
  },
  pick: el => {
    const n = el.dataset.n, F = G.s.formation;
    const lim = !V.cq && V.stage ? SG.stageLimit(D.STAGE[V.stage]).max : 9;
    const at = F.indexOf(n);
    if (at >= 0) { F[at] = null; if (V.sel === at) V.sel = null; save(); render(); return; }
    let i = V.sel != null ? V.sel : F.findIndex(x => !x);
    if (i < 0) { toast('九格满了'); return; }
    if (!F[i] && F.filter(Boolean).length >= lim) { toast(`这关只能带 ${lim} 人`); return; }
    F[i] = n; V.sel = null; save(); render();
  },
  'form-auto': () => { autoForm(!V.cq && V.stage ? SG.stageLimit(D.STAGE[V.stage]).max : 9); save(); render(); },
  'form-clear': () => { G.s.formation = [null, null, null, null, null, null, null, null, null]; V.sel = null; save(); render(); },
  fight: () => {
    const id = V.stage;
    const r = G.fight(id, G.s.formation);
    if (r.err) { toast(r.err); return; }
    glog(`${D.STAGE[id]['关']}：${r.res.win ? `胜${r.rew.first ? '（首通）' : ''}，金 +${r.rew.gold}` : '败'}`);

  },

// 布阵拖动换位：鼠标按下拖动即可；手机按住 0.25 秒再拖，没按住就当滚动
const DRAG = { end: 0 };
(function () {
  let d = null;
  const cellAt = (x, y) => { const e = document.elementFromPoint(x, y); return e && e.closest('.grid9 .gcell'); };
  const start = () => {
    const r = d.el.getBoundingClientRect();
    d.ghost = d.el.cloneNode(true); d.ghost.classList.add('ghost');
    Object.assign(d.ghost.style, { width: r.width + 'px', height: r.height + 'px', left: r.left + 'px', top: r.top + 'px' });
    d.dx = d.x0 - r.left; d.dy = d.y0 - r.top;
    document.body.appendChild(d.ghost); d.el.classList.add('dragsrc'); d.on = true;
    if (navigator.vibrate && d.touch) try { navigator.vibrate(15); } catch (e) {}
  };
  const stop = () => { if (!d) return; clearTimeout(d.t); if (d.ghost) d.ghost.remove(); d.el.classList.remove('dragsrc'); document.querySelectorAll('.gcell.drop').forEach(x => x.classList.remove('drop')); d = null; };
  document.addEventListener('pointerdown', e => {
    const el = e.target.closest('.grid9 .gcell.fill'); if (!el || e.button > 0) return;
    d = { el, x0: e.clientX, y0: e.clientY, touch: e.pointerType !== 'mouse', on: false };
    if (d.touch) d.t = setTimeout(() => { if (d && !d.moved) start(); }, 250);
  });
  document.addEventListener('pointermove', e => {
    if (!d) return;
    const far = Math.hypot(e.clientX - d.x0, e.clientY - d.y0) > 6;
    if (!d.on) { if (far) { if (d.touch) { stop(); return; } start(); } else return; }
    d.ghost.style.left = (e.clientX - d.dx) + 'px'; d.ghost.style.top = (e.clientY - d.dy) + 'px';
    const c = cellAt(e.clientX, e.clientY);
    document.querySelectorAll('.gcell.drop').forEach(x => { if (x !== c) x.classList.remove('drop'); });
    if (c && c !== d.el) c.classList.add('drop');
  });
  document.addEventListener('touchmove', e => { if (d && d.on) e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', e => { if (d) e.preventDefault(); });
  const up = e => {
    if (!d) return;
    if (d.on) {
      DRAG.end = Date.now();
      const c = cellAt(e.clientX, e.clientY), i = +d.el.dataset.i;
      stop();
      if (c && c.dataset.i != null && +c.dataset.i !== i) {
        const F = G.s.formation, j = +c.dataset.i, t = F[j]; F[j] = F[i]; F[i] = t; V.sel = null; save(); render();
      }
    } else stop();
  };
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', () => { if (d && d.on) DRAG.end = Date.now(); stop(); });
})();

  if (c.owner === me) {

    body = `<div class="small">每回合进账 ${inc} 金。守将统率每 10 点，守城兵力 +5%${n === SG.CQ_CAPITAL[me] ? '；都城再 ×1.5，被打时自己挑人守' : ''}。</div>
      <div class="sec"><h2>守将</h2><span class="line"></span></div>
      ${gd ? `<div class="row">${`<div style="width:60px">${por(gd)}</div>`}<div class="grow"><b class="kai">${esc(gd)}</b> ${TSEAL(D.H[gd]['品阶'])}<div class="small muted">${g.hero(gd).lv} 级　统率 ${Math.round(g.cqStat4(gd)['统率'])}</div></div></div>` : '<div class="small" style="color:var(--zhu)">没有守将。被打就直接丢。</div>'}
      <div class="sec"><h2>换守将</h2><span class="line"></span><span class="tp">守将不出征</span></div>
      <div class="hgrid">${(gd ? ['__none'] : []).concat(w.free_heroes()).map(x => x === '__none' ? `<div class="hc" data-a="cq-guard" data-c="${n}" data-n=""><div class="por"><span class="ph">撤下</span></div><div class="nm">不留人</div></div>` : SG.heroCard(x, 'cq-guard').replace('data-a="cq-guard"', `data-a="cq-guard" data-c="${n}"`)).join('')}</div>`;
  } else {
    const adj = w.targets().includes(n);
    body = `<div class="small">${c.owner === '无' ? '无主' : c.owner}　${c.tier === '都' ? '都城' : c.tier === '大' ? '大城' : '郡'}${st.capital[c.owner] === n ? '（都城）' : ''}　打下来每回合 ${inc} 金</div>
      <div class="sec"><h2>守军</h2><span class="line"></span></div>${garrisonHtml(n)}
      <div class="btns">${adj ? `<div class="btn main${g.s.acted ? ' off' : ''}" data-a="cq-attack" data-c="${n}">${g.s.acted ? '这回合出过兵了' : '出征'}</div>` : '<div class="btn off">不接壤</div>'}</div>`;
  }
  openModal(`<div class="shead">${n}<span class="x" data-a="close">关闭</span></div>${body}`);
}
ACT['cq-city'] = el => { V.cqSel = el.dataset.c; citySheet(el.dataset.c); };
ACT['cq-guard'] = el => {
  const w = W(), c = w.st.city[el.dataset.c], n = el.dataset.n || null;
  if (n) for (const x of w.cities(w.st.me)) if (w.st.city[x].guard === n) w.st.city[x].guard = null;
  c.guard = n; G().s.formation = G().s.formation.map(x => x === n ? null : x);
  saveCq(); closeModal(); SG.render(); toast(n ? `${n} 守${el.dataset.c}` : '撤下了');
};
ACT['cq-reguard'] = () => ask('重排守将', '所有城的守将重新分：最弱的人守城，强的留着出征。人不够的城就空着。', '重排', () => { W().reassign_guards(); const g = G(); const gs = g.guards(); g.s.formation = g.s.formation.map(x => x && !gs[x] ? x : null); saveCq(); SG.render(); });

// ---------------- 出征 / 守城布阵 ----------------
ACT['cq-attack'] = el => {
  const g = G(), n = el.dataset.c;
  V.cq = { kind: 'attack', city: n };
  const pool = new Set(Conq.pool());
  g.s.formation = g.s.formation.map(x => x && pool.has(x) ? x : null);
  if (!g.s.formation.some(Boolean)) SG.autoForm(9);
  closeModal(); SG.go('form');
};
Conq.formHead = () => {
  const w = W();
  if (V.cq.kind === 'attack') return `<div class="card small"><b class="kai">出征 ${esc(V.cq.city)}</b>　${garrisonHtml(V.cq.city)}${Conq.pool().length ? '' : '<div style="color:var(--zhu)">能出征的人一个也没有：手下的人全在守城。去招贤添人，或者回地图点开自己的城，把守将撤下来。</div>'}</div>`;
  const p = V.cq.plan;
  return `<div class="card small" style="border-color:var(--zhu)"><b class="kai" style="color:var(--zhu)">守 ${esc(p.best)}</b>　${p.f} 从${esc(p.a)}打过来。守将和没出征的人都能上。${garrisonHtml(p.a)}</div>`;
};
Conq.formButtons = cnt => V.cq.kind === 'attack'
  ? `<div class="btns"><div class="btn" data-a="cq-cancel">回地图</div><div class="btn main${cnt ? '' : ' off'}" data-a="cq-go">出征</div></div>`
  : `<div class="btns">${V.cq.plan.best === W().st.capital[W().st.me] ? '' : '<div class="btn" data-a="cq-def-auto">自动守</div>'}<div class="btn main${cnt ? '' : ' off'}" data-a="cq-def-go">守城</div></div>`;
ACT['cq-cancel'] = () => { V.cq = null; SG.go('map'); };
// V0.7：这一仗谁升了级
function xpUp(w) { const L = (w.lastExp || []).filter(x => x.up); w.lastExp = null; return L.length ? `<br>${L.map(x => `${esc(x.n)}升到 ${x.lv} 级`).join('，')}。` : ''; }
function picks() { const g = G(), pool = new Set(Conq.pool()); return g.s.formation.map((n, i) => [n, i]).filter(([n]) => n && pool.has(n)); }
ACT['cq-go'] = () => {
  const g = G(), w = W(), n = V.cq.city;
  const P = picks(); if (!P.length) { toast('阵上没人'); return; }
  if (P.some(([x]) => g.hero(x).hp < 1)) { toast('有人没兵了，先征兵'); return; }
  const A = w.my_units(P.map(p => p[0])), B = w.foe_units(n);
  SG.setBattleSeed(Math.floor(Math.random() * 2 ** 31));
  const b = new SG.Battle(A, B, true); A.forEach((u, i) => u.idx = P[i][1]);
  const [r] = b.run();
  const res = w.afterAttack(n, A, B, r);
  g.s.acted = true;
  let note;
  if (res.won) {
    note = `${esc(n)} 归你了。${res.caught.length ? `俘虏 ${res.caught.map(esc).join('、')}，去俘虏营花钱招降。` : ''}${res.fell === 'dead' ? `${res.old}只剩这几座城，就此灭了。` : res.fell === 'moved' ? `${res.old}迁都${esc(res.cap)}。` : ''}`;
    g.s.news.push(`第 ${w.st.turn} 回合：攻下${n}。`);
  } else { note = `没打下来。${esc(n)} 守军兵力还剩 ${Math.round(w.st.city[n].hp * 100)}%，过几回合会回满。`; g.s.news.push(`第 ${w.st.turn} 回合：攻${n}没下。`); }
  note += xpUp(w);
  V.cq = null; saveCq();
  SG.Play.begin({ res: { win: res.won, battles: [b] }, rew: {}, title: `出征 ${n}`, note, back: 'map', backAct: 'cq-after' });
};
ACT['cq-after'] = () => { if (!Conq.checkEnd()) SG.go('map'); };

// ---------------- 过回合：三家 AI ----------------
ACT['cq-end'] = () => {
  const g = G(), w = W();
  g.s.queue = SG.CQ_FACTIONS.filter(f => f !== w.st.me);
  g.s.turnNews = [];
  Conq.step();
};
Conq.step = () => {
  const g = G(), w = W();
  while (g.s.queue && g.s.queue.length) {
    const f = g.s.queue.shift();
    const plan = w.aiPlan(f);
    if (!plan) continue;
    if (plan.kind === 'ai') {
      const who = x => x === '无' ? '无主的' : x;
      g.s.turnNews.push(plan.won ? `${f}从${plan.a}打下${who(plan.old)}${plan.best}。` : `${f}攻${who(plan.old)}${plan.best}，没下。`);
      continue;
    }
    // 打到你了
    const c = w.st.city[plan.best];
    const names = w.defenders(plan.best);
    if (!names.length) {
      w.afterDefense(plan, [], [], 1);
      g.s.turnNews.push(`${f}从${plan.a}打下你的${plan.best}，城里没人。`);
      continue;
    }
    g.s.pending = plan; saveCq();
    const capital = plan.best === w.st.capital[w.st.me];
    openModal(`<div class="shead" style="color:var(--zhu)">${f}来打${plan.best}</div>
      <div class="small">${f}从${esc(plan.a)}出兵。${c.guard ? `守将 ${esc(c.guard)}。` : '这城没有守将。'}${capital ? '都城被打，得自己挑人守。' : ''}</div>${garrisonHtml(plan.a)}
      <div class="btns">${capital ? '' : '<div class="btn" data-a="cq-def-auto">自动守</div>'}<div class="btn main" data-a="cq-def-pick">自己挑人</div></div>`);
    return;
  }
  Conq.finishTurn();
};
ACT['cq-def-pick'] = () => {
  const g = G(), w = W(), plan = g.s.pending;
  V.cq = { kind: 'defend', plan };
  const auto = w.defenders(plan.best);
  const F = [null, null, null, null, null, null, null, null, null];
  const order = [1, 0, 2, 4, 3, 5, 7, 6, 8];
  auto.slice(0, 9).forEach((n, i) => F[order[i]] = n);
  g.s.formation = F;
  closeModal(); SG.go('form');
};
function defend(names, cells) {
  const g = G(), w = W(), plan = g.s.pending;
  const { A, B } = w.defenseUnits(plan, names);
  SG.setBattleSeed(Math.floor(Math.random() * 2 ** 31));
  const b = new SG.Battle(A, B, true);
  if (cells) A.forEach((u, i) => u.idx = cells[i]);
  const [r] = b.run();
  const out = w.afterDefense(plan, A, B, r);
  g.s.pending = null; V.cq = null;
  let note;
  if (out.won) { note = `${esc(plan.best)} 丢了。${out.lostGuard ? `守将 ${esc(out.lostGuard)} 被俘。` : ''}`; g.s.turnNews.push(`${plan.f}打下你的${plan.best}。`); }
  else { note = `守住了。${out.caught.length ? `${out.caught.map(esc).join('、')} 战死被擒，进了俘虏营。` : ''}`; g.s.turnNews.push(`${plan.f}攻${plan.best}，被你守住。`); }
  note += xpUp(w);
  saveCq();
  SG.Play.begin({ res: { win: !out.won, battles: [b] }, rew: {}, title: `守 ${plan.best}`, note, winTxt: out.won ? '城破' : '守住', back: 'map', backAct: 'cq-resume', backTxt: '接着过回合' });
}
ACT['cq-def-auto'] = () => { closeModal(); defend(null, null); };
ACT['cq-def-go'] = () => {
  const P = picks(); if (!P.length) { toast('阵上没人'); return; }
  defend(P.map(p => p[0]), P.map(p => p[1]));
};
ACT['cq-resume'] = () => { SG.go('map'); Conq.step(); };
Conq.checkEnd = () => {
  const w = W(), s = w.status();
  if (!s) return false;
  const g = G();
  if (s === 'win') {
    store.set('sgqyl_title', '一统天下');
    { const r = SG.cqAch.get(); r.win = r.win || {}; r.win[w.st.me] = 1; if (w.st.turn <= 40) r.fast = 1; SG.cqAch.set(r); }
    openModal(`<div class="shead">天下归一</div><div class="story">第 ${w.st.turn} 回合，${w.st.me}据有四海。</div><div class="small muted">功名簿里记下了「一统天下」，回闯关去领。</div><div class="btns"><div class="btn main" data-a="to-title">回标题</div></div>`);
  } else {
    openModal(`<div class="shead">败亡</div><div class="story">都城丢了，手里不到四座城。第 ${w.st.turn} 回合，${w.st.me}散了。</div><div class="btns"><div class="btn" data-a="close">看看地图</div><div class="btn main" data-a="to-title">回标题</div></div>`);
  }
  g.s.over = s; saveCq();
  return true;
};
Conq.finishTurn = () => {
  const g = G(), w = W();
  g.s.queue = null;
  if (Conq.checkEnd()) { SG.render(); return; }
  const inc = w.startTurn();
  g.s.acted = false;
  g.s.news.push(...g.s.turnNews.map(x => `第 ${w.st.turn - 1} 回合：${x}`));
  g.s.news.push(`第 ${w.st.turn} 回合，进账 ${inc} 金，全军回两成兵。`);
  g.s.news = g.s.news.slice(-40);
  saveCq(); SG.go('map');
  if (g.s.turnNews.length) openModal(`<div class="shead">第 ${w.st.turn - 1} 回合各家动静<span class="x" data-a="close">关闭</span></div><div class="small">${g.s.turnNews.map(esc).join('<br>')}</div><div class="small muted" style="margin-top:6px">进账 ${inc} 金。</div><div class="btns"><div class="btn main" data-a="close">知道了</div></div>`);
  g.s.turnNews = [];
};

// ---------------- 俘虏营 ----------------
VIEWS.prison = () => {
  const g = G(), w = W();
  const L = w.st.prisoners.slice().sort((a, b) => w.ransom(b[0]) - w.ransom(a[0]));
  return `<div class="sec"><h2>俘虏营</h2><span class="line"></span><span class="tp">${L.length} 人</span></div>
    <div class="small muted">谁都能降，给钱就来；放多久都不会跑。校 300、骁 800、名 2000、虎 5000、无双 12000。</div>
    <div class="card" style="padding:4px 10px;margin-top:8px">${L.map(([n, f, t]) => `<div class="item"><div style="width:44px;flex:none">${por(n, 's')}</div><div class="grow"><div class="en">${TSEAL(D.H[n]['品阶'])} ${esc(n)} ${facTag(D.H[n]['阵营'])}</div><div class="ed">${esc(D.SKROW[n]['技能'])}·${esc(D.SKROW[n]['类型'])}　第 ${t} 回合擒于${f === '无' ? '无主城' : f}</div></div>
      <span class="btn sm${g.s.gold >= w.ransom(n) ? ' main' : ' off'}" data-a="cq-ransom" data-n="${esc(n)}">${num(w.ransom(n))} 金</span></div>`).join('') || '<div class="empty">空的</div>'}</div>`;
};
ACT['cq-ransom'] = el => { const n = el.dataset.n; if (W().release(n)) { if (SG.D.H[n] && SG.D.H[n]['品阶'] === '无双') { const g = G(); g.s.nx = (g.s.nx || 0) + 1; const r = SG.cqAch.get(); r.nx = Math.max(r.nx || 0, g.s.nx); SG.cqAch.set(r); } saveCq(); SG.render(); toast(`${n} 降了`); } else toast('钱不够'); };

// 回到存档时，要是停在「有人来打」那一步，接着问
const _cont = Conq.cont;
Conq.cont = () => { _cont(); const g = G(); if (g && g.s.over) Conq.checkEnd(); else if (g && g.s.pending) { g.s.queue = g.s.queue || []; g.s.queue.unshift(g.s.pending.f); g.s.pending = null; W().st.last_hit[g.s.queue[0]] = -99; W().st.last_hit.any = -1; Conq.step(); } else if (g && g.s.queue) Conq.step(); };
})();

/* ---- pwa.js ---- */
// 装到桌面：Chrome/Edge 走 beforeinstallprompt；Safari 没有安装接口，给图文指引。
// 玩进去 45 秒后问一次；点过「以后再说」或装过就不再问；存档菜单里随时能手动装。
// 更新：放到网上改版后，service worker 换代时提示「有新版本」，点了刷新。
(function () {
  const SG = window.SG;
  const KEY = 'sgqyl_pwa';
  let deferred = null, armed = false;
  const ua = navigator.userAgent;
  const standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  const isSafari = /Safari/.test(ua) && !/Chrome|Chromium|CriOS|FxiOS|Edg|OPR/.test(ua);
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isFirefox = /Firefox|FxiOS/.test(ua);
  const onWeb = location.protocol.startsWith('http');
  const st = () => { try { return localStorage.getItem(KEY); } catch (e) { return null; } };
  const setSt = v => { try { localStorage.setItem(KEY, v); } catch (e) { } };
  const guide = () => isIOS
    ? '点屏幕底部的<b>分享</b>按钮，往下找<b>「添加到主屏幕」</b>，再点右上角<b>添加</b>。'
    : '菜单栏<b>文件</b> → <b>「添加到程序坞」</b>。';
  function arm() {
    if (armed || standalone || !onWeb || isFirefox) return;
    const s = st(); if (s === 'dismissed' || s === 'installed') return;
    armed = true;
    const wait = () => {   // 等进了游戏（不在标题页）再开始计时
      if (SG.V && SG.V.mode && SG.V.mode !== 'title') setTimeout(offer, 45000);
      else setTimeout(wait, 2000);
    };
    wait();
  }
  function offer() {
    if (standalone || (!deferred && !isSafari)) return;
    if (document.querySelector('#modal.on')) { setTimeout(offer, 15000); return; }
    SG.ui.openModal(`<div class="shead">装到桌面</div>
      <div class="small">装好之后从桌面图标进，全屏，断网也能打。</div>
      ${deferred ? '' : `<div class="small" style="margin-top:6px">${guide()}</div>`}
      <div class="btns"><div class="btn" data-a="pwa-later">以后再说</div>${deferred ? '<div class="btn main" data-a="pwa-install">装</div>' : '<div class="btn main" data-a="pwa-later">知道了</div>'}</div>`);
  }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; arm(); });
  window.addEventListener('appinstalled', () => setSt('installed'));
  if (isSafari) window.addEventListener('load', arm);
  // 新版本提示
  if (onWeb && 'serviceWorker' in navigator) {
    const had = !!navigator.serviceWorker.controller; let shown = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!had || shown) return; shown = true;
      SG.ui.openModal(`<div class="shead">有新版本</div><div class="small">刷新一下就是新版，存档不受影响。</div>
        <div class="btns"><div class="btn" data-a="close">等会儿</div><div class="btn main" data-a="pwa-reload">刷　新</div></div>`);
    });
  }
  SG.pwa = {
    can: () => !standalone && onWeb && (!!deferred || isSafari),
    install: async () => {
      if (deferred) {
        deferred.prompt();
        try { const r = await deferred.userChoice; setSt(r.outcome === 'accepted' ? 'installed' : 'dismissed'); } catch (e) { }
        deferred = null; return;
      }
      SG.ui.openModal(`<div class="shead">装到桌面<span class="x" data-a="close">关闭</span></div><div class="small">${guide()}装好之后从图标进，断网也能打。</div>`);
    },
    later: () => { setSt('dismissed'); SG.ui.closeModal(); },
    reload: () => location.reload(),
  };
})();

</script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
