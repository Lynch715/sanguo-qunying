<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>三国群英录 V0.7</title>
<meta name="theme-color" content="#f4efe4">
<link rel="manifest" href="site.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-180.png">
<meta name="apple-mobile-web-app-title" content="三国群英录">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="三国群英录：三百五十八位三国人物，九宫对阵，闯关与霸业。作者 Lynch。">
<style>
/* 三国群英录 · 工笔重彩，浅底亮色 */
:root{
  --paper:#f6f1e6; --paper-2:#efe8d9; --paper-3:#e5dcc8; --card:#fbf8f1;
  --ink:#2b2520; --ink-2:#5a5046; --ink-3:#8d8275; --ink-4:#bdb3a3;
  --zhu:#c0402a;      /* 朱砂 */
  --qing:#2c5f8d;     /* 石青 */
  --lv:#2e7a63;       /* 石绿 */
  --jin:#b5872c;      /* 泥金 */
  --zi:#7b4f8e;       /* 紫 */
  --t-wushuang:#c0402a; --t-hu:#b5872c; --t-ming:#7b4f8e; --t-xiao:#2c5f8d; --t-jiao:#2e7a63; --t-zu:#8d8275;
  --e0:#8d8275; --e1:#2e7a63; --e2:#2c5f8d; --e3:#7b4f8e; --e4:#c9762a; --e5:#c0402a;
  --f-title:"Kaiti SC","STKaiti","KaiTi","楷体","Noto Serif CJK SC",serif;
  --f-body:"Songti SC","STSong","SimSun","宋体","Noto Serif CJK SC",serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;touch-action:pan-x pan-y}
body{font-family:var(--f-body);color:var(--ink);background:var(--paper);line-height:1.65;
  min-height:100vh;min-height:100dvh;overscroll-behavior-y:contain;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse at 50% -10%,#fffaf0 0,rgba(255,250,240,0) 60%)}
button{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;position:relative;
  padding:env(safe-area-inset-top) calc(14px + env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
.app.wide{max-width:980px}
h1,h2,h3,.kai{font-family:var(--f-title);font-weight:400}

/* 顶栏 */
.res{display:flex;align-items:center;gap:6px;padding:10px 0 8px;font-size:.86em;border-bottom:1px solid var(--ink-4);margin-bottom:10px;flex-wrap:wrap}
.res .it{display:flex;align-items:baseline;gap:4px;margin-right:8px}
.res .it i{font-style:normal;color:var(--ink-3);font-size:.9em}
.res .it b{font-family:var(--f-title);font-weight:400;font-size:1.12em}
.res .sp{flex:1}
.res .ic{border:1px solid var(--ink-4);background:var(--card);padding:2px 9px;border-radius:3px;cursor:pointer;font-size:.9em;color:var(--ink-2)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(251,248,241,.96);border-top:1px solid var(--ink-4);
  display:flex;justify-content:center;padding:0 0 env(safe-area-inset-bottom);backdrop-filter:blur(6px)}
.nav .inner{display:grid;grid-template-columns:repeat(6,1fr);width:100%;max-width:480px}
.nav .tab{text-align:center;padding:9px 0 10px;font-family:var(--f-title);font-size:.95em;color:var(--ink-2);cursor:pointer;border-top:2px solid transparent}
.nav .tab.on{color:var(--zhu);border-top-color:var(--zhu)}

/* 通用 */
.sec{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
.sec h2{font-size:1.08em;letter-spacing:.1em;white-space:nowrap}
.sec .line{flex:1;height:1px;background:linear-gradient(90deg,var(--ink-4),transparent)}
.sec .tp{font-size:.82em;color:var(--ink-3);white-space:nowrap}
.card{background:var(--card);border:1px solid var(--paper-3);border-radius:6px;padding:12px;margin-bottom:10px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.muted{color:var(--ink-3)} .small{font-size:.84em} .tiny{font-size:.74em}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;flex-direction:column;line-height:1.25;align-items:center;justify-content:center;gap:1px;min-height:40px;padding:6px 14px;border:1px solid var(--ink-3);border-radius:4px;
  background:var(--card);cursor:pointer;font-family:var(--f-title);font-size:1em;letter-spacing:.06em;color:var(--ink);user-select:none}
.btn.main{background:var(--zhu);border-color:var(--zhu);color:#fff8ef}
.btn.qing{background:var(--qing);border-color:var(--qing);color:#f5f8fb}
.btn.off{color:var(--ink-4);border-color:var(--ink-4);background:var(--paper-2);cursor:default}
.btn.main.off{background:#d9b3aa;border-color:#d9b3aa;color:#fff}
.btn.sm{min-height:32px;padding:3px 10px;font-size:.88em}
.btns{display:flex;gap:8px;margin-top:12px}
.btns>*{flex:1 1 0;min-width:0}
.empty{text-align:center;color:var(--ink-3);padding:24px 0;font-size:.9em}
.seal{display:inline-block;font-family:var(--f-title);font-size:.76em;line-height:1;padding:3px 4px 2px;border-radius:2px;color:#fff;vertical-align:1px;white-space:nowrap}
.t-无双{background:var(--t-wushuang)} .t-虎{background:var(--t-hu)} .t-名{background:var(--t-ming)} .t-骁{background:var(--t-xiao)} .t-校{background:var(--t-jiao)} .t-卒{background:var(--t-zu)}
.c-无双{color:var(--t-wushuang)} .c-虎{color:var(--t-hu)} .c-名{color:var(--t-ming)} .c-骁{color:var(--t-xiao)} .c-校{color:var(--t-jiao)} .c-卒{color:var(--t-zu)}
.e0{color:var(--e0)} .e1{color:var(--e1)} .e2{color:var(--e2)} .e3{color:var(--e3)} .e4{color:var(--e4)} .e5{color:var(--e5)}
.eb0{background:var(--e0)} .eb1{background:var(--e1)} .eb2{background:var(--e2)} .eb3{background:var(--e3)} .eb4{background:var(--e4)} .eb5{background:var(--e5)}
.fac{display:inline-block;font-size:.76em;border:1px solid currentColor;border-radius:2px;padding:0 3px;line-height:1.35}
.f-魏{color:#2c5f8d} .f-蜀{color:#2e7a63} .f-吴{color:#c0402a} .f-汉{color:#b5872c} .f-无{color:#8d8275}
.stars{color:var(--jin);letter-spacing:-1px;font-size:.86em}
.bar{height:5px;background:var(--paper-3);border-radius:3px;overflow:hidden;position:relative}
.bar em{position:absolute;left:0;top:0;bottom:0;background:var(--lv);border-radius:3px;transition:width .25s}
.bar em.low{background:var(--zhu)}
.bar b{position:absolute;left:0;top:0;bottom:0;background:rgba(44,95,141,.55)}

/* 立绘 */
.por{position:relative;aspect-ratio:3/4;background:linear-gradient(160deg,#efe6d4,#e3d8c2);border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.por img{width:100%;height:100%;object-fit:contain;display:block}
.por .ph{font-family:var(--f-title);color:var(--ink-3);writing-mode:vertical-rl;letter-spacing:.2em;font-size:1.05em}
.por.mob{background:linear-gradient(160deg,#ece8df,#ddd6c8)}

/* 章节 */
.chap{margin-bottom:8px}
.chap .hd{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border:1px solid var(--paper-3);border-radius:6px;cursor:pointer}
.chap .hd .no{font-family:var(--f-title);color:var(--zhu);min-width:2.6em}
.chap .hd .nm{font-family:var(--f-title);font-size:1.06em;flex:1}
.chap .hd .pg{font-size:.8em;color:var(--ink-3)}
.chap.lock .hd{opacity:.5}
.chap .body{padding:6px 0 4px 10px}
.chap .intro{font-size:.86em;color:var(--ink-2);margin:4px 2px 8px;line-height:1.7}
.stg{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px dashed var(--paper-3);cursor:pointer}
.stg:last-child{border-bottom:none}
.stg .ty{font-size:.72em;padding:1px 5px;border-radius:2px;color:#fff;font-family:var(--f-title);white-space:nowrap}
.ty-主线{background:var(--ink-2)} .ty-章末{background:var(--zhu)} .ty-支线{background:var(--qing)} .ty-隐藏{background:var(--zi)}
.stg .nm{flex:1;font-family:var(--f-title);font-size:1.02em}
.stg .lv{font-size:.8em;color:var(--ink-3);white-space:nowrap}
.stg .ok{color:var(--lv);font-size:.85em}
.stg.lock{opacity:.42;cursor:default}
.lim{display:inline-block;font-size:.72em;color:var(--zhu);border:1px solid var(--zhu);border-radius:2px;padding:0 3px;margin-left:4px;vertical-align:2px}

/* 弹层 */
#modal{position:fixed;inset:0;z-index:50;display:none;background:rgba(43,37,32,.42);align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{background:var(--paper);width:100%;max-width:480px;max-height:88vh;max-height:88dvh;overflow:auto;border-radius:12px 12px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(0,0,0,.15)}
@media(min-width:700px){#modal{align-items:center}.sheet{border-radius:10px;max-width:520px}}
.shead{font-family:var(--f-title);font-size:1.2em;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.shead .x{margin-left:auto;cursor:pointer;color:var(--ink-3);font-size:.9em;padding:4px 8px}
.story{font-size:.95em;line-height:1.85;color:var(--ink-2);border-left:3px solid var(--jin);padding:2px 0 2px 10px;margin:6px 0 10px}
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:80;pointer-events:none}
#toast div{background:rgba(43,37,32,.88);color:#fbf6ec;padding:8px 16px;border-radius:5px;font-size:.92em;margin-bottom:6px;animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

/* 敌方名单 */
.foes{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin:6px 0}
.foe{text-align:center;font-size:.76em}
.foe .por{margin-bottom:2px}
.foe .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 将领列表 */
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.chip{font-size:.82em;border:1px solid var(--ink-4);border-radius:12px;padding:2px 10px;cursor:pointer;background:var(--card);color:var(--ink-2)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.hc{background:var(--card);border:1px solid var(--paper-3);border-radius:6px;padding:4px 4px 6px;cursor:pointer;position:relative}
.hc .por{margin-bottom:4px}
.hc .nm{font-family:var(--f-title);font-size:1em;display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden}
.hc .meta{font-size:.78em;color:var(--ink-3);display:flex;justify-content:space-between}
.hc .tag{position:absolute;top:6px;left:6px;z-index:2}
.hc.sel{outline:2px solid var(--qing)}
.hc .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--zhu);z-index:2}

/* 将领详情 */
.hd-top{display:flex;gap:12px;align-items:flex-start}
.hd-top .por{width:40%;max-width:190px;flex:none}
.hd-top .info{flex:1;min-width:0}
.hd-name{font-family:var(--f-title);font-size:1.5em;line-height:1.2}
.stat4{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin:8px 0}
.stat4 div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--ink-4);font-size:.9em}
.stat4 b{font-family:var(--f-title);font-weight:400;font-size:1.05em}
.stat4 small{color:var(--ink-3);font-size:.78em;margin-left:3px}
.bio{margin:10px 0 4px;padding:2px 0 2px 10px;border-left:2px solid var(--zhu)}
.bio .bh{font-size:.95em;color:var(--zhu);margin-bottom:2px}
.bio p{font-size:.9em;line-height:1.8;color:var(--ink-2);margin:4px 0;text-indent:2em}
.skill{border:1px solid var(--paper-3);background:var(--card);border-radius:6px;padding:10px;margin:8px 0}
.skill .sn{font-family:var(--f-title);font-size:1.15em;color:var(--zhu)}
.skill .st{font-size:.76em;border:1px solid var(--ink-4);border-radius:2px;padding:0 4px;margin-left:6px;color:var(--ink-2)}
.skill p{font-size:.9em;margin-top:4px;line-height:1.7}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.slot{border:1px dashed var(--ink-4);border-radius:5px;padding:7px 8px;cursor:pointer;min-height:54px;background:var(--card)}
.slot .sl{font-size:.72em;color:var(--ink-3)}
.slot .en{font-family:var(--f-title)}
.slot.fill{border-style:solid;border-color:var(--paper-3)}
.item{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px dashed var(--paper-3)}
.item .en{font-family:var(--f-title);font-size:1.02em}
.item .ed{font-size:.78em;color:var(--ink-3)}
.gseal{display:inline-block;width:1.5em;height:1.5em;line-height:1.5em;text-align:center;color:#fff;border-radius:3px;font-family:var(--f-title);font-size:.82em;flex:none}

/* 布阵 */
.form-wrap{display:flex;gap:10px;align-items:flex-start}
.grid9{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;width:100%;margin:0 auto}
.gcell.sel{outline:2px solid var(--qing);outline-offset:1px}
.rowlab{font-size:.72em;color:var(--ink-3);text-align:center;margin:2px 0}

/* 战斗 */
.bf{--cw:clamp(48px,calc((100dvh - 330px) / 8.3),92px);display:flex;flex-direction:column;align-items:center;margin:4px auto 0}
.bgrid{display:grid;grid-template-columns:repeat(3,var(--cw));gap:4px}
.bf.side{--cw:clamp(56px,calc((100dvh - 300px) / 4.4),120px);flex-direction:row;justify-content:center;gap:18px}
.bf.side .vs{flex-direction:column}
.bcell{position:relative;background:var(--card);border:1px solid var(--paper-3);border-radius:4px;overflow:visible;height:calc(var(--cw) * 1.333 + 16px)}
.bcell.void{background:transparent;border:1px dashed var(--paper-3)}
.bcell .por{border-radius:3px 3px 0 0}
.bcell .por .ph{font-size:.8em}
.bcell .bn{font-size:.64em;line-height:1.3;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-title);padding:0 2px}
.bcell .bar{margin:0 3px;height:4px}
.bcell .sts{position:absolute;top:2px;left:2px;right:2px;display:flex;flex-wrap:wrap;gap:1px;z-index:3}
.bcell .sts span{font-size:.58em;background:rgba(43,37,32,.72);color:#fff;border-radius:2px;padding:0 2px;line-height:1.35}
.bcell .sts span.good{background:rgba(44,95,141,.8)}
.bcell.dead{opacity:.28;filter:grayscale(1)}
.bcell.act{box-shadow:0 0 0 2px var(--jin);z-index:4}
.bcell.hit{animation:shake .28s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:6}
.fnum{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-family:var(--f-title);font-size:1.05em;color:var(--zhu);text-shadow:0 0 3px #fff,0 0 3px #fff;white-space:nowrap;animation:up .9s forwards}
.fnum.heal{color:var(--lv)} .fnum.crit{font-size:1.4em} .fnum.miss{color:var(--ink-3)}
.fsk{position:absolute;left:50%;top:-6px;transform:translateX(-50%);background:var(--zhu);color:#fff;font-family:var(--f-title);font-size:.8em;padding:1px 6px;border-radius:3px;white-space:nowrap;animation:pop 1s forwards;z-index:7}
.fsk.prep{background:var(--qing)}
@keyframes up{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-26px}}
@keyframes pop{0%{opacity:0;transform:translate(-50%,4px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
.vs{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0;font-family:var(--f-title);color:var(--ink-3)}
.vs .rn{color:var(--zhu);font-size:1.2em}
.blog{max-height:150px;overflow:auto;font-size:.76em;color:var(--ink-2);background:var(--card);border:1px solid var(--paper-3);border-radius:5px;padding:6px 8px;margin-top:8px;line-height:1.6}
.blog.full{max-height:62vh;max-height:62dvh}
.blog>div{padding:1px 0}
.blog .r{font-family:var(--f-title);color:var(--ink-2);border-bottom:1px dotted var(--ink-4);margin-top:4px;padding-bottom:1px;font-size:1.08em}
.blog .sk{color:var(--zi)} .blog .dm{color:var(--zhu)} .blog .he{color:var(--lv)} .blog .sh{color:var(--qing)} .blog .st{color:var(--zi)}
.blog .in{color:var(--ink-3)} .blog .ps{color:var(--ink-3);font-style:italic}
.blog .ln-a{color:var(--qing);font-weight:600} .blog .ln-f{color:var(--zhu);font-weight:600}
.bd-side{font-family:var(--f-title);font-size:.9em;color:var(--ink-2);margin:6px 0 2px;letter-spacing:.2em}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:.78em}
.bd-col i{display:block;font-style:normal;color:var(--ink-3);border-bottom:1px solid var(--paper-3);margin-bottom:2px}
.bd-col span{display:flex;justify-content:space-between;gap:4px}
.bd-col em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-col u{text-decoration:none;color:var(--ink-2)}
.bd-col .r0 em{color:var(--zhu)} .bd-col .none{color:var(--ink-4)}
.ctrl{display:flex;gap:6px;justify-content:center;margin-top:8px}
.result{text-align:center;font-family:var(--f-title);font-size:2em;letter-spacing:.3em;margin:8px 0}
.result.win{color:var(--zhu)} .result.lose{color:var(--ink-3)}

/* 标题 */
.title-page{min-height:88vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.title-page h1{font-size:2.6em;letter-spacing:.3em;margin-left:.3em;color:var(--ink)}
.title-page .sub{color:var(--ink-3);font-size:.9em;letter-spacing:.2em}
.title-page .seal-big{width:64px;height:64px;background:var(--zhu);color:#fff;font-family:var(--f-title);font-size:2.1em;display:flex;align-items:center;justify-content:center;border-radius:6px;margin-bottom:6px}
.title-page .btn{width:220px}
.title-page .ver{font-size:.75em;color:var(--ink-4);margin-top:16px}

/* 招贤结果 */
.pulls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pull{text-align:center;font-size:.76em}
.pull .nm{font-family:var(--f-title);font-size:1.05em;white-space:nowrap;overflow:hidden}
.pull .new{color:var(--zhu)}

/* 霸业地图 */
.map{position:relative;width:100%;aspect-ratio:1/1.02;background:#f1ead9;border:1px solid var(--paper-3);border-radius:8px;overflow:hidden}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.city{position:absolute;transform:scale(calc(1 / var(--s,1))) translate(-50%,-50%);transform-origin:0 0;text-align:center;cursor:pointer;z-index:2}
.city .dot{margin:0 auto;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.city .cn{font-family:var(--f-title);font-size:.7em;white-space:nowrap;text-shadow:0 0 2px #f6f1e6,0 0 2px #f6f1e6;line-height:1.1;margin-top:1px}
.city.sel .dot{box-shadow:0 0 0 3px var(--jin)}
.city.can .cn{color:var(--zhu);font-weight:bold}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.78em;margin:6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px;vertical-align:-1px}
.cq-log{font-size:.8em;color:var(--ink-2);max-height:150px;overflow:auto}

/* ---- V0.2 借鉴水浒：大帐、图鉴、章首卡、战力对比 ---- */
.nav .inner.two{grid-template-columns:repeat(4,1fr)}
.nav .inner.two .tab{padding:6px 0 7px}
.app{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.banner{text-align:center;padding:14px 0 6px}
.banner .bt{font-family:var(--f-title);font-size:1.9em;letter-spacing:.25em}

<script>window.SGDATA={"version":"0.7","heroes":[{"名":"刘备","阵营":"蜀","定位":"辅助","品阶":"无双","武力":"58","统率":"78","智力":"90","速度":"64","武成长":"1.0","统成长":"2.1","智成长":"2.3","速成长":"1.2","特点":"仁君，统率智力双高，越打越稳","生平":"涿郡涿县人，中山靖王之后，到他这一辈，家里靠织席贩履过日子。身长七尺五寸，垂手过膝，回头能看见自己的耳朵。｜半辈子都在投人，公孙瓒、陶谦、吕布、曹操、袁绍、刘表，换了好几个主人，也丢过好几回妻儿。曹操请他喝酒，讲「今天下英雄，唯使君与操耳」，他手里的筷子掉在了地上。当阳路上十几万百姓跟着他，一天只走十几里，有人劝他丢下百姓快走，他不肯：「夫济大事必以人为本，今人归吾，吾何忍弃去！」｜章武三年，他在白帝城把诸葛亮叫到床前：「若嗣子可辅，辅之；如其不才，君可自取。」"},{"名":"关羽","阵营":"蜀","定位":"武将","品阶":"无双","武力":"98","统率":"80","智力":"48","速度":"74","武成长":"2.9","统成长":"2.3","智成长":"1.0","速成长":"1.3","特点":"攻防双高，全面","生平":"河东解良人，犯了事，一路逃到涿郡。在那里认识了刘备和张飞，三个人睡一张床。人多的场合，他和张飞整天站在刘备身后。｜下邳城破，他降了曹操。白马一战，他远远望见颜良的麾盖，策马冲进万人之中，刺死颜良，割了首级回来。曹操给的赏赐，他一样样封好，留下一封信就走了。｜后来他镇守荆州。左臂中过一箭，医生剖开皮肉刮骨，血淌了一盘子，他照旧割肉喝酒，跟人说笑。建安二十四年秋天汉水暴涨，于禁的七军全泡在水里。同年冬天，吕蒙的兵扮成商人过了江。他从麦城往西北走，没走出临沮。"},{"名":"张飞","阵营":"蜀","定位":"武将","品阶":"无双","武力":"97","统率":"76","智力":"22","速度":"72","武成长":"3.1","统成长":"1.9","智成长":"0.3","速成长":"1.5","特点":"一根筋，武力成长第三","生平":"涿郡人，年轻时和关羽一起跟了刘备。关羽比他大几岁，他拿关羽当兄长。｜当阳长坂，刘备丢下妻儿往南跑，留他带二十骑断后。他据水断了桥，瞪眼横矛喝道：「身是张益德也，可来共决死！」曹兵没一个敢上前。入蜀时他在江州捉了巴郡太守严颜，喝问他为什么不降，严颜答：「但有断头将军，无降将军也。」他听完，叫人给严颜松了绑，待为宾客。｜他敬重读书人，对手下兵卒却动辄鞭打，打完还留在身边。章武元年，他准备从阆中出兵，帐下将张达、范疆割了他的头，顺流投了孙权。营都督的表送到，刘备一听是都督上表，便道：「噫！飞死矣。」"},{"名":"赵云","阵营":"蜀","定位":"武将","品阶":"无双","武力":"96","统率":"78","智力":"45","速度":"88","武成长":"2.7","统成长":"2.2","智成长":"1.0","速成长":"2.0","特点":"均衡，速度成长最高一档","生平":"常山真定人，原先在公孙瓒手下，后来跟了刘备，替他主管骑兵。｜长坂坡乱军里，有人跑来报告，赵云往北投曹操去了。刘备抓起手戟朝那人掷过去：「子龙不弃我走也。」没过多久，赵云抱着阿斗、护着甘夫人回来了。汉水边曹军大至，他退回营里，把营门打开，旗放倒，鼓也不敲。曹兵怕有伏兵，退了，他这才擂鼓，拿劲弩从背后射。第二天刘备到营里看了一圈：「子龙一身都是胆也。」｜箕谷失利，他亲自断后，军资什物几乎没丢。诸葛亮要把剩下的绢分给他的将士，他不要：「军事无利，何为有赐？」"},{"名":"马超","阵营":"蜀","定位":"武将","品阶":"无双","武力":"96","统率":"72","智力":"28","速度":"86","武成长":"3.0","统成长":"1.6","智成长":"0.5","速成长":"1.9","特点":"攻高防薄","生平":"马腾的儿子，扶风茂陵人，在西州一带，羌人、胡人都服他。｜建安十六年，他联合韩遂起兵，在潼关跟曹操对峙。两边约好单马会语，他仗着力气，想冲上前去一把抓住曹操，看见曹操身后跟着许褚，没敢动手。曹操用贾诩的计离间他和韩遂，关西兵溃了。第二年，他留在邺城的父亲和族人都死在曹操手里。｜他辗转投了张鲁，又投刘备。刘备围成都，他的兵一到城北，城里就慌了，没多久刘璋开城出降。章武二年他病重，上疏道：「臣门宗二百余口，为孟德所诛略尽，惟有从弟岱，当为微宗血食之继。」"},{"名":"黄忠","阵营":"蜀","定位":"武将","品阶":"无双","武力":"88","统率":"70","智力":"40","速度":"70","武成长":"3.3","统成长":"1.8","智成长":"0.8","速成长":"0.9","特点":"大器晚成：一级值低于同档，武力成长全游戏第一，五十级仅次吕布；速度不长","生平":"南阳人，原是刘表的中郎将，跟刘表的侄子刘磐守长沙攸县。曹操取荆州，他归了曹；刘备南下定四郡，他又归了刘备，随刘备入蜀。｜建安二十四年，夏侯渊在定军山扎营。黄忠推锋向前，鼓声震动山谷，一仗下来斩了夏侯渊。刘备要封他后将军，和关羽同列，诸葛亮担心：「关羽远闻之，恐必不悦。」关羽果然不高兴：「大丈夫终不与老兵同列！」｜演义里他那年七十五岁，跟着刘备伐吴，在猇亭杀进吴军，肩窝上中了马忠一箭，当夜死在营中。"},{"名":"诸葛亮","阵营":"蜀","定位":"文臣","品阶":"无双","武力":"30","统率":"62","智力":"100","速度":"66","武成长":"0.4","统成长":"1.6","智成长":"3.2","速成长":"1.2","特点":"智力上限","生平":"琅邪阳都人，少年时跟叔父到了荆州，在隆中种地，常把自己比作管仲、乐毅。刘备去了三回才见到他。｜他给刘备画的路是：先取荆、益二州，西和诸戎，南抚夷越，外结孙权。刘备死后，蜀汉的事都归他管，罚二十杖以上的案子，他都要亲自过目。｜建兴十二年他最后一次出斜谷，在五丈原分兵屯田，和司马懿对峙了一百多天。司马懿向来使打听他吃多少、睡多少，来使答吃得很少。那年八月他死在军中。蜀军撤退，司马懿追来，姜维叫人反旗鸣鼓，司马懿收兵回去了。百姓编了一句：「死诸葛走生仲达。」"},{"名":"庞统","阵营":"蜀","定位":"文臣","品阶":"无双","武力":"32","统率":"56","智力":"96","速度":"62","武成长":"0.4","统成长":"1.2","智成长":"3.1","速成长":"1.3","特点":"智高统薄","生平":"襄阳人，少时朴钝，没人看重他。二十岁去见司马徽，司马徽在树上采桑，他坐在树下，两个人从白天谈到夜里。｜刘备领荆州，让他去守耒阳，他不理县事，免了官。鲁肃写信给刘备：「庞士元非百里才也。」诸葛亮也这么讲，刘备才重用他，拿他当军师中郎将。｜入蜀路上他献了上中下三计，刘备取中计，斩杨怀、高沛，回头打成都。围雒城时他亲自领兵攻城，中了流矢，年三十六。刘备一提起他就流泪。演义里那地方叫落凤坡，他那天骑的是刘备的白马。"},{"名":"姜维","阵营":"蜀","定位":"武将","品阶":"无双","武力":"88","统率":"74","智力":"82","速度":"78","武成长":"2.6","统成长":"2.0","智成长":"2.3","速成长":"1.5","特点":"文武并进","生平":"天水冀县人，本是魏将。建兴六年诸葛亮出祁山，天水太守马遵疑心手下有二心，连夜跑去了上邽。他追到上邽，城门不开，回到冀县，冀县也不开，只好去投诸葛亮。｜诸葛亮给张裔、蒋琬写信，夸他「心存汉室，而才兼于人」。诸葛亮死后，他屡次北伐。景元四年钟会、邓艾伐蜀，他退守剑阁，钟会打不下来。邓艾从阴平绕到成都，刘禅下诏叫他投降，将士们拔刀砍石头。｜他降了钟会，又撺掇钟会造反，想借机复国。事情败露，他死在乱兵里，魏兵剖开他的肚子，胆有斗那么大。"},{"名":"法正","阵营":"蜀","定位":"文臣","品阶":"无双","武力":"40","统率":"60","智力":"94","速度":"64","武成长":"0.6","统成长":"1.4","智成长":"2.9","速成长":"1.2","特点":"","生平":"扶风郿县人，建安初年闹饥荒，和同郡孟达一起入蜀投刘璋，过了很久才做了个新都令，州里人还议论他品行不好。｜他和张松暗中商量好，借出使的机会见了刘备，回去劝刘璋请刘备入蜀，又私下给刘备献取益州的策。刘备定蜀后，他当了蜀郡太守，「一餐之德，睚眦之怨，无不报复」，擅杀了好几个人。有人去找诸葛亮，诸葛亮没管。｜汉中那一仗是他谋划的。有一回战况不利，刘备不肯退，箭下如雨，他挡到刘备身前，刘备只好道：「孝直避箭。」夷陵大败后，诸葛亮叹：「法孝直若在，则能制主上，令不东行。」"},{"名":"曹操","阵营":"魏","定位":"辅助","品阶":"无双","武力":"72","统率":"80","智力":"94","速度":"70","武成长":"1.3","统成长":"2.2","智成长":"2.5","速成长":"1.3","特点":"全能，辅助里武力最高","生平":"沛国谯人，小名阿瞒。父亲曹嵩是宦官曹腾的养子。年轻时好飞鹰走狗，许劭评他「治世之能臣，乱世之奸雄」，他大笑而去。｜后来他把汉献帝迎到许县，挟天子以令诸侯。官渡烧了袁绍在乌巢的粮草，河北就归了他。赤壁一场大火，他从华容道退回了北边。演义里他错杀吕伯奢一家，留下一句：「宁教我负天下人，休教天下人负我。」｜临死他写了遗令，叫姬妾们学着编鞋卖钱，入殓穿平常的衣服，墓里不要放金玉珍宝。"},{"名":"张辽","阵营":"魏","定位":"武将","品阶":"无双","武力":"93","统率":"76","智力":"52","速度":"84","武成长":"2.7","统成长":"2.1","智成长":"1.0","速成长":"1.9","特点":"快","生平":"雁门马邑人，本姓聂。先后跟过丁原、何进、董卓、吕布，下邳城破后归了曹操。｜建安二十年，孙权带十万人围合肥，城里只有七千多人。曹操早留下一封信，封皮上写着「贼至乃发」。张辽拆开，信上叫他和李典出城迎战。他连夜挑了八百个敢跟他去的兵，杀牛犒劳，天亮披甲持戟冲在最前面，杀了几十人，斩了两员将，一路喊着自己的名字冲到孙权的旗下。孙权跑上一座土丘，拿长戟护着自己。｜后来江东的小孩夜里哭，大人吓唬一句「辽来」，孩子就不哭了。"},{"名":"典韦","阵营":"魏","定位":"武将","品阶":"无双","武力":"96","统率":"84","智力":"18","速度":"64","武成长":"2.8","统成长":"2.7","智成长":"0.2","速成长":"0.9","特点":"统率成长最高一档，速度最慢","生平":"陈留己吾人，形貌魁梧，膂力过人。替襄邑刘氏报仇，杀了李永，提着刀戟慢慢走出市集，几百人跟着，没人敢近。｜后来跟了曹操。濮阳打吕布，敌兵四面放箭，他叫身边人：「虏来十步，乃白之。」「十步矣。」「五步乃白。」「虏至矣！」他手握十几支戟，大呼而起，冲到跟前的都应手倒下。军中有句话：「帐下壮士有典君，提一双戟八十斤。」｜建安二年，张绣在宛城反了，典韦守在营门，身上几十处伤，最后两手各挟一个敌兵撞死，瞪着眼大骂，倒了下去。"},{"名":"许褚","阵营":"魏","定位":"武将","品阶":"无双","武力":"95","统率":"80","智力":"15","速度":"68","武成长":"3.1","统成长":"2.3","智成长":"0.2","速成长":"1.0","特点":"纯力","生平":"谯国谯人，身长八尺多，腰大十围。汉末他聚了几千户乡人筑壁自守，粮尽了拿牛跟贼换粮，牛却跑了回来。他出到阵前，一手倒拽牛尾走了一百多步，贼人吓得不敢要牛，跑了。｜后来他在曹操身边宿卫。潼关北渡渭水，马超的骑兵追到河边，箭像下雨，他左手举马鞍替曹操挡箭，右手撑船。曹操和马超单马会语，马超问：「公有虎侯者安在？」曹操回头指了指他，他瞪着眼看马超。演义里他脱了衣甲和马超斗到两百多回合，胳膊上还中了两箭。｜曹操死了，他哭到呕血。"},{"名":"夏侯惇","阵营":"魏","定位":"武将","品阶":"无双","武力":"91","统率":"78","智力":"40","速度":"72","武成长":"2.5","统成长":"2.5","智成长":"0.7","速成长":"1.3","特点":"攻防均长","生平":"沛国谯人，十四岁跟老师读书，有人侮辱他的老师，他把那人杀了。｜他是最早跟着曹操起兵的，常和曹操同坐一辆车，能进出曹操的卧室。打吕布时中了流矢，瞎了左眼，军中叫他盲夏侯，他很厌恶，每次照镜子都发怒，把镜子摔在地上。演义里射他的是曹性，他拔出箭来，连眼珠子一起吞了下去：「父精母血，不可弃也！」｜他官至大将军，不置产业，多出来的钱都分给了别人。曹操死后几个月，他也跟着去了。"},{"名":"郭嘉","阵营":"魏","定位":"文臣","品阶":"无双","武力":"28","统率":"52","智力":"98","速度":"68","武成长":"0.3","统成长":"1.0","智成长":"3.0","速成长":"1.4","特点":"早慧早衰：一级智力仅次诸葛，成长压一点，统率成长最低","生平":"颍川阳翟人，年轻时先去投袁绍，待了些日子，跟袁绍的谋臣辛评、郭图讲袁绍「多端寡要，好谋无决」，走了。｜荀彧把他荐给曹操，两个人谈完，曹操道：「使孤成大业者，必此人也。」郭嘉出来也高兴：「真吾主也。」孙策要偷袭许都，众人都慌，他料孙策轻而无备，「必死于匹夫之手」。没多久孙策就死在刺客手里。｜建安十二年，他跟着曹操征乌桓回来，病死了，年三十八。赤壁败后，曹操叹：「郭奉孝在，不使孤至此。」"},{"名":"荀彧","阵营":"魏","定位":"辅助","品阶":"无双","武力":"35","统率":"66","智力":"95","速度":"60","武成长":"0.5","统成长":"1.8","智成长":"2.7","速成长":"1.0","特点":"","生平":"颍川颍阴人，年轻时何颙见了他，讲他是「王佐才也」。他先投袁绍，看袁绍成不了事，又去了曹操那里。曹操大喜：「吾之子房也。」｜曹操在外打仗，许都的事都交给他。官渡相持，曹操粮快尽了，想退兵，写信问他。他回信劝曹操守住，这是用奇的时候，不能放手。｜建安十七年，董昭等人要给曹操进爵国公、加九锡，他不赞成。曹操南征孙权，把他留在寿春，他在那里忧病而卒，年五十。裴注引的《魏氏春秋》里另有一种写法：曹操送给他一个食盒，他打开，里面是空的，他就服了毒。"},{"名":"司马懿","阵营":"魏","定位":"文臣","品阶":"无双","武力":"45","统率":"72","智力":"98","速度":"62","武成长":"0.7","统成长":"2.0","智成长":"3.1","速成长":"1.0","特点":"熬：文臣里统率成长最高","生平":"河内温县人。曹操征召他，他推托得了风痹，起不了身。曹操派人夜里去探，他躺着一动不动。｜诸葛亮屡次北伐，他坚守不出。诸葛亮派人给他送来女人的巾帼衣服，他照样不出战。｜正始年间曹爽专权，他称病不上朝。李胜来辞行，他叫两个婢女扶着，手里的衣服拿不住掉在地上，喝粥流了满胸口，问话也答得颠三倒四。嘉平元年正月，曹爽陪着小皇帝出城谒高平陵，他关了洛阳城门，领兵屯在洛水浮桥，没几天，曹爽兄弟和党羽都灭了三族。"},{"名":"贾诩","阵营":"魏","定位":"文臣","品阶":"无双","武力":"30","统率":"60","智力":"97","速度":"64","武成长":"0.4","统成长":"1.6","智成长":"2.9","速成长":"1.3","特点":"","生平":"武威姑臧人。年轻时辞官回乡，路上遇到氐人叛乱，同行几十人全让氐人抓了。他骗他们：「我段公外孙也，汝别埋我，我家必厚赎之。」段颎当时威震西土，氐人不敢害他，放了，其余的人都活埋了。｜董卓死后，李傕、郭汜想散了兵各自逃回凉州，他劝他们收拢兵马去打长安。后来他在张绣那里，曹操退兵，张绣要追，他拦着，张绣不听，败了回来；他又叫张绣马上再追，这回大胜。｜曹操拿不定立谁为嗣，问他，他不答。曹操问他在想什么，他答：「思袁本初、刘景升父子也。」曹操大笑。"},{"名":"邓艾","阵营":"魏","定位":"武将","品阶":"无双","武力":"89","统率":"74","智力":"78","速度":"76","武成长":"2.6","统成长":"1.9","智成长":"2.2","速成长":"1.4","特点":"文武并进","生平":"义阳棘阳人，小时候放过牛，有口吃，一开口就是「艾艾」。司马昭拿他开玩笑：「卿云艾艾，定是几艾？」他答：「凤兮凤兮，故是一凤。」他每见高山大泽，就比划哪里可以扎营，旁人都笑话他。｜景元四年伐蜀，他从阴平走七百多里没有人烟的山路，凿山开道，遇到险处，他自己裹着毡子滚下山去。到了江油，守将开城投降，他在绵竹斩了诸葛瞻，刘禅出城投降。｜钟会诬告他谋反，卫瓘派兵追到绵竹西边，杀了他和儿子邓忠。"},{"名":"孙坚","阵营":"吴","定位":"武将","品阶":"无双","武力":"90","统率":"78","智力":"50","速度":"76","武成长":"2.8","统成长":"2.2","智成长":"1.2","速成长":"1.5","特点":"","生平":"吴郡富春人。十七岁跟父亲坐船到钱塘，正碰上海盗在岸上分赃，他提刀上岸，拿手东指西挥，像在调兵，海盗以为官军到了，丢下财物就跑，他追上去斩了一颗首级。｜讨董时他是前锋。演义里他在汜水关前输给华雄，部将祖茂戴上他的赤帻，引开了追兵。后来他进了洛阳，扫除汉家宗庙，在城南一口井里捞出传国玉玺。｜那一年他攻刘表，追黄祖追到襄阳，一个人骑马过岘山，黄祖的兵藏在山上的竹林里放箭，射死了他，年三十七。"},{"名":"孙策","阵营":"吴","定位":"武将","品阶":"无双","武力":"93","统率":"72","智力":"44","速度":"86","武成长":"3.0","统成长":"1.7","智成长":"0.9","速成长":"2.0","特点":"猛冲，防薄","生平":"孙坚的长子，孙坚死时他十七岁。他去袁术那里要回父亲的旧部，只要回来一千多人，就渡江去打江东。｜江东百姓听到孙郎来了，吓得逃进山里，等他到了，军令严整，鸡犬菜蔬一样不动，百姓又都牵着牛带着酒来劳军。神亭岭他和太史慈撞上，两个人马上扭打，他夺了太史慈背后的手戟，太史慈抢走了他的头盔。｜建安五年他 ":"虎","武力":"30","统率":"56","智力":"90","速度":"58","武成长":"0.4","统成长":"1.5","智成长":"2.6","速成长":"1.0","特点":"","生平":"曹操东征刘备，田丰劝袁绍趁虚袭许都。袁绍推托小儿子正病着，不肯动兵。田丰拿手杖敲着地：「夫遭难遇之机，而以婴儿之病失其会，惜哉！」｜后来袁绍要南下打官渡，他又拦，袁绍给他上了枷锁，关进牢里。｜官渡大败的消息传回来，有人向他道喜，以为这回主公要重用他了。田丰摇头：「若军有利，吾必全；今军败，吾其死矣。」袁绍回来，派人把剑送进了牢里。"},{"名":"沮授","阵营":"汉","定位":"文臣","品阶":"虎","武力":"32","统率":"58","智力":"88","速度":"56","武成长":"0.4","统成长":"1.6","智成长":"2.5","速成长":"1.0","特点":"","生平":"袁绍大军要渡黄河，沮授站在岸边叹了一句：「上盈其志，下务其功，悠悠黄河，吾其济乎！」随后推病辞了兵权。袁绍记恨，把他的兵拨给了郭图。｜官渡兵败，袁绍带八百骑逃过河去，沮授没跟上，落到曹军手里。见了曹操，他喊：「授不降也，为军所执耳！」曹操跟他是旧识，待他很厚。｜没过多久，他偷了马要回河北，曹操这才杀了他。"},{"名":"李儒","阵营":"汉","定位":"文臣","品阶":"虎","武力":"28","统率":"50","智力":"91","速度":"62","武成长":"0.3","统成长":"1.2","智成长":"2.6","速成长":"1.2","特点":"","生平":"董卓废了少帝，改封弘农王，关在永安宫的楼上。李儒端着鸩酒进去，少帝不肯喝。李儒双手揪住何太后扔下楼去，又叫武士绞死唐妃，把酒灌进少帝嘴里。｜凤仪亭的事闹出来，他劝董卓把貂蝉送给吕布，讲了楚庄王绝缨的故事。董卓回去跟貂蝉一商量，改了主意。李儒出门仰天长叹：「吾等皆死于妇人之手矣！」｜董卓死后，他家的奴仆把他绑了，献给王允。"},{"名":"于吉","阵营":"汉","定位":"文臣","品阶":"虎","武力":"20","统率":"48","智力":"92","速度":"64","武成长":"0.2","统成长":"1.1","智成长":"2.7","速成长":"1.2","特点":"法师","生平":"琅邪来的道士，在吴郡、会稽一带往来，烧香读道书，拿符水给人治病。｜一天孙策在郡城门楼上宴客，于吉穿戴整齐从楼下走过，席上三分之二的将领宾客起身下楼，迎着他拜。孙策当即下令拿人。吴夫人和诸将替他求情，孙策不听，把他斩了，首级挂在街市上。｜此后孙策总看见他，灯下有，镜子里也有。孙策拍着镜子大叫一声，箭疮迸裂开来。"},{"名":"夏侯渊","阵营":"魏","定位":"武将","品阶":"虎","武力":"86","统率":"68","智力":"42","速度":"84","武成长":"2.3","统成长":"1.6","智成长":"0.7","速成长":"1.9","特点":"神速","生平":"曹操早年在谯县惹了官司，夏侯渊替他顶了重罪，后来曹操才设法把他救出。兖州、豫州闹饥荒那年，他丢下自己的小儿子，把亡弟的孤女养活了。｜他行军快，军中编了句话：「三日五百，六日一千。」曹操提醒他：「为将当有怯弱时，不可但恃勇也。」｜建安二十四年正月，定军山下南围的鹿角半夜起了火，他带四百人去补。黄忠从高处擂鼓冲了下来。"},{"名":"张郃","阵营":"魏","定位":"武将","品阶":"虎","武力":"84","统率":"74","智力":"60","速度":"78","武成长":"2.2","统成长":"2.0","智成长":"1.3","速成长":"1.5","特点":"巧变，四维均衡","生平":"河间鄚县人，本是袁绍的将。曹操去烧乌巢，他劝袁绍赶紧去救，郭图偏要攻曹营。曹营没打下来，郭图反倒在袁绍面前说他坏话。张郃烧了攻城器械，投了曹操。｜街亭一仗，马谡舍了水源上山扎营，张郃截断汲水的路，一战打散了他。｜太和五年诸葛亮退兵，司马懿要他追。追到木门道，两边山上弩箭齐发，一箭钉进他的右膝。"},{"名":"徐晃","阵营":"魏","定位":"武将","品阶":"虎","武力":"86","统率":"72","智力":"50","速度":"72","武成长":"2.4","统成长":"1.9","智成长":"0.9","速成长":"1.2","特点":"","生平":"河东杨县人，做过郡吏，后来跟着杨奉护送献帝东归。他劝杨奉投曹操，杨奉起初答应，又反悔了。曹操讨杨奉，徐晃归了曹营。｜樊城告急，他领兵去解，阵前遇上关羽。两人本是旧识，隔着马聊了些家常。话没说完，徐晃下马，朝全军喊：「得关云长头，赏金千斤！」关羽一惊，他回道：「此国家之事耳。」｜关羽退走。曹操在摩陂迎出七里摆酒，各营兵马都离了阵来看，只有徐晃营里的人站着不动。"},{"名":"于禁","阵营":"魏","定位":"武将","品阶":"虎","武力":"78","统率":"78","智力":"52","速度":"64","武成长":"1.9","统成长":"2.2","智成长":"1.0","速成长":"1.0","特点":"严整，统率型","生平":"宛城兵败，各军散乱逃回，青州兵一路抢掠。于禁领本部去讨，回来不急着见曹操，先扎营垒。有人劝他快去辩白，他答：「今贼在后，追至无时，不先为备，何以待敌？」｜建安二十四年秋汉水暴涨，他督的七军全泡在水里，他向关羽投降。曹操听到消息：「吾知禁三十年，何意临危处难，反不如庞德邪！」｜后来孙权送他回魏。曹丕派他去邺城拜曹操的陵，陵屋墙上画着他降服的样子。"},{"名":"乐进","阵营":"魏","定位":"武将","品阶":"虎","武力":"85","统率":"64","智力":"30","速度":"76","武成长":"2.5","统成长":"1.4","智成长":"0.5","速成长":"1.5","特点":"先登","生平":"阳平卫国人，个子矮小，在曹操帐下当吏。曹操派他回本郡募兵，他带回来一千多人。｜从濮阳到雍丘，几回攻城，他都抢在头一个爬上城墙。官渡时他跟曹操去袭乌巢，斩了淳于琼。｜后来他和张辽、李典屯合肥。曹操出征前留下一封教令，封着口，上面写：「贼至乃发。」孙权大军一到，三人拆开，里头写着张、李两位将军出战，乐将军守城。"},{"名":"庞德","阵营":"魏","定位":"武将","品阶":"虎","武力":"87","统率":"70","智力":"30","速度":"74","武成长":"2.5","统成长":"1.7","智成长":"0.4","速成长":"1.4","特点":"","生平":"本是马超手下的将，张鲁败后归了曹操。他的从兄庞柔在汉中做官，樊城的将领们因此信不过他。｜庞德当众撂话：「今年我不杀羽，羽当杀我。」出兵前他叫人抬着一口棺材。他常骑白马，隔阵一箭射中关羽额头，关羽军中都叫他白马将军。｜大水漫上堤，他射到箭尽，夺了小船想回曹仁营里，船翻了，抱着船底落到关羽手里。关羽劝降，他骂：「我宁为国家鬼，不为贼将也。」"},{"名":"曹仁","阵营":"魏","定位":"武将","品阶":"虎","武力":"82","统率":"80","智力":"48","速度":"62","武成长":"2.0","统成长":"2.2","智成长":"0.9","速成长":"1.0","特点":"守城，虎档统率最高","生平":"曹操的堂弟，年轻时爱骑马射猎。｜周瑜围江陵，曹仁派部将牛金带三百人出城迎敌，转眼陷进几千吴兵里。城楼上的人脸都白了，曹仁要来铠甲上马，长史陈矫等人拦他，他不理。他冲进去把牛金接了出来，回头见还有人没出来，又杀了进去。陈矫叹：「将军真天人也！」｜樊城大水，城墙只剩几板露在外面，有人劝他乘船走。曹仁沉了一匹白马，跟将士们盟誓死守。"},{"名":"曹真","阵营":"魏","定位":"武将","品阶":"虎","武力":"80","统率":"74","智力":"56","速度":"68","武成长":"2.0","统成长":"1.9","智成长":"1.2","速成长":"1.2","特点":"","生平":"父亲曹邵替曹操募兵时遇害，曹操把他接进府里，跟曹丕一块儿长大。有一回出猎，一头虎追着他跑，他回身一箭，虎应声倒地。｜诸葛亮头一回北伐，他坐镇郿县，在箕谷挡住了赵云、邓芝。他出征时跟士卒一起吃苦，赏赐不够，就拿家里的财物来分。｜太和四年他从子午道伐蜀，一连下了三十多天大雨，栈道断了，朝廷下诏召回。他回洛阳就病倒了，魏明帝亲自到他府上探病。"},{"名":"曹彰","阵营":"魏","定位":"武将","品阶":"虎","武力":"88","统率":"66","智力":"22","速度":"74","武成长":"2.6","统成长":"1.5","智成长":"0.3","速成长":"1.4","特点":"黄须儿，虎档武力成长最高","生平":"胡子是黄的，力气大，能空手跟猛兽搏斗。曹操让他读《诗》《书》，他跟身边人讲：「丈夫一为卫、霍，将十万骑驰沙漠，驱戎狄，立功建号耳，何能作博士邪？」｜代郡乌桓反，他领兵北征，亲自下阵搏杀，铠甲上插了好几支箭。仗打完，他去长安见曹操，曹操一把揪住他的黄胡子：「黄须儿竟大奇也！」｜黄初四年，他进京朝见，没能回到封地。"},{"名":"郭淮","阵营":"魏","定位":"武将","品阶":"虎","武力":"78","统率":"74","智力":"64","速度":"68","武成长":"1.9","统成长":"1.9","智成长":"1.5","速成长":"1.2","特点":"","生平":"夏侯渊死在定军山，汉中的魏军乱成一团。郭淮收拢残兵，推张郃做主将。第二天刘备要渡汉水，诸将想沿河列阵，郭淮主张离河远些扎营，引蜀军过河，渡到一半再打。刘备看了，没有渡。｜他妻子是王凌的妹妹。王凌谋反事败，朝廷派人来押她回京，五个儿子磕头磕出了血。郭淮派几千骑追了几天，把人夺回来，写信给司马懿：「若无其母，是无五子；无五子，亦无淮也。」司马懿赦了她。"},{"名":"荀攸","阵营":"魏","定位":"文臣","品阶":"虎","武力":"32","统率":"58","智力":"91","速度":"58","武成长":"0.4","统成长":"1.5","智成长":"2.7","速成长":"1.0","特点":"","生平":"荀彧的侄子，年纪却比荀彧大六岁。董卓当政时，他和何颙等人谋划刺杀董卓，事情败露下了狱。何颙又怕又急，在狱里自尽了，荀攸吃饭说话跟平常一样。董卓一死，他就出来了。｜他给曹操出过十二条奇策，只有钟繇知道都是些什么。钟繇还没编完就死了，这些计策没传下来。｜曹操评他：「公达外愚内智，外怯内勇。」"},{"名":"程昱","阵营":"魏","定位":"文臣","品阶":"虎","武力":"45","统率":"60","智力":"88","速度":"56","武成长":"0.8","统成长":"1.6","智成长":"2.5","速成长":"1.0","特点":"文臣里能打","生平":"东阿人，身高八尺三寸，胡子很美。原名程立，年轻时梦见自己登上泰山，两手捧着太阳。荀彧把这梦告诉曹操，曹操给他名字上加了个日字，改叫程昱。｜官渡前夕他守鄄城，手下只有七百兵。曹操要给他添两千，他不要：「袁绍拥十万众，自以所向无前。今见昱兵少，必轻易不来攻。」袁绍果然没去鄄城。｜后来曹操跟贾诩感叹：「程昱之胆，过于贲、育。」"},{"名":"钟会","阵营":"魏","定位":"文臣","品阶":"虎","武力":"50","统率":"56","智力":"90","速度":"66","武成长":"1.0","统成长":"1.3","智成长":"2.6","速成长":"1.3","特点":"","生平":"太傅钟繇的小儿子。小时候跟哥哥钟毓去见魏文帝，钟毓紧张得满脸是汗，文帝问怎么回事，钟毓答：「战战惶惶，汗出如浆。」又问钟会怎么不出汗，钟会答：「战战栗栗，汗不敢出。」｜景元四年他领十几万人伐蜀，在剑阁让姜维挡住。邓艾从阴平绕到了成都，他上书告邓艾谋反，把邓艾装进了囚车。｜进了成都，他和姜维合计要反。正月十八那天，营中的兵乱了起来，冲进宫门。"},{"名":"蔡文姬","阵营":"魏","定位":"辅助","品阶":"虎","武力":"20","统率":"50","智力":"84","速度":"60","武成长":"0.2","统成长":"1.3","智成长":"2.4","速成长":"1.1","特点":"","生平":"蔡邕的女儿，名琰。天下大乱时她落到胡骑手里，在南匈奴左贤王帐中住了十二年，生了两个儿子。曹操派人拿金璧把她赎了回来，改嫁同郡的董祀。｜后来董祀犯了死罪。那天曹操正宴客，蔡琰披着头发光着脚进来，叩头请罪，满堂的人都变了脸色。曹操派快马追回了文书。｜曹操问起她家的藏书，她答：「亡父赐书四千许卷，今所诵忆，裁四百余篇耳。」她默写了出来，没有错漏。"},{"名":"戏志才","阵营":"魏","定位":"文臣","品阶":"虎","武力":"26","统率":"48","智力":"92","速度":"64","武成长":"0.3","统成长":"1.0","智成长":"2.3","速成长":"1.2","特点":"早卒：一级智力虎档第一，成长压低","生平":"颍川人，荀彧把他荐给了曹操。曹操很看重他，可他没活几年。｜他死后，曹操写信给荀彧：「自志才亡后，莫可与计事者。汝、颍固多奇士，谁可以继之？」荀彧回信，举荐了郭嘉。｜史书上关于他的就这么多，连他的本名都没人说得准。"},{"名":"魏延","阵营":"蜀","定位":"武将","品阶":"虎","武力":"87","统率":"70","智力":"48","速度":"78","武成长":"2.5","统成长":"1.7","智成长":"0.9","速成长":"1.5","特点":"","生平":"刘备取了汉中，众人都以为镇守汉中的会是张飞，刘备却提拔了魏延。刘备问他打算怎么守，他答：「若曹操举天下而来，请为大王拒之；偏将十万之众至，请为大王吞之。」｜诸葛亮北伐，他要五千精兵从子午谷奔袭长安，诸葛亮没答应。｜诸葛亮死在五丈原，他跟杨仪争着领兵，两边在南郑城下对阵。魏延勒马连喊三声：「谁敢杀我？」背后有人应声：「吾敢杀汝！」马岱一刀把他砍下马去。"},{"名":"关平","阵营":"蜀","定位":"武将","品阶":"虎","武力":"82","统率":"70","智力":"44","速度":"74","武成长":"2.3","统成长":"1.8","智成长":"0.8","速成长":"1.4","特点":"","生平":"河北关定的次子。关羽千里寻兄，在关家庄借宿，关定把两个儿子领出来拜见，刘备做主，让关羽收关平做了义子。｜此后关平一直跟在关羽身边，守荆州，攻樊城。庞德抬着棺材出阵那天，关平先迎上去，两人斗了三十合不分胜负。｜麦城突围那夜，关羽中了绊马索，关平赶去救，也让潘璋的兵围住了。父子俩是一起押到孙权面前的。"},{"名":"关兴","阵营":"蜀","定位":"武将","品阶":"虎","武力":"84","统率":"66","智力":"40","速度":"78","武成长":"2.4","统成长":"1.6","智成长":"0.7","速成长":"1.6","特点":"","生平":"关羽的次子。刘备起兵伐吴，他和张苞争先锋，当着刘备的面比射箭，关兴一箭射下了天上的大雁。｜夷陵一仗，他追潘璋追到天黑，迷路进了山里一户人家。堂上挂着关羽的画像，他跪在像前哭。半夜潘璋也来投宿，一进门看见关兴，转身要跑。关兴一剑把他砍倒，剖心沥血，在画像前祭了父亲，拿回了青龙偃月刀。｜诸葛亮很器重他，他二十岁做了侍中，没过几年就死了。"},{"名":"张苞","阵营":"蜀","定位":"武将","品阶":"虎","武力":"86","统率":"64","智力":"22","速度":"76","武成长":"2.6","统成长":"1.5","智成长":"0.3","速成长":"1.5","特点":"像他爹","生平":"张飞的长子，使一杆丈八点钢矛。张飞在阆中遇害后，他跟着刘备东征，在军中跟关兴争先锋。刘备让两人结拜，关兴大一岁，做了哥哥。｜诸葛亮北伐，他追郭淮、孙礼，马失前蹄跌进山涧，摔破了头，送回成都养伤。｜没多久消息传到祁山，诸葛亮放声大哭，口中吐血，昏倒在地。"},{"名":"王平","阵营":"蜀","定位":"武将","品阶":"虎","武力":"76","统率":"78","智力":"58","速度":"66","武成长":"1.9","统成长":"2.2","智成长":"1.4","速成长":"1.1","特点":"无当飞军，统率型","生平":"巴西宕渠人，从小养在外祖父何家，后来才复了王姓。他认得的字不到十个，要写文书就口述，让人代笔。｜他随马谡守街亭，屡次劝马谡别上山，马谡不听。魏军一到，蜀兵四散，只有王平手下一千人擂着鼓不动。张郃疑心有伏兵，没敢逼近。王平慢慢收拢各营散兵，退了回来。｜后来他镇守汉中。曹爽带十几万人来攻，他据住兴势山，魏军进不来，只好退兵。"},{"名":"马岱","阵营":"蜀","定位":"武将","品阶":"虎","武力":"80","统率":"70","智力":"46","速度":"76","武成长":"2.1","统成长":"1.8","智成长":"0.8","速成长":"1.5","特点":"","生平":"马超临死前上了一道疏：「臣门宗二百余口，为孟德所诛略尽，惟有从弟岱，当为微宗血食之继。」马岱就是这个从弟。｜诸葛亮临终留了一只锦囊给杨仪，嘱咐等魏延反时再拆。魏延在城下喊「谁敢杀我」，没等喊到第三声，背后一刀落下。那一刀是马岱的。｜后来他官至平北将军，封陈仓侯。"},{"名":"严颜","阵营":"蜀","定位":"武将","品阶":"虎","武力":"82","统率":"76","智力":"44","速度":"60","武成长":"1.9","统成长":"2.0","智成长":"0.7","速成长":"0.8","特点":"老将，速度不长","生平":"刘璋手下的巴郡太守。张飞攻破江州，把他活捉了来，喝问：「大军至，何以不降而敢拒战？」严颜答：「卿等无状，侵夺我州，我州但有断头将军，无有降将军也。」｜张飞大怒，叫人拖出去砍了。严颜脸色不变：「斫头便斫头，何为怒邪！」张飞亲自给他松绑，请他坐上座。｜后来在汉中，他跟黄忠两个老将一路打过去，夺了天荡山的粮草，斩了夏侯德。"},{"名":"夏侯霸","阵营":"蜀","定位":"武将","品阶":"虎","武力":"83","统率":"70","智力":"50","速度":"74","武成长":"2.2","统成长":"1.8","智成长":"1.0","速成长":"1.3","特点":"","生平":"父亲夏侯渊死在定军山，他提起蜀人就咬牙。｜嘉平元年，司马懿杀了曹爽，夏侯霸在陇西坐不住了，投奔蜀汉。进山迷了路，干粮吃完，杀马充饥，一路走得脚底开裂，躺在岩石下面等人来接。｜到了成都，刘禅见他，先提起他父亲：「卿父自遇害于行间耳，非我先人之手刃也。」又指着自己的儿子：「此夏侯氏之甥也。」"},{"名":"孙尚香","阵营":"蜀","定位":"武将","品阶":"虎","武力":"78","统率":"62","智力":"50","速度":"84","武成长":"2.2","统成长":"1.4","智成长":"0.9","速成长":"1.9","特点":"弓腰姬，快","生平":"孙权的妹妹，性子刚猛，有几个哥哥的样子。房里一百多个侍婢，个个佩刀站在两旁。刘备每回进她屋子，心里都发紧。｜她跟刘备从京口逃往荆州，徐盛、丁奉带兵追到江边拦住去路。她卷起车帘，指着二人骂：「你二人只怕周瑜，独不怕我？」两人只好让开道。｜后来孙权派船来接她回吴，她抱着阿斗上了船，赵云和张飞追上江来，把阿斗夺了回去。"},{"名":"徐庶","阵营":"蜀","定位":"文臣","品阶":"虎","武力":"55","统率":"60","智力":"89","速度":"64","武成长":"1.0","统成长":"1.5","智成长":"2.5","速成长":"1.2","特点":"会武的文臣","生平":"颍川人，本名徐福，年轻时好击剑，替人报仇杀了人，拿白土涂了脸披着头发逃走，还是让官吏拿住了。同伙把他劫了出来，从此他扔了刀剑，去读书。｜在新野，他向刘备推荐了诸葛亮：「此人可就见，不可屈致也。」｜曹军南下，他母亲落到曹操手里。他指着自己的心口向刘备辞行：「本欲与将军共图王霸之业者，以此方寸之地也。今已失老母，方寸乱矣。」"},{"名":"马良","阵营":"蜀","定位":"文臣","品阶":"虎","武力":"28","统率":"54","智力":"88","速度":"58","武成长":"0.3","统成长":"1.4","智成长":"2.5","速成长":"1.0","特点":"","生平":"襄阳宜城人，兄弟五个都有才名，字里都带个常字。马良眉毛里夹着几根白毛，乡里人编了句话：「马氏五常，白眉最良。」｜他给诸葛亮写信称「尊兄」，裴松之猜两人结拜过，或者沾点亲。｜刘备东征，派他去武陵招抚五溪蛮夷，蛮夷首领都接了刘备的印号。夷陵兵败，他死在那边，时年三十五。"},{"名":"黄月英","阵营":"蜀","定位":"文臣","品阶":"虎","武力":"30","统率":"56","智力":"90","速度":"60","武成长":"0.3","统成长":"1.5","智成长":"2.6","速成长":"1.1","特点":"","生平":"沔南名士黄承彦的女儿。黄承彦听说诸葛亮在找媳妇，上门直言：「闻君择妇，身有丑女，黄头黑色，而才堪相配。」诸葛亮应了，黄承彦当即用车把女儿送了过去。｜乡里人拿这事取笑，编了句顺口溜：「莫作孔明择妇，正得阿承丑女。」｜她的名字史书上没留下，月英是后人叫的。民间传她手巧，会做木头人舂米，诸葛亮造木牛流马，是照她的图样。"},{"名":"蒋琬","阵营":"蜀","定位":"辅助","品阶":"虎","武力":"36","统率":"64","智力":"84","速度":"56","武成长":"0.5","统成长":"1.9","智成长":"2.3","速成长":"1.0","特点":"","生平":"刘备入蜀，派他做广都县长。一天刘备出游路过广都，见县里什么事都没理，蒋琬还喝得烂醉。刘备大怒，要治他的罪。诸葛亮求情：「蒋琬，社稷之器，非百里之才也。」刘备只免了他的官。｜诸葛亮死后，国事交到他手里。当时人心惶惶，他脸上不见悲伤，也不见喜色，举止跟平时一样。｜督农杨敏背地里骂他「作事愦愦，诚非及前人」，有人要治杨敏的罪，蒋琬不许：「吾实不如前人，无可推也。」"},{"名":"陈到","阵营":"蜀","定位":"武将","品阶":"虎","武力":"84","统率":"78","智力":"40","速度":"72","武成长":"2.2","统成长":"2.2","智成长":"0.6","速成长":"1.3","特点":"白毦兵，攻防均长","生平":"汝南人，字叔至。刘备还在豫州的时候，他就跟着了，此后跟到徐州、荆州、益州，名位总比赵云低一点。｜陈寿没给他立传，他的名字夹在杨戏写的一篇赞里，就一句：忠勇和赵云齐名。｜后来他守永安，领的是先主留下的白毦兵，官做到征西将军。"},{"名":"黄盖","阵营":"吴","定位":"武将","品阶":"虎","武力":"84","统率":"72","智力":"48","速度":"64","武成长":"2.3","统成长":"1.9","智成长":"0.8","速成长":"1.0","特点":"老将","生平":"赤壁之战前，黄盖给周瑜出主意：曹军船舰首尾相连，可以烧。诈降书送出去以前，周瑜在帐中当众打了他五十脊杖。｜他带着十艘蒙冲斗舰，装满浸了油的柴草，插着旗，趁东南风驶向北岸。离曹营二里，各船一齐点火。｜那天他中了流箭，掉进江里。吴兵把他捞上来，不认得是谁，随手放在厕所边的床上。黄盖撑着喊了一声韩当，韩当听出声音，流着泪过来了。"},{"名":"程普","阵营":"吴","定位":"武将","品阶":"虎","武力":"82","统率":"74","智力":"54","速度":"66","武成长":"2.1","统成长":"1.9","智成长":"1.1","速成长":"1.1","特点":"三朝","生平":"右北平人，从孙坚起兵打黄巾、讨董卓。军中数他年纪最大，人都叫他程公。｜孙策攻祖郎，陷进重围，程普带着一名骑兵护在孙策身边，纵马大喊，拿矛往外冲，贼兵退开，孙策才脱了身。｜赤壁时他跟周瑜分任左右督。他仗着资历，几次折辱周瑜，周瑜都让着他。后来程普服了，逢人便讲：「与周公瑾交，若饮醇醪，不觉自醉。」"},{"名":"韩当","阵营":"吴","定位":"武将","品阶":"虎","武力":"83","统率":"68","智力":"40","速度":"72","武成长":"2.3","统成长":"1.6","智成长":"0.6","速成长":"1.3","特点":"","生平":"辽西令支人，擅长骑射，力气大，跟着孙坚打仗，孙策、孙权手下都做过事。｜赤壁那天，黄盖中箭落水，吴兵把他扔在厕所边的床上，只有韩当听出了他的声音。｜夷陵之战，他跟陆逊在涿乡大破刘备。他死后，儿子韩综怕犯下的事败露，带着家眷部曲几千人投了魏，走的时候把韩当的灵柩也载上了。"},{"名":"周泰","阵营":"吴","定位":"武将","品阶":"虎","武力":"85","统率":"80","智力":"22","速度":"68","武成长":"2.2","统成长":"2.4","智成长":"0.3","速成长":"1.1","特点":"护主，统率成长虎档第一","生平":"孙策出兵，孙权留守宣城，手下不到一千人。几千山贼突然杀到，孙权刚上马，刀已经砍到马鞍上。周泰扑上去挡在他身前，身上受了十二处伤，过了很久才醒过来。｜后来他督濡须，朱然、徐盛这些人不服他。孙权到营里摆酒，叫周泰脱了上衣，指着一道道伤疤问是怎么来的，周泰一处一处回答。｜酒席散了，孙权赐他青色的伞盖，让他带着兵马，吹吹打打出了营。"},{"名":"凌统","阵营":"吴","定位":"武将","品阶":"虎","武力":"86","统率":"66","智力":"38","速度":"82","武成长":"2.5","统成长":"1.5","智成长":"0.6","速成长":"1.8","特点":"","生平":"父亲凌操在夏口攻黄祖时中箭身亡，射箭的人是甘宁。那年凌统十五岁，接管了父亲的兵。｜甘宁后来投了孙权，凌统恨他。一次在吕蒙家里喝酒，凌统拔刀起舞，甘宁也站起来：「宁能双戟舞。」吕蒙提着刀盾挡在两人中间。｜逍遥津那一战，他带三百亲兵护孙权突围，孙权上了船，他又回去死战，亲兵全死光了，他带着伤游水回来。孙权拿衣袖给他擦眼泪。"},{"名":"丁奉","阵营":"吴","定位":"武将","品阶":"虎","武力":"78","统率":"70","智力":"50","速度":"74","武成长":"2.6","统成长":"1.9","智成长":"1.3","速成长":"1.4","特点":"大器晚成：一级值低，成长高","生平":"年轻时就以骁勇当小将，跟着甘宁、陆逊、潘璋这些人打仗，直到孙亮、孙休时才做到大将。｜建兴元年冬天，魏军来攻东兴，天下着大雪，魏将们正围着喝酒。丁奉带三千人乘船赶到，叫兵士都脱了铠甲，只戴头盔，握着短兵。魏兵远远望见，大笑，没当回事。丁奉擂鼓冲上岸，砍破了魏军前营。｜孙綝专权，孙休跟丁奉合计。腊日百官朝会，丁奉在座上叫武士把孙綝绑了。"},{"名":"徐盛","阵营":"吴","定位":"武将","品阶":"虎","武力":"80","统率":"74","智力":"56","速度":"70","武成长":"2.0","统成长":"1.9","智成长":"1.3","速成长":"1.2","特点":"","生平":"魏使邢贞来封孙权做吴王，进宫门时连车都不下。徐盛站在群臣里，眼泪横流：「盛等不能奋身出命，为国家并许洛，吞巴蜀，而令吾君与贞盟，不亦辱乎！」邢贞回头跟同行的人叹气：江东将相如此，这地方不会久居人下。｜后来曹丕亲自领兵到了广陵，望见长江南岸几百里都是城楼。那些城是徐盛拿木头和苇席搭的假城。｜曹丕望着江水：「魏虽有武骑千群，无所用也。」随即退了兵。"},{"名":"陆抗","阵营":"吴","定位":"武将","品阶":"虎","武力":"78","统率":"76","智力":"70","速度":"66","武成长":"1.9","统成长":"2.0","智成长":"1.7","速成长":"1.1","特点":"武将里智力最高","生平":"陆逊死时他二十岁，护送灵柩回吴郡，到建业谢恩。孙权拿着杨竺告陆逊的二十条罪状，一条条质问他。陆抗不看别处，逐条对答，孙权这才消了气。｜后来他守荆州，对面是晋将羊祜。陆抗送过酒，羊祜喝了也不疑。陆抗病了，羊祜送来药，左右劝他别吃，他一口喝下：「羊祜岂鸩人者！」｜步阐据西陵降晋，他筑起长围把西陵困住，打退晋军援兵，拿下城池，诛了步阐三族。"},{"名":"鲁肃","阵营":"吴","定位":"辅助","品阶":"虎","武力":"40","统率":"64","智力":"86","速度":"58","武成长":"0.6","统成长":"1.8","智成长":"2.4","速成长":"1.0","特点":"","生平":"周瑜做居巢长时，带着几百人去找鲁肃借粮。鲁肃家有两仓米，每仓三千斛，他随手指了一仓，全给了周瑜。｜曹操南下，江东大臣都劝孙权投降。孙权起身更衣，鲁肃追到屋檐下：「今肃可迎操耳，如将军，不可也。」｜赤壁打完，鲁肃回来，孙权下马迎他：「子敬，孤持鞍下马相迎，足以显卿未？」鲁肃答：「未也。」等孙权做了皇帝，再用安车软轮来请他，那才算显。孙权拍着手大笑。"},{"名":"诸葛瑾","阵营":"吴","定位":"辅助","品阶":"虎","武力":"30","统率":"62","智力":"85","速度":"56","武成长":"0.4","统成长":"1.7","智成长":"2.3","速成长":"1.0","特点":"","生平":"诸葛亮的哥哥，脸长。一次宴会上孙权叫人牵进来一头驴，驴脸上挂着牌子，写着「诸葛子瑜」。他六岁的儿子诸葛恪跪下讨了支笔，在后面添了两个字：「之驴」。满座大笑，孙权把驴赏给了恪。｜孙权派他出使蜀汉，他跟弟弟只在公堂上相见，退下来不私下见面。｜有人向孙权告他暗通刘备，孙权不信：「子瑜之不负孤，犹孤之不负子瑜也。」"},{"名":"小乔","阵营":"吴","定位":"辅助","品阶":"虎","武力":"18","统率":"46","智力":"82","速度":"66","武成长":"0.2","统成长":"1.2","智成长":"2.4","速成长":"1.3","特点":"","生平":"乔公的小女儿，史书里作桥。孙策和周瑜打下皖城，得了乔公两个女儿，孙策娶了姐姐，周瑜娶了妹妹。孙策拿这事逗周瑜：「桥公二女虽流离，得吾二人作婿，亦足为欢。」｜曹操南下时，诸葛亮在周瑜面前念曹植的《铜雀台赋》，念到「揽二乔于东南兮，乐朝夕之与共」。周瑜从座上跳起来，指着北方大骂。｜十一年后，周瑜在巴丘病故，她的名字在史书里再没出现过。"},{"名":"张昭","阵营":"吴","定位":"文臣","品阶":"虎","武力":"25","统率":"58","智力":"89","速度":"54","武成长":"0.3","统成长":"1.6","智成长":"2.5","速成长":"0.9","特点":"","生平":"孙策临死，把孙权托给张昭：「若仲谋不任事者，君便自取之。」孙权爱骑马射虎，有一回老虎扑上来抓住了马鞍。张昭变了脸色赶过来：「将军何有当尔？」孙权赶紧认错。｜后来孙权称帝，张昭举笏要称颂功德，孙权先开了口：「如张公之计，今已乞食矣。」张昭伏在地上，满身是汗。｜再后来为了公孙渊的事，两人闹翻，张昭称病不上朝。孙权叫人用土堵了他家大门，张昭在里面也拿土封上了。"},{"名":"张角","阵营":"无","定位":"文臣","品阶":"虎","武力":"36","统率":"54","智力":"92","速度":"58","武成长":"0.5","统成长":"1.3","智成长":"2.7","速成长":"1.0","特点":"大贤良师","生平":"钜鹿人，自称大贤良师。他拿符水给人治病，叫病人跪下叩头思过，病好了，就说是信道的缘故。十几年间，徒众几十万，遍布八州。｜他把徒众分成三十六方，放出话来：「苍天已死，黄天当立，岁在甲子，天下大吉。」洛阳的寺门和州郡官府的墙上，都有人用白土写上「甲子」两个字。｜中平元年，弟子唐周上书告发，马元义在洛阳车裂。张角连夜传令各方提前起事，人人头裹黄巾。"},{"名":"孟获","阵营":"无","定位":"武将","品阶":"虎","武力":"86","统率":"74","智力":"20","速度":"62","武成长":"2.4","统成长":"2.0","智成长":"0.3","速成长":"1.0","特点":"屡败屡战，统率厚","生平":"南中的豪帅，夷人汉人都服他。建兴三年诸葛亮南征，下令对他只许活捉。｜第一回捉住，诸葛亮领他在营阵间走了一圈，问他这支军怎么样。孟获答：「向者不知虚实，故败。今蒙赐观看营陈，若只如此，即定易胜耳。」诸葛亮笑了，放他回去再打。｜放了七回，捉了七回。第七回诸葛亮还要放，孟获不走了：「公，天威也，南人不复反矣。」"},{"名":"李傕","阵营":"汉","定位":"武将","品阶":"名","武力":"76","统率":"62","智力":"30","速度":"66","武成长":"1.9","统成长":"1.4","智成长":"0.5","速成长":"1.2","特点":"","生平":"北地人，董卓的部将。董卓死后，他和郭汜派人去长安求赦，王允不许。几个人商量着散伙，各自逃回凉州。｜贾诩拦住了他们：「诸君若弃军单行，则一亭长能束君矣。」于是收拢兵马，一路西进，打下了长安。献帝登上宣平门，李傕等人在城楼下伏地叩头。"},{"名":"郭汜","阵营":"汉","定位":"武将","品阶":"名","武力":"75","统率":"60","智力":"26","速度":"68","武成长":"1.9","统成长":"1.3","智成长":"0.4","速成长":"1.3","特点":"跟李傕一对","生平":"张掖人，早年在凉州做过盗马贼。｜董卓死后，他和李傕同掌长安，两人常在对方家里喝酒留宿。郭汜的妻子怕丈夫看上李家的婢妾，趁李傕送来饭菜，往里掺了豆豉，挑出来给他看，说是毒药。郭汜从此起了疑心。｜两家在长安城里打了几个月，死了上万人。李傕劫走天子，郭汜扣下公卿。"},{"名":"徐荣","阵营":"汉","定位":"武将","品阶":"名","武力":"74","统率":"68","智力":"52","速度":"64","武成长":"1.7","统成长":"1.7","智成长":"1.1","速成长":"1.1","特点":"正史里打赢过曹操孙坚，有谋略","生平":"玄菟人。公孙度能当上辽东太守，是他向董卓荐的。｜关东兵起，曹操追到荥阳汴水，迎面撞上徐荣，打了一整天，士卒死伤大半，曹操中了流矢，坐骑也伤了。同一年他又在梁县打败孙坚，孙坚把头上的赤罽帻摘给祖茂戴着，才脱了身。｜董卓死后，他奉命去新丰截击李傕，死在阵上。"},{"名":"韩遂","阵营":"汉","定位":"武将","品阶":"名","武力":"72","统率":"66","智力":"58","速度":"60","武成长":"1.5","统成长":"1.6","智成长":"1.3","速成长":"0.9","特点":"三十年不倒，老","生平":"金城人，本名韩约。凉州羌胡作乱，把他劫进军中，推他掌管军政。｜此后三十多年，他在凉州起起落落，和马腾结拜过兄弟，也杀过马腾的妻儿。潼关对阵，他和曹操在马上叙旧，拍手大笑。马超事后问他谈了什么，他答：「无所言也。」｜建安二十年，西平、金城的部将割下他的首级，送到了曹营。"},{"名":"麹义","阵营":"汉","定位":"武将","品阶":"名","武力":"78","统率":"64","智力":"40","速度":"70","武成长":"2.0","统成长":"1.4","智成长":"0.7","速成长":"1.4","特点":"先登死士","生平":"早年在凉州待过，熟悉羌人的打法，手下兵都骁勇。｜界桥之战，公孙瓒的骑兵冲过来，麹义叫八百步卒伏在盾牌下不动，等骑兵到了几十步，一齐跳起，扬尘大叫，千张强弩同时发射。严纲死在阵前，白马义从溃了。｜此后他仗着功劳越来越骄纵。袁绍把他召来杀了，收了他的兵。"},{"名":"高览","阵营":"汉","定位":"武将","品阶":"名","武力":"77","统率":"66","智力":"28","速度":"66","武成长":"1.9","统成长":"1.6","智成长":"0.4","速成长":"1.2","特点":"河北四庭柱末位","生平":"袁绍部将。官渡相持，曹操夜袭乌巢，张郃要去救，郭图主张攻曹营，袁绍派张郃、高览去打大营，没打下来。｜乌巢失守的消息传来，郭图在袁绍面前进谗，张郃害怕，和高览一起烧了攻营的器械，投了曹操。｜演义里他后来随曹操打汝南，一枪挑了刘辟，转头撞上赵云，没几个回合就死在枪下。"},{"名":"淳于琼","阵营":"汉","定位":"武将","品阶":"名","武力":"72","统率":"60","智力":"24","速度":"58","武成长":"1.6","统成长":"1.2","智成长":"0.3","速成长":"0.8","特点":"酒","生平":"字仲简，中平五年灵帝设西园八校尉，他和袁绍、曹操同在其列。｜官渡相持，袁绍派他领一万多人屯在乌巢看守粮车。演义里那天夜里他正和部将喝酒，醉倒在帐中。曹操带五千兵赶到，四下放火，他从帐里拖出来，割了耳朵、鼻子和手指，绑在马上放回袁营。｜袁绍见了，把他推出去斩了。"},{"名":"纪灵","阵营":"汉","定位":"武将","品阶":"名","武力":"78","统率":"62","智力":"22","速度":"64","武成长":"2.0","统成长":"1.3","智成长":"0.3","速成长":"1.1","特点":"三尖刀","生平":"袁术的大将，使一口三尖两刃刀。｜建安元年，他领三万步骑去打小沛的刘备。吕布赶来，把两边都请进营里喝酒，叫人在营门竖起一支戟：「诸君观布射戟小支，一发中者诸君当解去，不中可留决斗。」一箭正中小支，纪灵只好收兵。｜演义里他后来在徐州路上撞见张飞，不到十个回合，张飞一矛把他刺下了马。"},{"名":"蔡瑁","阵营":"汉","定位":"武将","品阶":"名","武力":"66","统率":"64","智力":"50","速度":"62","武成长":"1.5","统成长":"1.5","智成长":"1.2","速成长":"1.0","特点":"水军","生平":"襄阳人，刘表的后妻是他姐姐。他年轻时和曹操交好，后来曹操到了襄阳，还到他家见了他的妻儿。｜刘表病重，刘琦回来探病，蔡瑁、张允把他挡在门外，不让父子见面。刘表死后，他们拥立刘琮，举州降了曹操。｜演义里蒋干从周瑜营里偷回一封假信，曹操疑他和张允通敌，斩了。首级献上来，曹操才醒悟。"},{"名":"黄祖","阵营":"汉","定位":"武将","品阶":"名","武力":"68","统率":"66","智力":"36","速度":"58","武成长":"1.5","统成长":"1.6","智成长":"0.6","速成长":"0.9","特点":"守江夏","生平":"刘表的江夏太守。孙坚打刘表，追到岘山，黄祖的兵藏在竹林里放冷箭，射死了孙坚。｜从此孙家跟他结了仇。孙策打过他，孙权前后打了三回。甘宁在他手下多年不得重用，投了东吴，回头替孙权出主意打他。｜建安十三年江夏城破，黄祖一个人往外逃，骑兵冯则追上去，砍下了他的头。"},{"名":"朱儁","阵营":"汉","定位":"武将","品阶":"名","武力":"74","统率":"70","智力":"60","速度":"60","武成长":"1.6","统成长":"1.8","智成长":"1.3","速成长":"0.9","特点":"平黄巾的老将","生平":"会稽上虞人，家里贫寒，母亲靠贩缯过日子。｜黄巾起事，他和皇甫嵩一同出兵，围宛城，久攻不下，他在西南角擂鼓佯攻，自领五千精兵从东北角翻上了城头。｜董卓死后，李傕、郭汜请他进京做官。后来两人反目，他去劝和，郭汜把他扣在营里。他性子刚，当天就气得发病而死。"},{"名":"阎行","阵营":"汉","定位":"武将","品阶":"名","武力":"80","统率":"64","智力":"32","速度":"72","武成长":"2.2","统成长":"1.4","智成长":"0.5","速成长":"1.5","特点":"差点打死马超，名档武力顶格","生平":"金城人，字彦明，年轻时就以勇猛出名，在韩遂手下做将。｜韩遂和马腾反目那几年，阎行在阵上遇到马超，挺矛就刺，矛杆断了，他抡起断杆照马超的脖子砸下去，差点要了马超的命。｜韩遂把女儿嫁给了他。后来他还是带着家人往东投了曹操，封了列侯。"},{"名":"臧洪","阵营":"汉","定位":"武将","品阶":"名","武力":"70","统率":"68","智力":"54","速度":"60","武成长":"1.6","统成长":"1.9","智成长":"1.1","速成长":"0.9","特点":"死守东武阳，统率型","生平":"广陵射阳人。讨董的诸侯会盟，推来让去，最后请他登坛。他捧着血盘宣读盟辞，声泪俱下，连底下的马夫杂役都听得激昂起来。｜后来张超困在雍丘，他求袁绍发兵，袁绍不肯，张超满门被灭，他就此和袁绍翻了脸。｜袁绍围东武阳一年多，城里粮尽，他杀了自己的爱妾，煮给守城的兵吃。"},{"名":"丁原","阵营":"汉","定位":"武将","品阶":"名","武力":"72","统率":"66","智力":"40","速度":"62","武成长":"1.6","统成长":"1.6","智成长":"0.7","速成长":"1.0","特点":"","生平":"出身寒家，粗通武艺，做小吏时追捕盗贼，总冲在最前头。吕布跟着他，他待吕布很亲。｜董卓大宴百官，要废少帝，满座没人吭声，丁原推案站起，当面骂他。董卓拔剑要杀，看见丁原背后站着个人，手执方天画戟，瞪着他。｜过了几天，吕布牵回了董卓送的赤兔马，夜里提刀进了丁原的大帐。"},{"名":"吕玲绮","阵营":"汉","定位":"武将","品阶":"名","武力":"76","统率":"58","智力":"30","速度":"76","武成长":"2.1","统成长":"1.2","智成长":"0.5","速成长":"1.6","特点":"像她爹，快","生平":"吕布的女儿，玲绮这个名字是后人起的，史书上只记作「布女」。｜曹操围下邳那年，吕布要把她送去袁术那里换援兵。他拿棉絮把女儿周身缠好，绑在马背上，趁夜亲自护送出城，撞上曹军营垒，箭射过来冲不过去，只得回了城。｜民间传她自小跟父亲习武，马快戟快。"},{"名":"刘表","阵营":"汉","定位":"辅助","品阶":"名","武力":"40","统率":"66","智力":"74","速度":"52","武成长":"0.5","统成长":"1.6","智成长":"2.0","速成长":"0.8","特点":"坐守","生平":"山阳高平人，年轻时列名「八俊」，身长八尺有余。｜初平元年他受命做荆州刺史，那时路途不通，他单人匹马进了宜城，请来蒯良、蒯越、蔡瑁商量对策，不多久就把荆州收拾停当。｜北方打成一团的那些年，他在荆州开学官，收流民。官渡相持，袁绍派人来求援，他答应了，兵却一直没发。"},{"名":"刘璋","阵营":"汉","定位":"辅助","品阶":"名","武力":"35","统率":"58","智力":"68","速度":"50","武成长":"0.4","统成长":"1.2","智成长":"1.8","速成长":"0.8","特点":"暗弱，成长垫底","生平":"刘焉的小儿子。刘焉死后，益州的大吏看他性子宽柔，推他接了班。｜听说曹操要打汉中，他派法正去荆州迎刘备。黄权劝他，他把黄权调出去做县长；王累把自己倒吊在城门上劝谏，他也没听。｜刘备围成都时，城里还有三万精兵、一年的粮。他开了城门：「父子在州二十余年，无恩德以加百姓。」"},{"名":"袁术","阵营":"汉","定位":"辅助","品阶":"名","武力":"48","统率":"60","智力":"66","速度":"54","武成长":"0.7","统成长":"1.3","智成长":"1.7","速成长":"0.9","特点":"","生平":"汝南袁家的嫡子，年轻时以侠气出名，常和一帮公子哥飞鹰走狗。｜建安二年，他在寿春称帝。两年后兵粮耗尽，想北上投袁绍，刘备在徐州截住他，只得退回江亭。｜那时是六月天，厨下只剩三十斛麦屑。他要一碗蜜水解渴，没有。他在床上坐了半晌，大叫一声：「袁术至于此乎！」吐了一斗多血。"},{"名":"陶谦","阵营":"汉","定位":"辅助","品阶":"名","武力":"38","统率":"62","智力":"70","速度":"50","武成长":"0.4","统成长":"1.5","智成长":"1.9","速成长":"0.8","特点":"","生平":"丹阳人，年少时不守规矩，十四岁还拿布条做旗，骑着竹马跟小孩玩。同县的甘公出门撞见他，看他相貌不凡，把女儿许给了他。｜后来他做了徐州牧。曹操的父亲曹嵩在徐州境内遇害，曹操两次东征，泗水里堆满了尸首，水都流不动。｜陶谦病重，对别驾麋竺交代：「非刘备不能安此州也。」"},{"名":"汉献帝","阵营":"汉","定位":"辅助","品阶":"名","武力":"30","统率":"60","智力":"72","速度":"54","武成长":"0.3","统成长":"1.5","智成长":"2.1","速成长":"0.9","特点":"","生平":"名协，灵帝的次子，九岁那年董卓把他扶上了皇位。｜长安大乱，他一路往东逃。渡黄河时，百官攀着船舷，船上的人拿刀乱砍，舱里的断指能一把一把捧起来。回到洛阳，宫殿烧光了，尚书郎以下自己出城挖野谷。｜在许都做了二十多年天子。延康元年，他把皇位让给曹丕，出京做了山阳公，又活了十四年。"},{"名":"董承","阵营":"汉","定位":"辅助","品阶":"名","武力":"52","统率":"60","智力":"66","速度":"56","武成长":"0.9","统成长":"1.4","智成长":"1.8","速成长":"0.9","特点":"","生平":"董太后的侄子。献帝东归，他一路护驾，后来女儿进宫做了贵人。｜建安四年，他自称受了献帝藏在衣带里的密诏，和刘备、种辑、吴子兰、王子服等人商议除掉曹操。刘备没等动手，就出了许都。｜第二年正月，事情泄露，曹操杀了董承等人，夷了三族。董贵人那时怀着身孕，献帝几次求情，曹操没松口。"},{"名":"吉平","阵营":"汉","定位":"辅助","品阶":"名","武力":"36","统率":"52","智力":"76","速度":"58","武成长":"0.4","统成长":"1.1","智成长":"2.2","速成长":"1.0","特点":"太医","生平":"演义里叫吉太，字称平，是许都的太医。他和董承密谋除掉曹操，咬下一根手指立誓。｜曹操犯了头风，召他去下药，他在药里下了毒。曹操让他先尝，他扯住曹操的耳朵往里灌。家奴早就告了密，甲士一拥而上。｜他挨了几番拷打，九根手指截了，又要割舌头。他求松绑，朝宫城拜了拜，一头撞在台阶上。"},{"名":"刘虞","阵营":"汉","定位":"辅助","品阶":"名","武力":"38","统率":"66","智力":"76","速度":"52","武成长":"0.4","统成长":"1.7","智成长":"2.1","速成长":"0.8","特点":"仁政","生平":"东海郯人。做幽州牧时穿旧衣草鞋。他开上谷的胡市，通渔阳的盐铁，青州、徐州逃来的百多万人都在幽州落了脚。｜初平四年，他领十万兵攻公孙瓒，下令「无伤余人，杀一伯珪而已」，兵士缩手缩脚，大败。｜公孙瓒把他押到蓟城的集市上祷告：他若该做天子，天就下雨救他。那天是个大旱天。"},{"名":"许劭","阵营":"汉","定位":"辅助","品阶":"名","武力":"30","统率":"54","智力":"78","速度":"56","武成长":"0.3","统成长":"1.2","智成长":"2.3","速成长":"0.9","特点":"月旦评","生平":"汝南平舆人，和堂兄许靖每月初一品评乡里人物，汝南人管这叫「月旦评」。｜曹操年轻时带着厚礼去求一句评语，许劭不肯开口。曹操再三追问，他才答：「子治世之能臣，乱世之奸雄。」曹操大笑而去。｜后来他避乱到了徐州，陶谦待他很厚，他却收拾行装走了。没过多久，陶谦把寄居徐州的士人都抓了起来。"},{"名":"曹节","阵营":"汉","定位":"辅助","品阶":"名","武力":"32","统率":"58","智力":"74","速度":"60","武成长":"0.3","统成长":"1.4","智成长":"2.0","速成长":"1.0","特点":"掷玺","生平":"曹操的女儿。建安十八年，她和两个姐妹一起入宫做了献帝的贵人，伏皇后死后，她册立为皇后。｜延康元年，曹丕受禅，派人进宫索要玉玺。她几次不给，最后把使者叫进来当面数落，抬手把玺摔到栏杆底下，流着泪骂：「天不祚尔！」左右没人敢抬头。｜献帝做了山阳公，她跟着出了京城。"},{"名":"张鲁","阵营":"汉","定位":"文臣","品阶":"名","武力":"40","统率":"56","智力":"78","速度":"54","武成长":"0.6","统成长":"1.3","智成长":"2.1","速成长":"0.9","特点":"五斗米道","生平":"沛国丰人，祖父张陵在蜀中鹄鸣山学道，入道的人要交五斗米。｜他在汉中割据将近三十年，不设长吏，用祭酒治民。路口修了义舍，放着米肉，过路的人量着肚子取，据说多拿要得鬼病。｜曹操打下阳平关，他往巴中撤。手下要烧仓库，他拦住：「本欲归命国家，而意未达。」封好库门才走。"},{"名":"孔融","阵营":"汉","定位":"文臣","品阶":"名","武力":"34","统率":"52","智力":"80","速度":"56","武成长":"0.4","统成长":"1.1","智成长":"2.1","速成长":"0.9","特点":"","生平":"孔子二十世孙。十岁时去见河南尹李膺，自称世交：「先君孔子与君先人李老君同德比义，而相师友。」陈韪不以为然：「小时了了，大未必佳。」孔融接口：「想君小时，必当了了。」｜后来在北海做相，袁谭攻城，流矢满天，他靠着几案读书，谈笑如常。｜建安十三年，他死在曹操刀下，两个孩子也没能保住。"},{"名":"卢植","阵营":"汉","定位":"文臣","品阶":"名","武力":"50","统率":"60","智力":"80","速度":"58","武成长":"0.8","统成长":"1.5","智成长":"2.1","速成长":"0.9","特点":"儒将","生平":"涿郡涿县人，身长八尺二寸，声如洪钟。年轻时拜在马融门下，马融家常有女乐在堂前歌舞，他在那里听讲几年，眼睛没往那边斜过一回。｜黄巾起事，他把张角围在广宗，眼看要破城。宦官左丰讨贿赂不成，回京告了他一状，他坐着囚车回了洛阳。｜董卓要废少帝，百官都不作声，只有卢植出列反对。"},{"名":"审配","阵营":"汉","定位":"文臣","品阶":"名","武力":"42","统率":"60","智力":"78","速度":"52","武成长":"0.6","统成长":"1.6","智成长":"2.0","速成长":"0.8","特点":"死守邺城，统率成长文臣里偏高","生平":"魏郡人，替袁绍管后方。袁绍死后，他拥立了袁尚。｜建安九年，曹操围邺城，挖了四十里长的壕沟，引漳水灌城，城里饿死了一大半。审配守了几个月，侄子审荣夜里打开东门，放曹军进了城。｜审配巷战时被擒，押去见曹操，辛毗跟在后面拿马鞭抽他的头。临刑前，他叫刽子手让他面朝北：「我君在北。」"},{"名":"逢纪","阵营":"汉","定位":"文臣","品阶":"名","武力":"30","统率":"50","智力":"76","速度":"54","武成长":"0.3","统成长":"1.0","智成长":"2.0","速成长":"0.9","特点":"","生平":"南阳人，袁绍起兵时就跟着，出主意让袁绍诈取冀州。｜官渡兵败，袁绍说没脸见田丰。逢纪在一旁接话：「丰闻将军之退，拊手大笑，喜其言之中也。」袁绍回到邺城，先杀了田丰。｜袁绍死后，他跟了袁尚，袁尚派他去袁谭军中监军。袁谭要兵，袁尚不给，袁谭一怒之下杀了他。"},{"名":"郭图","阵营":"汉","定位":"文臣","品阶":"名","武力":"30","统率":"48","智力":"74","速度":"56","武成长":"0.3","统成长":"0.9","智成长":"1.9","速成长":"0.9","特点":"坑，成长垫底","生平":"颍川人，袁绍的谋士。官渡之战，曹操夜袭乌巢，张郃要去救，郭图主张直捣曹营，袁绍听了他的。大营没攻下来，乌巢也丢了，郭图反说张郃幸灾乐祸，张郃干脆降了曹操。｜袁绍死后，他跟着袁谭，挑唆袁谭和弟弟袁尚动刀兵。建安十年曹操破南皮，他和袁谭死在一处。"},{"名":"许攸","阵营":"汉","定位":"文臣","品阶":"名","武力":"32","统率":"50","智力":"82","速度":"60","武成长":"0.3","统成长":"1.0","智成长":"2.2","速成长":"1.0","特点":"夜奔","生平":"南阳人，年轻时和袁绍、曹操都有交情。｜官渡相持，他的计策袁绍不用，家人又在邺城犯法下了狱。他连夜投奔曹营。曹操光着脚出来迎：「子远，卿来，吾事济矣！」许攸告诉他乌巢屯粮，守备松懈。｜打下冀州后，每逢酒席，他总叫曹操的小名：「阿瞒，卿非吾，不得冀州也。」没多久，曹操把他收押杀了。"},{"名":"蹇硕","阵营":"汉","定位":"文臣","品阶":"名","武力":"44","统率":"54","智力":"72","速度":"56","武成长":"0.7","统成长":"1.2","智成长":"1.9","速成长":"0.9","特点":"十常侍","生平":"小黄门出身，身强体壮，懂些兵事，灵帝很宠信他。他叔父夜里犯禁，曹操那时做北部尉，一顿五色棒把人打死了。｜中平五年设西园八校尉，蹇硕做上军校尉，连大将军何进也归他节制。灵帝死后，他想先杀何进，再立刘协。何进进宫走到半路，蹇硕的司马潘隐迎上来使了个眼色，何进掉头抄小路跑回军营。"},{"名":"祢衡","阵营":"汉","定位":"文臣","品阶":"名","武力":"30","统率":"46","智力":"84","速度":"62","武成长":"0.3","统成长":"0.8","智成长":"2.3","速成长":"1.1","特点":"嘴最硬，统率最薄","生平":"平原般县人。到许都时，怀里揣着一块名刺，找不到值得投的人，字都磨没了。｜曹操叫他做鼓吏。宾客满堂，他走到曹操跟前，当众脱光衣服，再慢慢换上鼓吏的衣裳，击了一曲《渔阳》，脸色不变。｜曹操把他送给刘表，刘表转送江夏的黄祖。在黄祖船上，他骂黄祖「死公」，黄祖把他杀了。那年他二十六。"},{"名":"蒯良","阵营":"汉","定位":"文臣","品阶":"名","武力":"32","统率":"56","智力":"82","速度":"54","武成长":"0.3","统成长":"1.4","智成长":"2.2","速成长":"0.9","特点":"","生平":"南郡中庐人，蒯越的兄长。刘表初到荆州，找他们兄弟问计。蒯良主张：「众不附者，仁不足也；附而不治者，义不足也。」蒯越主张用权谋。｜刘表听完：「子柔之言，雍季之论也；异度之计，臼犯之谋也。」｜演义里孙坚追黄祖，是蒯良的主意，叫吕公在岘山伏下弓弩，滚石砸死了孙坚。"},{"名":"蒯越","阵营":"汉","定位":"文臣","品阶":"名","武力":"38","统率":"58","智力":"80","速度":"56","武成长":"0.5","统成长":"1.5","智成长":"2.1","速成长":"0.9","特点":"","生平":"蒯良的弟弟，字异度。刘表初到荆州，他设宴诱来宗贼头目五十五人，一并斩了，收编了他们的部众。｜刘表死后，他劝刘琮归降。曹操到了荆州，写信给荀彧：「不喜得荆州，喜得蒯异度耳。」｜建安十九年他病重，写信托曹操照看家门。曹操回信：「死者反生，生者不愧。」"},{"名":"曹洪","阵营":"魏","定位":"武将","品阶":"名","武力":"78","统率":"64","智力":"30","速度":"68","武成长":"2.0","统成长":"1.5","智成长":"0.5","速成长":"1.2","特点":"","生平":"曹操的堂弟。汴水一战，曹操的马伤了，追兵在后，曹洪跳下马让给他。曹操不肯，曹洪：「天下可无洪，不可无君。」他步行跟着，找到船一起过了河。｜他家富，人却吝啬。曹丕做太子时向他借绢，他没借。｜曹丕即位，找由头把他下狱要杀。卞太后放话，曹洪今天死，明天就叫皇帝废了郭皇后。曹洪这才免死。"},{"名":"曹休","阵营":"魏","定位":"武将","品阶":"名","武力":"76","统率":"66","智力":"42","速度":"70","武成长":"1.9","统成长":"1.6","智成长":"0.8","速成长":"1.3","特点":"千里驹","生平":"曹操的族子。十几岁时父亲死了，他和一个门客抬着棺材草草下葬，带着老母渡江去了吴地。听说曹操起兵，他改名换姓，从荆州抄小路北上。曹操指着他：「此吾家千里驹也。」｜太和二年，周鲂送来降书，他领兵深入到石亭，陆逊三路夹攻，他大败而回。｜回来没多久，背上的毒疮发作，死在任上。"},{"名":"曹纯","阵营":"魏","定位":"武将","品阶":"名","武力":"74","统率":"62","智力":"44","速度":"76","武成长":"1.8","统成长":"1.4","智成长":"0.9","速成长":"1.6","特点":"虎豹骑，快","生平":"曹仁的弟弟，十八岁做黄门侍郎。家里僮仆几百，他管得井井有条。｜他统领虎豹骑，这支兵都是百人里挑出来的。南皮一战，他麾下的骑兵斩了袁谭。长坂坡追刘备，他截下了刘备的两个女儿和辎重。｜建安十五年他死后，曹操找人接管虎豹骑，挑来挑去：「纯之比，何可复得！吾独不中督邪？」最后自己统领。"},{"名":"夏侯尚","阵营":"魏","定位":"武将","品阶":"名","武力":"72","统率":"64","智力":"46","速度":"66","武成长":"1.7","统成长":"1.5","智成长":"1.0","速成长":"1.1","特点":"","生平":"夏侯渊的侄子，和曹丕自小交好。后来做荆州牧，攻江陵时夜里派兵驾着油船，把吴军的船烧了。｜他宠爱一个小妾，冷落了正妻，正妻是曹家的女儿。曹丕派人把那小妾绞死。夏侯尚病得恍恍惚惚，埋了又挖出来看。曹丕骂他：「杜袭之轻薄尚，良有以也。」"},{"名":"李典","阵营":"魏","定位":"武将","品阶":"名","武力":"72","统率":"68","智力":"58","速度":"64","武成长":"1.6","统成长":"1.8","智成长":"1.3","速成长":"1.0","特点":"儒将","生平":"山阳钜野人，年轻时好学，不喜欢兵事，拜师读《春秋左氏传》。后来领着宗族部曲一万三千多口迁到邺城。｜合肥那年，张辽要出城迎击孙权。李典平日和张辽不和，这时开口：「此国家大事，顾君计何如耳，吾可以私憾而忘公义乎！」他跟张辽一道杀出城去。"},{"名":"臧霸","阵营":"魏","定位":"武将","品阶":"名","武力":"76","统率":"66","智力":"34","速度":"66","武成长":"1.9","统成长":"1.6","智成长":"0.5","速成长":"1.2","特点":"","生平":"泰山华县人。父亲做县里的狱掾，不肯照太守的意思杀人，太守把他抓了往郡里押。臧霸那年十八，带着几十个门客在费县西山截下囚车，救出父亲，一家逃到了东海。｜后来他归了曹操。曹操要他交出投奔来的旧识，他回话：「霸所以能自立者，以不为此也。」曹操没再追究。"},{"名":"文聘","阵营":"魏","定位":"武将","品阶":"名","武力":"72","统率":"70","智力":"48","速度":"62","武成长":"1.6","统成长":"1.9","智成长":"1.0","速成长":"1.0","特点":"守江夏","生平":"南阳宛人，刘表的大将，守荆州北面。刘琮降曹，叫他同去，他不肯：「聘不能全州，当待罪而已。」｜曹操过了汉水，他才来见。曹操问他为何来得晚，他答：「今日至此，实怀悲惭，无颜早见耳。」泪流不止。｜后来他守江夏几十年。孙权五万兵围石阳，大雨冲垮了城栅，他躺着不出来。孙权疑心有伏兵，退了。"},{"名":"文鸯","阵营":"魏","定位":"武将","品阶":"名","武力":"80","统率":"62","智力":"28","速度":"76","武成长":"2.2","统成长":"1.3","智成长":"0.4","速成长":"1.6","特点":"名档武力顶格，十八岁","生平":"毌丘俭、文钦在寿春起兵，文鸯是文钦的儿子，那年十八岁。｜司马师大军压来，他跟父亲约好夜里两路夹击，自己带人摸到营外擂鼓呐喊，父亲那一路始终没到。天亮退兵，魏军骑兵追上来，他单骑折回，冲进追兵里杀了百余人，来回六七趟才走。｜那一夜，司马师眼上的瘤子迸裂了。"},{"名":"郝昭","阵营":"魏","定位":"武将","品阶":"名","武力":"68","统率":"72","智力":"52","速度":"58","武成长":"1.5","统成长":"2.0","智成长":"1.1","速成长":"0.8","特点":"守陈仓，统率型","生平":"诸葛亮带几万人围陈仓，城里只有郝昭一千多兵。亮派他的同乡靳详到城下劝降，郝昭在楼上答：「我之为人，卿所知也。卿还谢诸葛，便可攻也。」｜蜀军架云梯，他射火箭；推冲车，他拿绳子吊着石磨往下砸；挖地道，他在城里横着挖沟截断。攻了二十多天，诸葛亮粮尽退兵。"},{"名":"王双","阵营":"魏","定位":"武将","品阶":"名","武力":"79","统率":"60","智力":"18","速度":"64","武成长":"2.1","统成长":"1.3","智成长":"0.3","速成长":"1.1","特点":"流星锤","生平":"陇西狄道人，使六十斤大刀，腰里还藏着流星锤。｜陈仓城下，他几个回合砍了蜀将谢雄，又斩了龚起。张嶷追他，吃了他回身一锤。｜诸葛亮退兵，他领骑兵紧追，忽见营寨背后火起，拨马回救，魏延从旁杀出，一刀把他砍下马。"},{"名":"陈泰","阵营":"魏","定位":"武将","品阶":"名","武力":"72","统率":"68","智力":"56","速度":"64","武成长":"1.6","统成长":"1.7","智成长":"1.2","速成长":"1.0","特点":"","生平":"陈群的儿子。姜维围狄道，他领兵翻过高城岭，夜里到了狄道东南的山上，遍举烽火，鸣鼓吹角，姜维解围走了。｜高贵乡公死在车下，司马昭召他来问怎么办，他答：「独有斩贾充，少可以谢天下耳。」司马昭要他再想想别的，他答：「泰言惟有进于此，不知其次。」"},{"名":"王濬","阵营":"魏","定位":"武将","品阶":"名","武力":"70","统率":"68","智力":"60","速度":"62","武成长":"1.6","统成长":"1.7","智成长":"1.4","速成长":"1.0","特点":"楼船","生平":"在益州造船，连起来的大船方一百二十步，装得下两千多人，船上起楼，能跑马。削下的木片漂到下游，吴国建平太守吾彦捞起来送给孙皓。｜吴人在江里拦了铁锁，水下插满铁锥。王濬放几十个大筏，扎上披甲的草人在前头挂走铁锥，再点起灌了麻油的火炬烧熔铁锁。船开到石头城下，孙皓把自己绑了出来投降。"},{"名":"李进","阵营":"魏","定位":"武将","品阶":"名","武力":"78","统率":"62","智力":"26","速度":"70","武成长":"2.1","统成长":"1.3","智成长":"0.4","速成长":"1.4","特点":"打跑吕布的县豪强","生平":"兖州乘氏县人，县里的豪强。｜兴平元年，吕布趁曹操东征陶谦，拿下兖州大半，领兵屯在乘氏。李进聚起县里的人跟他打了一仗，吕布败了，往东退到山阳。｜《吕布传》里就这一句，打完这一仗他去了哪里，没人记下。"},{"名":"阎柔","阵营":"魏","定位":"武将","品阶":"名","武力":"72","统率":"64","智力":"50","速度":"72","武成长":"1.7","统成长":"1.5","智成长":"1.0","速成长":"1.5","特点":"胡骑","生平":"广阳人，小时候落在乌桓、鲜卑手里，在草原上长大，那边的部落反倒都信服他。｜后来他借鲜卑的兵杀了护乌桓校尉邢举，自己坐了那个位子。袁绍拉拢他，曹操平了河北，他带着部众来归，仍旧做护乌桓校尉。曹操待他如同儿子。"},{"名":"王异","阵营":"魏","定位":"武将","品阶":"名","武力":"70","统率":"70","智力":"48","速度":"60","武成长":"1.5","统成长":"2.0","智成长":"1.0","速成长":"0.9","特点":"守城，统率型","生平":"赵昂的妻子。马超围冀城，她披上甲上城，把身上的首饰、箱里的衣裳全拿出来分给守城的兵。｜冀城降了，儿子赵月押在马超那里做人质。赵昂和杨阜谋划起兵，回家问她，她答：「忠义立于身，雪君父之大耻，丧元不足为重，况一子哉？」"},{"名":"司马师","阵营":"魏","定位":"文臣","品阶":"名","武力":"50","统率":"60","智力":"82","速度":"58","武成长":"0.8","统成长":"1.5","智成长":"2.2","速成长":"0.9","特点":"","生平":"司马懿的长子。父子谋诛曹爽，他私下养了三千死士，散在民间。起事那天早上，这些人一齐聚到司马门，外人不知是从哪里冒出来的。｜前一夜，司马懿派人去看两个儿子，司马昭翻来覆去睡不着，司马师睡得照常安稳。"},{"名":"司马昭","阵营":"魏","定位":"文臣","品阶":"名","武力":"46","统率":"58","智力":"80","速度":"60","武成长":"0.7","统成长":"1.4","智成长":"2.1","速成长":"1.0","特点":"","生平":"兄长死在许昌，兵权交到了他手里。｜曹髦召来王沈、王经、王业：「司马昭之心，路人所知也。」领着宫中几百僮仆冲出去讨他。贾充带兵迎上，成济一戈刺穿了皇帝。｜他后来派钟会、邓艾伐蜀，受封晋王，到死也没登上那个位子。"},{"名":"满宠","阵营":"魏","定位":"文臣","品阶":"名","武力":"44","统率":"62","智力":"78","速度":"54","武成长":"0.6","统成长":"1.6","智成长":"2.0","速成长":"0.8","特点":"酷吏","生平":"做许县县令的时候，曹洪的门客在县里屡次犯法，满宠一概拘捕。曹洪去找曹操，曹操召许县官吏问话，满宠料到要放人，抢先把犯人杀了。｜杨彪下狱，荀彧、孔融都托他别用刑，他照样拷打，审完禀告曹操：「杨彪考讯无他辞语。」曹操当天放了杨彪。"},{"名":"刘晔","阵营":"魏","定位":"文臣","品阶":"名","武力":"36","统率":"52","智力":"82","速度":"56","武成长":"0.4","统成长":"1.1","智成长":"2.2","速成长":"0.9","特点":"霹雳车","生平":"光武帝的后人。七岁那年母亲临终嘱咐：家里有个近侍是奸人，你长大了除掉他。刘晔十三岁，提刀进屋把那人杀了。｜官渡两军相持，袁绍筑土山往曹营射箭，刘晔献计造发石车，石头飞过去，把袁军的楼橹全打塌了，袁军管这叫霹雳车。"},{"名":"王朗","阵营":"魏","定位":"文臣","品阶":"名","武力":"34","统率":"56","智力":"76","速度":"50","武成长":"0.3","统成长":"1.3","智成长":"1.9","速成长":"0.8","特点":"","生平":"东海郯人，做会稽太守时孙策打过来，他兵败投降。｜乘船避乱，有人求搭船，华歆犹豫，王朗答应了。贼追近了，王朗要把那人丢下，华歆不肯：「既已纳其自托，宁可以急相弃邪？」｜七十六岁随曹真出征，阵前劝诸葛亮投降。诸葛亮骂他「皓首匹夫，苍髯老贼」，他大叫一声，撞死在马下。"},{"名":"华歆","阵营":"魏","定位":"文臣","品阶":"名","武力":"32","统率":"54","智力":"78","速度":"54","武成长":"0.3","统成长":"1.2","智成长":"2.0","速成长":"0.9","特点":"","生平":"年轻时和管宁在园子里锄菜，地里翻出一块金子，管宁照锄不误，华歆拾起来看了看才扔掉。门外过一辆高官的车，管宁读书如故，华歆放下书跑出去看。管宁把两人同坐的席子割开：「子非吾友也。」｜后来曹操要废伏皇后，华歆带兵进宫，破开夹墙，揪着头发把皇后拖了出来。"},{"名":"杜预","阵营":"魏","定位":"文臣","品阶":"名","武力":"48","统率":"62","智力":"84","速度":"58","武成长":"0.7","统成长":"1.6","智成长":"2.3","速成长":"0.9","特点":"破竹，文臣里能带兵","生平":"不会骑马，射箭穿不透铠甲的札叶，做到了镇南大将军。平日书不离手，自称有《左传》癖。｜攻江陵时，城里的人知道他脖子上长瘿，把葫芦挂在狗脖子上给他看，又把树瘤削白了写上「杜预颈」。城破，他把这些人都杀了。｜众将劝他等来年再打，他答：「今兵威已振，譬如破竹，数节之后，皆迎刃而解。」"},{"名":"杨阜","阵营":"魏","定位":"文臣","品阶":"名","武力":"46","统率":"60","智力":"80","速度":"56","武成长":"0.7","统成长":"1.5","智成长":"2.1","速成长":"0.9","特点":"反攻马超","生平":"天水冀城人。马超攻冀城，他领着宗族子弟从正月守到八月，城里还是开门降了，刺史韦康死在马超手里。｜他借口妻子过世请假，去历城见表兄姜叙，一进门就哭。姜叙的母亲催着儿子起兵。｜后来跟马超交战，他身上受了五处伤，同族兄弟战死七个。"},{"名":"马钧","阵营":"魏","定位":"文臣","品阶":"名","武力":"30","统率":"48","智力":"82","速度":"52","武成长":"0.3","统成长":"0.9","智成长":"2.3","速成长":"0.8","特点":"机关","生平":"扶风人，口吃，不善言辞，在朝里做个小官。｜朝中争论古书上的指南车，高堂隆、秦朗都不信能造出来，拿他取笑。他不辩，奉诏回去，把车造了出来。｜京城有块坡地没法浇水，他做了架翻车，小孩子都转得动，水自己往上走。"},{"名":"管辂","阵营":"魏","定位":"文臣","品阶":"名","武力":"26","统率":"46","智力":"84","速度":"58","武成长":"0.2","统成长":"0.8","智成长":"2.3","速成长":"1.0","特点":"神卜","生平":"平原人，小时候夜里不睡，看着星星问大人天上的名字。｜何晏请他卜卦，问自己能不能做到三公，又问梦见几十只青蝇落在鼻子上，赶也赶不走。邓飏在旁边听他讲完，嫌是老生常谈。｜舅舅怪他话太直，管辂答：「与死人语，何所畏邪？」过了年，何晏、邓飏都死在高平陵之变里。"},{"名":"杨修","阵营":"魏","定位":"文臣","品阶":"名","武力":"32","统率":"50","智力":"84","速度":"62","武成长":"0.3","统成长":"1.0","智成长":"2.2","速成长":"1.1","特点":"聪明，命短：成长压一点","生平":"随曹操过曹娥碑，碑阴八个字「黄绢幼妇，外孙齑臼」。曹操骑马走出三十里才想通，杨修在碑前就解出来了。｜汉中相持，夜里的口令是「鸡肋」。杨修叫随从收拾行装，旁人问，他答：「食之无肉，弃之有味。」曹操以惑乱军心为由，把他斩了。"},{"名":"陈登","阵营":"魏","定位":"文臣","品阶":"名","武力":"54","统率":"62","智力":"80","速度":"58","武成长":"1.0","统成长":"1.6","智成长":"2.1","速成长":"0.9","特点":"湖海之士，文臣里能打","生平":"许汜在刘表席上抱怨：当年去下邳见陈登，陈登不讲主客之礼，自己睡大床，叫他睡下床。｜刘备听完接过话头：天下大乱，你求田问舍，要是换了我，就睡百尺楼上，让你睡地下。｜陈登爱吃生鱼脍，华佗替他治过一回，叮嘱三年后还会发作。到期病发，华佗不在，他没挺过去，年三十九。"},{"名":"陈群","阵营":"魏","定位":"辅助","品阶":"名","武力":"36","统率":"62","智力":"76","速度":"54","武成长":"0.4","统成长":"1.5","智成长":"2.1","速成长":"0.9","特点":"","生平":"颍川许昌人，小时候跟堂兄弟陈忠争谁的父亲功德高，吵到祖父陈寔跟前。陈寔答：「元方难为兄，季方难为弟。」｜刘备在豫州时请他做别驾，要去接徐州，他劝别去，刘备没听，徐州果然丢了。｜入魏后他定下九品官人法，州郡设中正，按品第给士人定等。"},{"名":"钟繇","阵营":"魏","定位":"辅助","品阶":"名","武力":"34","统率":"60","智力":"74","速度":"52","武成长":"0.4","统成长":"1.4","智成长":"2.0","速成长":"0.8","特点":"","生平":"颍川长社人，写得一手好字。｜曹操在官渡跟袁绍相持，钟繇从关中送去两千多匹马。曹操回信：「昔萧何镇守关中，足食成军，亦适当尔。」｜传说他见韦诞藏着蔡邕的笔法，求而不得，捶胸捶到吐血。等韦诞死了，他叫人掘开韦诞的墓，把书取了出来。"},{"名":"羊祜","阵营":"魏","定位":"辅助","品阶":"名","武力":"46","统率":"64","智力":"78","速度":"56","武成长":"0.7","统成长":"1.6","智成长":"2.2","速成长":"0.9","特点":"","生平":"镇守襄阳，平日穿着轻裘，腰带松松地系着，身上不披甲，帐前侍卫不过十几个。｜对面是吴国的陆抗。陆抗送来酒，他端起就喝；陆抗病了，他送去药，陆抗也照服。｜他死后，襄阳人在岘山他常去游玩的地方立了块碑，来看碑的人都落泪，杜预给碑起名叫堕泪碑。"},{"名":"曹丕","阵营":"魏","定位":"辅助","品阶":"名","武力":"54","统率":"62","智力":"74","速度":"60","武成长":"0.9","统成长":"1.4","智成长":"2.0","速成长":"1.0","特点":"会剑","生平":"曹操的次子。酒席上听奋威将军邓展谈剑术，不服，两人拿甘蔗当剑下殿比试，他三次打中邓展的手臂。邓展要再比，他佯作深进，一杖正中邓展的额头。｜王粲下葬那天，他对同去的人道：「王好驴鸣，可各作一声以送之。」满座学了一声驴叫。"},{"名":"甄姬","阵营":"魏","定位":"辅助","品阶":"名","武力":"28","统率":"52","智力":"76","速度":"58","武成长":"0.3","统成长":"1.1","智成长":"2.1","速成长":"1.0","特点":"","生平":"中山无极人，嫁给袁绍的次子袁熙。邺城破的那天，曹丕进了袁家内室，见她披散着头发遮住脸，伏在婆婆刘氏膝上。曹丕叫她抬起头来。｜后来她做了魏文帝的夫人，失宠后有怨言，被赐死。下葬时头发披着盖在脸上，嘴里塞满了米糠。"},{"名":"田畴","阵营":"魏","定位":"辅助","品阶":"名","武力":"44","统率":"60","智力":"76","速度":"60","武成长":"0.6","统成长":"1.5","智成长":"2.0","速成长":"1.1","特点":"向导","生平":"刘虞死后，他到刘虞墓前摆上祭品哭了一场，随后带着宗族进了徐无山，几年间来投的有五千多家。｜曹操北征乌桓，夏天大水，海边的路走不通。大军撤走时在路边立了块木牌：「方今暑夏，道路不通，且俟秋冬，乃复进军。」田畴领着人马出卢龙塞，走荒废多年的旧道，填谷开山五百多里。"},{"名":"张春华","阵营":"魏","定位":"辅助","品阶":"名","武力":"40","统率":"62","智力":"78","速度":"54","武成长":"0.5","统成长":"1.6","智成长":"2.1","速成长":"0.9","特点":"","生平":"司马懿推说得了风痹，不肯出来给曹操做事。有天晒书，忽然下雨，他顾不上装病，自己起身去收。家里一个婢女看见了，张春华亲手杀了她，从此自己下厨做饭。｜司马懿晚年卧病，她去探望，司马懿骂：「老物可憎，何烦出也！」她回去就不吃饭，几个儿子跟着一起绝食。司马懿只好去赔不是。"},{"名":"廖化","阵营":"蜀","定位":"武将","品阶":"名","武力":"72","统率":"66","智力":"42","速度":"64","武成长":"1.7","统成长":"1.6","智成长":"0.8","速成长":"1.1","特点":"活得久，成长稳","生平":"襄阳人，本名淳，在关羽手下做主簿。｜关羽败亡，他落在吴人手里，一心要回去，就诈称病死，旁人都信了。他背着老母亲日夜往西走，在秭归撞上东征的刘备。｜此后又活了四十多年。蜀亡，他随众迁往洛阳，没走到就病故在路上。"},{"名":"周仓","阵营":"蜀","定位":"武将","品阶":"名","武力":"78","统率":"64","智力":"18","速度":"62","武成长":"2.1","统成长":"1.5","智成长":"0.3","速成长":"1.0","特点":"扛刀","生平":"关西人，两臂有千斤力气，板肋虬髯，原在卧牛山落草。关羽过关时他拜在马前，从此步行扛刀。｜单刀赴会，他捧刀站在关羽身后。鲁肃席上讨荆州，他在阶下插了一句：「天下土地，惟有德者居之。」关羽夺过刀，喝他出去。｜关羽父子的死讯传到麦城，他拔剑自刎。"},{"名":"吴懿","阵营":"蜀","定位":"武将","品阶":"名","武力":"72","统率":"68","智力":"50","速度":"62","武成长":"1.6","统成长":"1.7","智成长":"1.0","速成长":"1.0","特点":"","生平":"陈留人，父亲和刘焉是老朋友，一家人跟着刘焉进了蜀。｜他妹妹先嫁刘焉的儿子刘瑁，刘瑁死后守寡。刘备得了益州，群臣劝他娶这位寡妇，刘备嫌和刘瑁同族，法正拿晋文公和子圉作比，事情就定了。｜诸葛亮死后，吴懿督守汉中。"},{"名":"张翼","阵营":"蜀","定位":"武将","品阶":"名","武力":"72","统率":"68","智力":"48","速度":"64","武成长":"1.6","统成长":"1.7","智成长":"1.0","速成长":"1.1","特点":"","生平":"犍为武阳人。做庲降都督时，南中豪帅刘胄反了，朝廷召他回去，部下劝他快走，他不肯：「吾以蛮夷蠢动，不称职故还耳。」直到把粮草备齐，才交给马忠动身。｜洮西大胜，他劝姜维：「可止矣，不宜复进。」姜维大怒，接着围狄道，没有打下来。"},{"名":"张嶷","阵营":"蜀","定位":"武将","品阶":"名","武力":"74","统率":"66","智力":"52","速度":"66","武成长":"1.7","统成长":"1.6","智成长":"1.1","速成长":"1.1","特点":"","生平":"巴郡南充国人，年轻时做县功曹，山贼攻县，县长扔下家眷逃了。张嶷冒着刀枪冲进去，背起县长的夫人跑了出来。｜晚年他腿脚有病，拄着拐杖才能站起来，照样跟姜维北伐。在襄武和魏将徐质交战，他死在阵前，杀伤的敌人比自己的兵多一倍。"},{"名":"傅佥","阵营":"蜀","定位":"武将","品阶":"名","武力":"76","统率":"68","智力":"36","速度":"64","武成长":"1.9","统成长":"1.8","智成长":"0.6","速成长":"1.1","特点":"死守阳安","生平":"傅肜的儿子，父亲在夷陵断后战死，他在蜀中长大。｜钟会大军压到阳安关，副将蒋舒要出城迎战，他不肯。蒋舒自己领兵出去，转身降了魏。胡烈趁虚攻进关来，傅佥力战，马倒了，他拔剑自刎：「吾生为蜀臣，死亦当为蜀鬼！」"},{"名":"诸葛瞻","阵营":"蜀","定位":"武将","品阶":"名","武力":"66","统率":"62","智力":"66","速度":"60","武成长":"1.5","统成长":"1.4","智成长":"1.6","速成长":"1.0","特点":"","生平":"诸葛亮在军中给哥哥诸葛瑾写信：「瞻今已八岁，聪慧可爱，嫌其早成，恐不为重器耳。」｜邓艾从阴平出来，诸葛瞻领兵迎到绵竹。邓艾派人送信，许他投降就表为琅邪王。他斩了来使，出阵迎战，死在阵中。｜儿子诸葛尚闻讯：「父子荷国重恩，不早斩黄皓，以致倾败，用生何为！」拍马冲进魏军。"},{"名":"霍峻","阵营":"蜀","定位":"武将","品阶":"名","武力":"68","统率":"72","智力":"50","速度":"58","武成长":"1.5","统成长":"2.0","智成长":"1.0","速成长":"0.8","特点":"守葭萌，统率型","生平":"南郡枝江人。刘备南下攻刘璋，把葭萌城交给他守。｜张鲁派杨帛来，要帮着一起守城，霍峻回话：「小人头可得，城不可得。」杨帛只好退走。｜刘璋的将领扶禁、向存带一万多人围城，围了将近一年。城里只有几百人，霍峻瞅准敌军松懈，挑出精兵开门杀出去，斩了向存。"},{"名":"罗宪","阵营":"蜀","定位":"武将","品阶":"名","武力":"70","统率":"70","智力":"54","速度":"60","武成长":"1.6","统成长":"1.9","智成长":"1.1","速成长":"0.9","特点":"守永安","生平":"成都投降的消息传到永安，城里人心惶惶。罗宪斩了一个造谣的，领着部下在都亭哭了三天。｜吴国派兵西上想趁机夺城，罗宪闭门拒守。陆抗带三万人围城，围了六个月，城里一大半人病倒，他还是不开门，一直等到晋朝的援兵赶来。"},{"名":"李严","阵营":"蜀","定位":"武将","品阶":"名","武力":"70","统率":"66","智力":"58","速度":"60","武成长":"1.5","统成长":"1.6","智成长":"1.2","速成长":"0.9","特点":"","生平":"南阳人。刘备在白帝城临终，把太子托给诸葛亮，李严做副手，统领内外军事。｜诸葛亮在祁山打仗，李严管运粮，赶上连日大雨，粮运不上，他派人传话叫诸葛亮退兵。等诸葛亮退回来，他又装作吃惊：「军粮饶足，何以便归！」｜事情败露，他废为平民，迁到梓潼。听到诸葛亮的死讯，他发病死了。"},{"名":"刘封","阵营":"蜀","定位":"武将","品阶":"名","武力":"76","统率":"62","智力":"30","速度":"68","武成长":"1.9","统成长":"1.4","智成长":"0.5","速成长":"1.2","特点":"","生平":"本姓寇，罗侯寇氏的儿子。刘备到荆州时还没有儿子，收他做了养子。｜关羽围樊城，接连派人叫他和孟达发兵，他推说山郡刚刚归附，不肯动。｜孟达降魏后写信劝他一起走，他不理。申仪一反，他逃回成都，刘备命他自尽。临死他叹：「恨不用孟子度之言！」"},{"名":"关索","阵营":"蜀","定位":"武将","品阶":"名","武力":"78","统率":"62","智力":"30","速度":"72","武成长":"2.1","统成长":"1.3","智成长":"0.5","速成长":"1.4","特点":"","生平":"关羽的第三子。荆州失守那年，他受了伤，在鲍家庄养着，没能跟在父亲身边。｜伤好后入川，正赶上诸葛亮南征，就做了先锋，一路打进南中。｜正史里找不到这个人，贵州、云南却有好几处关索岭。"},{"名":"鲍三娘","阵营":"蜀","定位":"武将","品阶":"名","武力":"74","统率":"58","智力":"32","速度":"76","武成长":"2.0","统成长":"1.2","智成长":"0.5","速成长":"1.6","特点":"","生平":"鲍家庄的女儿，使得好刀，放出话来：谁打赢她，她就嫁谁。来比的人都输了回去。｜关索路过，下场跟她交手，赢了。她跟了关索，一起投奔蜀中。｜民间传她后来守在葭萌关一带，昭化古城外有座坟，当地人叫它鲍三娘墓。"},{"名":"傅肜","阵营":"蜀","定位":"武将","品阶":"名","武力":"74","统率":"70","智力":"32","速度":"62","武成长":"1.8","统成长":"1.9","智成长":"0.5","速成长":"1.0","特点":"断后","生平":"刘备在夷陵大败，连夜往白帝城退，傅肜领兵断后。｜身边的人一个个倒下，吴军围上来劝降，他骂：「吴狗！何有汉将军降者！」死在乱军里。｜他的儿子傅佥后来守阳安关，也没有降。"},{"名":"柳隐","阵营":"蜀","定位":"武将","品阶":"名","武力":"68","统率":"74","智力":"48","速度":"56","武成长":"1.4","统成长":"2.0","智成长":"1.0","速成长":"0.8","特点":"守黄金围，名档统率顶格","生平":"成都人，跟着姜维北伐，常做先锋，很少吃亏。｜钟会大军南下，汉中各处关围接连失守，只有柳隐守的黄金围始终没打下来。直到后主的手令送到，他才开围投降。｜入晋后，他做了西河太守。"},{"名":"习珍","阵营":"蜀","定位":"武将","品阶":"名","武力":"70","统率":"70","智力":"44","速度":"60","武成长":"1.6","统成长":"1.9","智成长":"0.8","速成长":"0.9","特点":"孤山","生平":"关羽丢了荆州，零陵北部都尉习珍不肯降吴，拉起人马守在孤山。｜潘濬领兵来讨。他守了一个多月，粮吃尽，箭射完，对部下讲受了汉家的恩，只有一死，拔剑自刎。｜刘备听到消息，追赠他为邵陵太守。"},{"名":"关银屏","阵营":"蜀","定位":"武将","品阶":"名","武力":"76","统率":"60","智力":"40","速度":"74","武成长":"2.0","统成长":"1.3","智成长":"0.7","速成长":"1.5","特点":"","生平":"孙权派人替儿子求亲，要娶关羽的女儿。关羽骂走了使者：「吾虎女安肯嫁犬子乎！」民间传说，这个女儿就是关银屏。｜后来她嫁给李恢的儿子李遗，随诸葛亮南征。云南民间叫她关三小姐。"},{"名":"马云禄","阵营":"蜀","定位":"武将","品阶":"名","武力":"75","统率":"58","智力":"34","速度":"76","武成长":"2.0","统成长":"1.2","智成长":"0.5","速成长":"1.6","特点":"","生平":"马超的妹妹，出自民国周大荒写的《反三国演义》。书里她跟着兄长投了刘备，后来嫁给了赵云。｜正史上找不到这个人。马超临终的上疏里，家里只剩一个从弟马岱。"},{"名":"邓芝","阵营":"蜀","定位":"文臣","品阶":"名","武力":"40","统率":"58","智力":"78","速度":"56","武成长":"0.5","统成长":"1.4","智成长":"2.1","速成长":"0.9","特点":"使吴","生平":"新野人，刘备死在白帝城，诸葛亮担心孙权变卦，邓芝自请出使东吴。｜孙权迟迟不见他，他上表：「臣今来亦欲为吴，非但为蜀也。」见了面，孙权问，灭魏以后两家平分天下好不好。他答，到那时两国的仗才刚开打。孙权大笑：「君之诚款，乃当尔邪！」｜他后来做到车骑将军，死时家无余财。"},{"名":"秦宓","阵营":"蜀","定位":"文臣","品阶":"名","武力":"30","统率":"50","智力":"80","速度":"54","武成长":"0.3","统成长":"1.0","智成长":"2.1","速成长":"0.9","特点":"天辩","生平":"广汉绵竹人，屡次称病不肯做官。刘备伐吴前，他上言天时不利，下了狱。｜吴使张温到成都，席上问他：「天有头乎？」他答：「有之，在西方。」张温又问天有没有耳朵、有没有脚，他句句引《诗》作答。最后问天姓什么，他道：「姓刘。」张温问何以知之，他答：「天子姓刘，故以此知之。」"},{"名":"马谡","阵营":"蜀","定位":"文臣","品阶":"名","武力":"36","统率":"46","智力":"84","速度":"60","武成长":"0.4","统成长":"0.8","智成长":"2.3","速成长":"1.0","特点":"言过其实：智高统薄","生平":"马良的弟弟，好论军计，诸葛亮常跟他谈到半夜。刘备临终交代诸葛亮：「马谡言过其实，不可大用。」｜南征孟获，诸葛亮送出几十里，问他有何良策。他答：「攻心为上，攻城为下。」｜第一次北伐，他守街亭，不按节度扎营，把兵拉上了山，张郃断了他的水道。回到汉中，诸葛亮挥泪斩了他，十万将士落泪。"},{"名":"杨仪","阵营":"蜀","定位":"文臣","品阶":"名","武力":"32","统率":"54","智力":"78","速度":"56","武成长":"0.3","统成长":"1.2","智成长":"2.0","速成长":"0.9","特点":"","生平":"襄阳人，在诸葛亮军中做长史，调度部伍粮草。魏延和他不和，拔刀在他面前比划，他哭得涕泪横流。｜诸葛亮死在五丈原，他领大军撤回。魏延烧栈道拦路，兵败，首级送来，他一脚踩上去：「庸奴！复能作恶不？」｜回成都后他只得了闲职，对费祎抱怨当初不如投魏。费祎把话报了上去，他废为平民，最后自杀。"},{"名":"谯周","阵营":"蜀","定位":"文臣","品阶":"名","武力":"28","统率":"50","智力":"76","速度":"50","武成长":"0.2","统成长":"1.1","智成长":"2.0","速成长":"0.8","特点":"","生平":"巴西西充人，头一回见诸葛亮，左右都笑了。事后有司要治笑的人，诸葛亮道：「孤尚不能忍，况左右乎！」｜诸葛亮死在五丈原，他在家听到消息立刻动身。随后朝廷下诏不许官员前去，只有他走得快，赶到了。｜邓艾兵临成都，群臣有主张南逃的，有主张投吴的。谯周力主出降，刘禅照他的话做了。"},{"名":"张松","阵营":"蜀","定位":"文臣","品阶":"名","武力":"30","统率":"48","智力":"82","速度":"58","武成长":"0.3","统成长":"1.0","智成长":"2.2","速成长":"1.0","特点":"","生平":"刘璋的别驾，个子矮小，放荡不治节操。他奉命去见曹操，曹操刚拿下荆州，没怎么理他。｜杨修拿出曹操写的兵书给他看，他翻了一遍，当场背了出来。回到益州，他劝刘璋跟曹操断交，去结好刘备，又把西川的地理图献给了刘备。｜刘备入川后，他写给刘备的密信败露，告发他的是亲哥哥张肃。刘璋把他斩了。"},{"名":"董允","阵营":"蜀","定位":"辅助","品阶":"名","武力":"38","统率":"62","智力":"74","速度":"54","武成长":"0.5","统成长":"1.6","智成长":"2.0","速成长":"0.9","特点":"","生平":"董和的儿子。年轻时和费祎去赴许靖儿子的丧礼，父亲给了辆简陋的鹿车，他面露难色，费祎抬脚先上了车。｜诸葛亮北伐前上《出师表》，把宫中的事托付给他。刘禅想多选些宫女，他不答应。宦官黄皓怕他，他活着的时候，黄皓的官不过黄门丞。"},{"名":"费祎","阵营":"蜀","定位":"辅助","品阶":"名","武力":"40","统率":"62","智力":"78","速度":"58","武成长":"0.5","统成长":"1.5","智成长":"2.2","速成长":"1.0","特点":"","生平":"江夏鄳县人。几次出使东吴，孙权爱拿酒灌他，趁醉发难，诸葛恪在旁边跟着辩，他一条条答回去。｜他看公文，扫一眼就知道要旨。早晚办完政务，其余时间会客、吃喝、下棋。董允接他的班学他这样办，不到十天，公事就积压起来了。｜延熙十六年正月大宴，他喝醉了，魏国降人郭修上前刺死了他。"},{"名":"糜竺","阵营":"蜀","定位":"辅助","品阶":"名","武力":"36","统率":"58","智力":"70","速度":"54","武成长":"0.4","统成长":"1.3","智成长":"1.9","速成长":"0.9","特点":"富商","生平":"东海朐县人，祖上世代经商，家中僮仆食客上万。｜刘备在广陵被吕布打得走投无路，他把妹妹嫁给刘备，又送去奴客两千人和大批金银，军中这才缓过来。入蜀后他位在诸葛亮之上，却从没带过兵。｜弟弟糜芳在南郡开城降了吴，他把自己绑了去请罪。刘备好言安慰，他还是羞愤成病，一年多后去世。"},{"名":"简雍","阵营":"蜀","定位":"辅助","品阶":"名","武力":"34","统率":"54","智力":"72","速度":"58","武成长":"0.4","统成长":"1.2","智成长":"1.9","速成长":"1.0","特点":"","生平":"涿郡人，刘备小时候的朋友。在刘备席上也盘腿歪坐。刘备围成都，派他劝降，刘璋和他同坐一辆车出了城。｜蜀中天旱禁酒，藏酿酒器具的也治罪。他陪刘备出游，见一男一女走在路上，便道：「彼人欲行淫，何以不缚？」刘备问他怎么知道，他答：「彼有其具，与欲酿者同。」刘备大笑，放了那些藏酿具的人。"},{"名":"孙乾","阵营":"蜀","定位":"辅助","品阶":"名","武力":"34","统率":"56","智力":"72","速度":"56","武成长":"0.4","统成长":"1.3","智成长":"1.9","速成长":"0.9","特点":"","生平":"北海人，郑玄把他推荐给了州里。刘备领徐州，召他做从事，从此跟着刘备四处奔走。｜刘备投袁绍、投刘表，打前站的都是他。袁谭、袁尚兄弟相争，刘表写信劝和，信里有一句：「每与刘左将军、孙公祐共论此事，未尝不痛心入骨。」｜入蜀后他做到秉忠将军，礼遇和简雍一样，没过多久就去世了。"},{"名":"伊籍","阵营":"蜀","定位":"辅助","品阶":"名","武力":"36","统率":"56","智力":"74","速度":"60","武成长":"0.4","统成长":"1.3","智成长":"2.0","速成长":"1.1","特点":"","生平":"山阳人，早年投在同乡刘表门下，刘备在荆州时，他常去走动。｜蔡瑁在襄阳设宴要害刘备，伊籍悄悄递话：东、南、北三门都有伏兵，只有西门可走。刘备跃马过了檀溪。｜后来他出使东吴。孙权要当面挫他，等他刚拜下去就问：「劳事无道之君乎？」他应声答：「一拜一起，未足为劳。」"},{"名":"糜夫人","阵营":"蜀","定位":"辅助","品阶":"名","武力":"28","统率":"54","智力":"70","速度":"56","武成长":"0.3","统成长":"1.3","智成长":"1.9","速成长":"0.9","特点":"","生平":"糜竺的妹妹，刘备在广陵最窘的时候嫁过去的。｜长坂坡乱军里，她腿上带伤，抱着阿斗坐在断墙下一口枯井边。赵云找到她，要把马让给她骑。她把阿斗塞到赵云怀里，求他护住刘备这点骨血。赵云再三催她上马，她转身跳进了枯井。｜赵云推倒土墙，把井口掩上，抱着阿斗杀了出去。"},{"名":"刘巴","阵营":"蜀","定位":"辅助","品阶":"名","武力":"32","统率":"58","智力":"80","速度":"54","武成长":"0.3","统成长":"1.4","智成长":"2.3","速成长":"0.9","特点":"直百钱","生平":"零陵人。刘备在荆州招揽人，他不肯去，北上投了曹操，又辗转到了益州。｜张飞到他家借宿，他一句话也不跟张飞讲。诸葛亮来劝，他道：「大丈夫处世，当交四海英雄，如何与兵子共语乎？」｜刘备取成都，府库让士兵抢空了，军用不足。刘巴献策，铸直百钱，平抑物价，由官府开市。几个月后，府库又满了。"},{"名":"蒲元","阵营":"蜀","定位":"辅助","品阶":"名","武力":"46","统率":"56","智力":"74","速度":"52","武成长":"0.7","统成长":"1.3","智成长":"2.0","速成长":"0.8","特点":"铁匠","生平":"《三国志》里没有他，事迹只零星见于类书。他替诸葛亮在斜谷造刀，一口气打了三千口。｜他嫌汉水钝弱，不能淬火，派人去成都取蜀江水。取水的人过涪津时打翻了水，掺了涪水凑数。蒲元一淬便知，指出里面杂了八升涪水，那人只好叩头认了。｜刀造好，他拿竹筒装满铁珠，举刀一砍，竹筒应手而断。"},{"名":"蒋钦","阵营":"吴","定位":"武将","品阶":"名","武力":"76","统率":"64","智力":"36","速度":"68","武成长":"1.9","统成长":"1.5","智成长":"0.6","速成长":"1.2","特点":"","生平":"九江寿春人，跟着孙策从江北过来。孙权有一回去他家，看见他母亲睡的是粗布帐子，妻妾穿布裙，当即叫人给他家做衣服、换帐子。｜徐盛早年差点杀了他的部下，两人结了怨。后来孙权问起徐盛，他却极力称赞，徐盛这才服了他。｜吕蒙袭荆州，他领水军入沔水，回军途中病逝。"},{"名":"陈武","阵营":"吴","定位":"武将","品阶":"名","武力":"78","统率":"60","智力":"24","速度":"70","武成长":"2.1","统成长":"1.3","智成长":"0.3","速成长":"1.3","特点":"","生平":"庐江松滋人，身长七尺七寸，十八岁就去寿春投了孙策。他待人厚道，乡里人多来归附，孙权也常去他家。｜建安二十年，孙权攻合肥，张辽出城突袭，陈武死战，没能回来。孙权亲自给他送葬。据《江表传》，孙权还下令让他的爱妾殉了葬。"},{"名":"董袭","阵营":"吴","定位":"武将","品阶":"名","武力":"77","统率":"66","智力":"26","速度":"62","武成长":"2.0","统成长":"1.6","智成长":"0.4","速成长":"1.0","特点":"","生平":"会稽余姚人，身高八尺。｜孙权征黄祖，黄祖用两艘蒙冲横在沔口，上千人拿弩交射。董袭和凌统各领敢死队，乘大船冲进去，董袭亲手砍断了蒙冲的缆绳。｜后来在濡须口，夜里起了暴风，他的五楼船要翻，左右放下小船请他走。他大怒：「受将军任，在此备贼，何等委去也，敢复言此者斩！」船就沉了。"},{"名":"潘璋","阵营":"吴","定位":"武将","品阶":"名","武力":"76","统率":"62","智力":"34","速度":"68","武成长":"1.9","统成长":"1.4","智成长":"0.6","速成长":"1.2","特点":"","生平":"东郡发干人，好喝酒，家里穷，常赊酒喝，讨债的上门，他就说等以后发了财再还。｜关羽走麦城，潘璋和朱然在临沮截住去路，他手下的司马马忠擒住了关羽父子。关羽的青龙刀落到了他手里。｜刘备东征，关兴在乱军中追上他，一刀斩了，夺回了父亲的青龙刀，提着首级去祭关羽。"},{"名":"朱桓","阵营":"吴","定位":"武将","品阶":"名","武力":"74","统率":"68","智力":"52","速度":"64","武成长":"1.7","统成长":"1.8","智成长":"1.1","速成长":"1.1","特点":"","生平":"吴郡吴县人。黄武初年曹仁带数万人攻濡须，朱桓手下只有五千，诸将害怕。他道守城以逸待劳，照样开营迎战。曹仁分兵偷袭中洲，他派兵截击，斩了常雕。｜有一回他要远行，孙权设宴送他。他上前请求：「愿一捋陛下须，无所复恨。」孙权探身凑过来，他捋着胡子道：「臣今日真可谓捋虎须也。」孙权大笑。"},{"名":"朱然","阵营":"吴","定位":"武将","品阶":"名","武力":"70","统率":"72","智力":"50","速度":"62","武成长":"1.5","统成长":"2.0","智成长":"1.0","速成长":"1.0","特点":"守江陵，统率型","生平":"本姓施，舅舅朱治没有儿子，把他过继了过去。小时候他和孙权在一处读书。关羽败走，他和潘璋在临沮截住了去路。｜吕蒙死后他接手江陵。魏军三路南下，曹真、夏侯尚把江陵围了六个月，城里很多人得了肿病，能打的只剩五千。朱然照常起居，看准时机出城，一连破了魏军两座营寨。"},{"名":"全琮","阵营":"吴","定位":"武将","品阶":"名","武力":"72","统率":"66","智力":"48","速度":"64","武成长":"1.6","统成长":"1.6","智成长":"1.0","速成长":"1.1","特点":"","生平":"吴郡钱唐人。父亲全柔让他运几千斛米去吴郡卖，他把米全散给了缺粮的士人，空船回来。全柔大怒，他磕头答：「愚以所市非急，而士大夫方有倒县之患，故便振赡，不及启报。」｜后来他娶了孙权的女儿孙鲁班，做到右大司马。太子孙和与鲁王孙霸相争，他的儿子全寄跟在鲁王身边。"},{"名":"凌操","阵营":"吴","定位":"武将","品阶":"名","武力":"76","统率":"60","智力":"28","速度":"72","武成长":"1.9","统成长":"1.3","智成长":"0.4","速成长":"1.4","特点":"","生平":"吴郡余杭人，年轻时好行侠，孙策起兵就跟了去，每战冲在前头。｜建安八年孙权讨黄祖，他驾着轻船打头阵，已经破了黄祖的前锋，一支箭飞来射中了他。放箭的是当时还在黄祖营中的甘宁。｜儿子凌统那年十五岁，接着带他的兵。"},{"名":"朱治","阵营":"吴","定位":"武将","品阶":"名","武力":"68","统率":"66","智力":"50","速度":"58","武成长":"1.5","统成长":"1.6","智成长":"1.0","速成长":"0.9","特点":"","生平":"丹阳故鄣人，早年跟着孙坚打仗。孙坚死后，他看出袁术成不了事，劝孙策回江东。｜孙权十五岁那年，是朱治举了他孝廉。后来孙权做了吴王，朱治每次来见，孙权都亲自迎出去，手执笏版和他对拜。｜他没有儿子，把外甥施然过继来，就是后来守江陵的朱然。"},{"名":"吕岱","阵营":"吴","定位":"武将","品阶":"名","武力":"70","统率":"68","智力":"56","速度":"58","武成长":"1.5","统成长":"1.8","智成长":"1.2","速成长":"0.8","特点":"九十多岁还在打，成长稳","生平":"广陵海陵人，起初只是郡县小吏。他在交州平了士徽，又派人南下宣谕，扶南、林邑的国王都遣使来朝。｜好友徐原常当众挑他的错，有人告诉他，他只道：「是我所以贵德渊者也。」徐原死了，他哭得很伤心。｜八十多岁还在带兵，九十六岁去世，遗命用素棺、粗布衣，丧事一切从简。"},{"名":"贺齐","阵营":"吴","定位":"武将","品阶":"名","武力":"76","统率":"70","智力":"46","速度":"64","武成长":"1.8","统成长":"1.9","智成长":"0.9","速成长":"1.1","特点":"华甲","生平":"会稽山阴人，年轻时做剡县长。县吏斯从仗着宗族作恶，主簿劝他别碰，他当场斩了斯从。此后多年，他在深山里一路打山越。｜他爱排场，船上雕花涂丹，青盖红帷，刀枪盾牌画着花纹，战船望去像一座山。魏将曹休在对岸看见，心里发怵，退了兵。"},{"名":"留赞","阵营":"吴","定位":"武将","品阶":"名","武力":"74","统率":"64","智力":"40","速度":"60","武成长":"2.0","统成长":"1.5","智成长":"0.8","速成长":"1.0","特点":"白发老将，大器晚成","生平":"会稽长山人，做郡吏时斩了黄巾头目吴桓，一条腿伤得伸不直。他拿刀割开腿筋，硬把腿拉直，又能走路了。｜每次上阵，他先披散头发仰天大叫，放声高歌，左右齐和，唱完才冲出去。｜七十三岁随孙峻北上，病中遭魏军追上。他解下印绶交给部下，自己留下迎战：「吾为将积年，今败于此，天命也。」"},{"名":"诸葛恪","阵营":"吴","定位":"文臣","品阶":"名","武力":"48","统率":"56","智力":"84","速度":"62","武成长":"0.7","统成长":"1.2","智成长":"2.3","速成长":"1.0","特点":"聪明，冒进","生平":"诸葛瑾的长子。孙权大宴群臣，牵来一头驴，脸上挂着「诸葛子瑜」，笑他父亲脸长。他跪下讨了笔，在下面添了两个字：「之驴」。满座大笑。｜孙权死后他辅政，东兴一战大破魏军。第二年他发二十万人围新城，久攻不下，士卒病倒大半。｜孙峻设宴请他，出门时狗咬住他的衣襟不放。他还是去了。"},{"名":"步骘","阵营":"吴","定位":"文臣","品阶":"名","武力":"40","统率":"58","智力":"78","速度":"54","武成长":"0.5","统成长":"1.4","智成长":"2.0","速成长":"0.9","特点":"","生平":"临淮淮阴人，避乱江东，和卫旌一起种瓜糊口。｜两人去拜会当地豪强焦征羌，主人面前摆满菜肴，给他们的只是小盘饭和几根青菜。卫旌吃不下，步骘吃得饱饱的才告辞。出门卫旌发火，他答：「吾等贫贱，是以主人以贫贱遇之，固其宜也，当何所耻？」｜后来他出任交州刺史，斩了苍梧太守吴巨，晚年官至丞相。"},{"名":"阚泽","阵营":"吴","定位":"文臣","品阶":"名","武力":"30","统率":"52","智力":"80","速度":"58","武成长":"0.3","统成长":"1.1","智成长":"2.2","速成长":"1.0","特点":"","生平":"会稽山阴人，家里世代种地。他没钱买纸笔，就替人抄书，抄完一部，书也背下来了。｜赤壁战前，黄盖要诈降，他揣着降书划小船过江，见了曹操。曹操看出破绽，喝令推出去斩了，他仰天大笑。曹操问他笑什么，他笑曹操不识机谋，把信里的疑点一条条讲圆，曹操反倒给他赔了礼。"},{"名":"虞翻","阵营":"吴","定位":"文臣","品阶":"名"," "品阶":"名","武力":"76","统率":"74","智力":"14","速度":"50","武成长":"1.7","统成长":"2.1","智成长":"0.2","速成长":"0.6","特点":"藤甲，统率顶格速度垫底","生平":"乌戈国的国主，身高一丈二尺，不吃五谷，拿生蛇恶兽当饭。手下三万兵穿藤甲，藤条在油里泡半年，晒干再泡，刀箭扎不透，过江不沉。｜孟获请他出洞，蜀兵连败几阵。魏延一路诈败，把他引进盘蛇谷。谷口滚下木石，车里的火药点着，满谷藤甲沾火就烧。诸葛亮在山上看着，掉了眼泪。"},{"名":"木鹿大王","阵营":"无","定位":"文臣","品阶":"名","武力":"44","统率":"54","智力":"78","速度":"58","武成长":"0.7","统成长":"1.2","智成长":"2.0","速成长":"1.0","特点":"驱兽","生平":"八纳洞的洞主，骑白象，身挂金珠璎珞，腰里两口大刀。出阵时他念咒摇铃，狂风一起，虎豹豺狼、毒蛇恶蝎从阵后冲出来，蜀兵退了一阵。｜第二回诸葛亮推出几十辆车，车上是木头刻的巨兽，口里喷火，鼻孔冒烟。真兽掉头往回跑，踩翻了自家的洞兵。木鹿大王死在乱军里。"},{"名":"朵思大王","阵营":"无","定位":"文臣","品阶":"名","武力":"36","统率":"50","智力":"80","速度":"54","武成长":"0.4","统成长":"1.1","智成长":"2.1","速成长":"0.9","特点":"毒泉","生平":"秃龙洞的洞主，孟获兵败来投他。他告诉孟获，进洞只有两条路，一条让木石堵了，另一条上有四口毒泉：哑泉、灭泉、黑泉、柔泉。喝了哑泉的水，人就开不了口，不过十天必死。｜蜀兵果然喝了哑泉。朵思在洞里摆酒，等着蜀兵自己死光。后来有个隐者给诸葛亮指了万安溪的水，蜀军全好了，朝秃龙洞开过来。"},{"名":"越吉元帅","阵营":"无","定位":"武将","品阶":"名","武力":"78","统率":"66","智力":"18","速度":"62","武成长":"2.0","统成长":"1.6","智成长":"0.2","速成长":"1.0","特点":"铁车","生平":"西羌国王彻里吉手下的元帅。羌兵把车用铁叶裹了，钉上钉子，骆驼骡马拉着，车里装粮草器械，叫铁车兵。｜魏国请羌兵攻蜀，关兴、张苞头一阵大败。诸葛亮赶到时正下大雪，他在营前挖坑，面上铺土，引铁车追过来。车一辆接一辆栽进坑里，后面的收不住。越吉往山谷里逃，迎面撞上关兴，只交了一合。"},{"名":"蹋顿","阵营":"无","定位":"武将","品阶":"名","武力":"76","统率":"64","智力":"24","速度":"72","武成长":"1.9","统成长":"1.5","智成长":"0.3","速成长":"1.5","特点":"乌桓骑","生平":"辽西乌桓人，单于丘力居的侄子。丘力居死时儿子楼班还小，三部乌桓都归蹋顿管。袁绍跟他结亲，送去单于印绶。｜袁绍死后，袁尚、袁熙兄弟逃到他那里。建安十二年，曹军出卢龙塞，在荒山里走了五百多里，到白狼山下撞上乌桓骑兵。张辽打头冲下山，乌桓阵脚一乱，蹋顿的头就让人砍了。"},{"名":"轲比能","阵营":"无","定位":"武将","品阶":"名","武力":"74","统率":"66","智力":"44","速度":"70","武成长":"1.7","统成长":"1.6","智成长":"0.9","速成长":"1.4","特点":"","生平":"鲜卑小种出身，打仗勇猛，分东西公平，不贪财物，部众推他做了大人。河北大乱，汉人逃到塞外投他，教鲜卑人造兵器铠甲，还教认字。｜他的部落越来越强，控弦十余万骑，魏国北边几任刺史都拿他没办法。青龙三年，幽州刺史王雄派了剑客韩龙过去。轲比能一死，鲜卑各部就散了。"},{"名":"公孙渊","阵营":"无","定位":"武将","品阶":"名","武力":"68","统率":"66","智力":"48","速度":"60","武成长":"1.5","统成长":"1.6","智成长":"1.0","速成长":"0.9","特点":"","生平":"辽东公孙家的第三代，从叔父公孙恭手里夺了位子。孙权派使者渡海来封他燕王，他砍了使者的头送到洛阳。几年后，他自己称了燕王。｜景初二年，司马懿围了襄平，城里粮尽，人吃人。他派人出城，愿送儿子做人质。司马懿回话：「军事大要有五，能战当战，不能战当守，不能守当走，余二事惟有降与死耳。」"},{"名":"花鬘","阵营":"无","定位":"武将","品阶":"名","武力":"72","统率":"58","智力":"36","速度":"76","武成长":"1.9","统成长":"1.2","智成长":"0.6","速成长":"1.6","特点":"","生平":"孟获和祝融夫人的女儿。《三国演义》里没有她，她的名字只在民间唱本和戏文里。｜诸葛亮南征，她叔叔孟优带人诈降，让诸葛亮一坛药酒灌倒，捆了个结实。关羽的儿子关索跟着蜀军到了南中。民间传下来的说法是，孟获归顺之后，她嫁了关索。"},{"名":"普净","阵营":"无","定位":"辅助","品阶":"名","武力":"24","统率":"56","智力":"78","速度":"52","武成长":"0.2","统成长":"1.4","智成长":"2.2","速成长":"0.8","特点":"点化","生平":"蒲东人，和关羽的家乡只隔一条河。在汜水关镇国寺出家。关羽过关那天，守将卞喜在寺里埋下刀斧手。普净敬茶时拿眼色示意，又把戒刀提了一提。｜后来他在当阳玉泉山搭了间草庵。一天夜里，半空有人喊「还我头来」。普净拿麈尾一击门户：「云长安在？」又问他，颜良、文丑、五关六将的头，该向谁去讨？"},{"名":"侯成","阵营":"汉","定位":"武将","品阶":"骁","武力":"62","统率":"52","智力":"28","速度":"60","武成长":"1.4","统成长":"1.1","智成长":"0.4","速成长":"1.0","特点":"绑吕布的三个","生平":"吕布手下的将领。丢了十五匹马，又亲自追了回来，众将来道贺，他酿了酒，先抬去献给吕布。吕布正下了禁酒令，打了他五十背花。｜当夜他盗出赤兔马，投了曹营。"},{"名":"宋宪","阵营":"汉","定位":"武将","品阶":"骁","武力":"64","统率":"50","智力":"22","速度":"62","武成长":"1.5","统成长":"1.0","智成长":"0.3","速成长":"1.1","特点":"","生平":"吕布的部将。下邳城里，吕布守着白门楼打盹，宋宪和魏续先偷走方天画戟，再拿绳子把他捆了。｜到了曹营，他跟着出征白马。颜良在阵前叫战，宋宪应声出马，没过三合，头就掉了。"},{"名":"魏续","阵营":"汉","定位":"武将","品阶":"骁","武力":"63","统率":"54","智力":"20","速度":"58","武成长":"1.4","统成长":"1.2","智成长":"0.3","速成长":"0.9","特点":"","生平":"吕布的内亲。高顺带的陷阵营七百人，攻无不破，吕布却把这支兵交给魏续带，打仗时才还给高顺。｜后来他随曹军到白马，宋宪死在颜良刀下，他在阵后喊：「杀我同伴，愿去报仇！」出马一合，也倒在同一口刀下。"},{"名":"张勋","阵营":"汉","定位":"武将","品阶":"骁","武力":"60","统率":"56","智力":"34","速度":"56","武成长":"1.2","统成长":"1.3","智成长":"0.6","速成长":"0.8","特点":"袁术大将","生平":"袁术称帝，拜他做大将军。他领着七路兵去打徐州，路上韩暹、杨奉倒了戈，吕布从阵中杀过来，七路兵全散了。｜袁术死后，他和长史杨弘带着部众想去投孙策，走到半路，全让庐江太守刘勋截下了。"},{"名":"桥蕤","阵营":"汉","定位":"武将","品阶":"骁","武力":"62","统率":"52","智力":"30","速度":"58","武成长":"1.3","统成长":"1.1","智成长":"0.5","速成长":"0.9","特点":"","生平":"袁术手下的大将，攻徐州的七路兵里，第二路是他。｜同一年曹操南下，袁术派他领五万人打头阵，在寿春边上迎住夏侯惇。两人交手不到三合，夏侯惇一枪刺他下马。"},{"名":"张济","阵营":"汉","定位":"武将","品阶":"骁","武力":"64","统率":"54","智力":"32","速度":"60","武成长":"1.4","统成长":"1.2","智成长":"0.5","速成长":"1.0","特点":"","生平":"武威人，董卓部将。董卓死后，他和李傕、郭汜、樊稠一起打进长安。｜关中闹饥荒，他从弘农带兵南下找粮，去打刘表的穰城，城下中了流箭。刘表的部下来道贺，刘表不受。他的兵马归了侄子张绣。"},{"名":"樊稠","阵营":"汉","定位":"武将","品阶":"骁","武力":"66","统率":"52","智力":"24","速度":"62","武成长":"1.6","统成长":"1.0","智成长":"0.3","速成长":"1.1","特点":"","生平":"董卓部将。马腾、韩遂打长安，他追韩遂追到陈仓。韩遂隔
